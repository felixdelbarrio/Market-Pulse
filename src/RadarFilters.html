<script>
window.MarketRadarFilters = (() => {
  // Search and interaction follow News Radar's searchable-selects.js.
  const normalize = value => String(value).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");

  const filterIcon = `<svg class="filter-icon" aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M11.9999 8.1001C11.9999 8.5971 11.5969 9.0001 11.0999 9.0001C10.6029 9.0001 10.1999 8.5971 10.1999 8.1001C10.1999 7.6031 10.6029 7.2001 11.0999 7.2001C11.5969 7.2001 11.9999 7.6031 11.9999 8.1001ZM22.3999 7.2001H13.5999V8.8001H22.3999V7.2001ZM20.7999 11.2001H10.3499V12.8001H20.7999V11.2001ZM19.1999 15.2001H10.3499V16.8001H19.1999V15.2001ZM7.43391 14.6341L5.56091 16.5081V5.6001H4.03891V16.5081L2.16591 14.6341L1.03491 15.7651L4.80091 19.5311L8.56691 15.7651L7.43591 14.6341H7.43391Z"/>
</svg>`;

  function flag(code, label) {
    const source = window.MarketRadarFlags[code];
    if (!source) return null;
    const image = document.createElement("img");
    image.className = "radar-flag";
    image.src = source;
    image.alt = label;
    return image;
  }
  function searchable(select, choose) {
    const details = document.createElement("div");
    const label = select.labels[0].firstChild.textContent.trim();
    details.className = "searchable-select";
    details.innerHTML = '<button class="select-trigger" type="button"></button><div class="select-popup" popover="manual"><input type="search" placeholder="Buscar opciones"><div class="select-options" role="listbox" tabindex="-1"></div><p class="small muted" hidden>Sin coincidencias</p></div>';
    const [summary, popup] = details.children;
    const [search, list, empty] = popup.children;
    list.id = select.id + "-options";
    if (select.multiple) list.setAttribute("aria-multiselectable", "true");
    list.setAttribute("aria-label", label);
    const description = select.getAttribute("aria-describedby");
    if (description) summary.setAttribute("aria-describedby", description);
    summary.setAttribute("aria-label", label);
    summary.setAttribute("aria-haspopup", "listbox");
    search.setAttribute("role", "combobox");
    search.setAttribute("aria-autocomplete", "list");
    search.setAttribute("aria-label", "Buscar opciones: " + label);
    for (const control of [summary,search]) {
      control.setAttribute("aria-controls", list.id);
      control.setAttribute("aria-expanded", "false");
    }
    select.before(details);
    details.append(select);
    select.hidden = true;
    select.labels[0].addEventListener("click", event => {
      event.preventDefault();
      summary.focus();
    });

    let active, opened = false;
    function position() {
      const anchor = summary.getBoundingClientRect();
      const viewport = document.documentElement;
      if (!anchor.width || anchor.bottom < 0 || anchor.top > viewport.clientHeight) return close(false);
      const below = viewport.clientHeight - anchor.bottom;
      const above = anchor.top;
      const upward = below < popup.scrollHeight && above > below;
      popup.style.left = anchor.left + "px";
      popup.style.width = anchor.width + "px";
      popup.style.maxHeight = Math.max(0, upward ? above : below) + "px";
      popup.style.top = upward ? "auto" : anchor.bottom + "px";
      popup.style.bottom = upward ? viewport.clientHeight - anchor.top + "px" : "auto";
    }
    function outside(event) {
      if (!details.contains(event.target)) close(false);
    }
    function open() {
      if (opened) return;
      opened = true;
      for (const control of [summary,search]) control.setAttribute("aria-expanded", "true");
      popup.showPopover();
      filter();
      position();
      if (!opened) return;
      (search.hidden ? list : search).focus({preventScroll:true});
      window.addEventListener("resize", position);
      window.addEventListener("scroll", position, true);
      document.addEventListener("pointerdown", outside);
      document.addEventListener("focusin", outside);
    }
    const visible = () => [...list.children].filter(option => !option.hidden && !option.disabled);
    function highlight(option) {
      active?.classList.remove("is-focused");
      active = option;
      active?.classList.add("is-focused");
      for (const control of [search,list]) {
        if (active) control.setAttribute("aria-activedescendant", active.id);
        else control.removeAttribute("aria-activedescendant");
      }
    }
    function filter() {
      const query = normalize(search.value);
      for (const option of list.children) option.hidden = !normalize(option.textContent).includes(query);
      const options = visible();
      empty.hidden = options.length > 0;
      highlight(options.find(option => option.getAttribute("aria-selected") === "true") || options[0]);
    }
    function refresh() {
      const options = [...select.options];
      summary.textContent = [...select.selectedOptions].map(option => option.textContent).join(", ") || "Sin selección";
      if (select.name === "country") {
        const image = flag(select.value, "");
        if (image) summary.prepend(image);
      }
      summary.setAttribute("aria-label", label + ": " + summary.textContent);
      search.hidden = options.length <= 6;
      list.replaceChildren(...options.map((option,index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.id = list.id + "-" + index;
        button.dataset.index = index;
        button.tabIndex = -1;
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", String(option.selected));
        button.disabled = option.disabled;
        if (["country","countries"].includes(select.name)) {
          const image = flag(option.value, option.textContent);
          if (image) {
            image.setAttribute("aria-hidden", "true");
            button.append(image);
          }
        }
        button.append(option.textContent);
        return button;
      }));
      filter();
      if (opened) position();
    }
    function close(restoreFocus = false) {
      if (!opened) return;
      opened = false;
      popup.hidePopover();
      for (const control of [summary,search]) control.setAttribute("aria-expanded", "false");
      window.removeEventListener("resize", position);
      window.removeEventListener("scroll", position, true);
      document.removeEventListener("pointerdown", outside);
      document.removeEventListener("focusin", outside);
      search.value = "";
      highlight(null);
      if (restoreFocus) summary.focus({preventScroll:true});
    }
    list.addEventListener("click", event => {
      const item = event.target.closest("[data-index]");
      if (!item || item.disabled) return;
      const option = select.options[Number(item.dataset.index)];
      if (select.multiple) {
        const values = choose(select.name, [...select.selectedOptions].map(o => o.value), option.value);
        for (const candidate of select.options) candidate.selected = values.includes(candidate.value);
      } else select.value = option.value;
      select.dispatchEvent(new Event("change", {bubbles:true}));
      if (!select.multiple) close(true);
      else (search.hidden ? list : search).focus();
    });
    list.addEventListener("pointerover", event => {
      const option = event.target.closest("[role=option]");
      if (option && !option.disabled) highlight(option);
    });
    select.addEventListener("change", refresh);
    search.addEventListener("input", filter);
    summary.addEventListener("click", () => opened ? close() : open());
    details.addEventListener("keydown", event => {
      if (event.key === "Escape" && opened) {
        event.preventDefault();
        event.stopPropagation();
        close(true);
      } else if (["ArrowDown","ArrowUp","Home","End"].includes(event.key)) {
        event.preventDefault();
        const wasOpen = opened;
        if (!wasOpen) open();
        const options = visible(), index = options.indexOf(active), step = event.key === "ArrowUp" ? -1 : 1;
        const next = event.key === "Home" ? 0 : event.key === "End" ? options.length - 1 :
          !wasOpen ? (step === 1 ? 0 : options.length - 1) : (index + step + options.length) % options.length;
        highlight(options[next]);
        active?.scrollIntoView({block:"nearest"});
      } else if (event.key === "Enter" && opened && event.target !== summary) {
        event.preventDefault();
        active?.click();
      }
    });
    return {refresh, close, enable: enabled => {
      summary.disabled = !enabled;
      if (!enabled) close();
    }};
  }

  function create(root, {applied, initial, all, commit, prepare, validate, choose, labelValue, translate = value => value, fixedChips = [], alwaysChips = [], omitChips = [], draftChanged}) {
    const form = root.querySelector("form");
    const fields = [...form.elements].filter(field => field.name);
    const labels = Object.fromEntries(fields.map(field => [field.name,field.labels[0].firstChild.textContent.trim()]));
    const combos = fields.filter(field => field.tagName === "SELECT").map(field => searchable(field,choose));
    const id = root.id;
    root.insertAdjacentHTML("afterbegin", `
      <div class="selection-toolbar${form.classList.contains("record-filters") ? " record-toolbar" : ""}">
        <button class="button" data-open type="button" aria-haspopup="dialog" aria-controls="${id}-dialog">${filterIcon} <span>Filtros</span></button>
        <div class="filter-chips" aria-label="Filtros activos" aria-live="polite" hidden></div>
      </div>
      <dialog class="filter-dialog${form.classList.contains("record-filters") ? " admin-record-dialog" : ""}" id="${id}-dialog" aria-labelledby="${id}-title">
        <div class="dialog-header"><h2 id="${id}-title">Filtros</h2><button class="button" data-close type="button" aria-label="Cerrar panel">✕</button></div>
        <div class="mobile-filters"></div>
        <div class="filter-dialog-actions">
          <button class="button" data-restore type="button">Restaurar filtros iniciales</button>
          <button class="button" data-all type="button">Ver todo</button>
          <button class="button primary" type="submit" form="${id}-form">Aplicar filtros</button>
        </div>
      </dialog>`);
    const dialog = root.querySelector("dialog"), opener = root.querySelector("[data-open]"), chips = root.querySelector(".filter-chips");
    root.tabIndex = -1;
    form.id = id + "-form";
    dialog.querySelector(".mobile-filters").append(form);
    form.hidden = false;
    form.noValidate = true;
    const sync = () => combos.forEach(combo => combo.refresh());
    const read = () => Object.fromEntries(fields.map(field => [field.name,field.multiple ?
      [...field.selectedOptions].map(option => option.value) : field.value]));
    const defaults = () => all?.() || {};
    const same = (a,b) => JSON.stringify(a ?? "") === JSON.stringify(b ?? "");
    let previousChips;
    function render() {
      const values = applied(), clear = defaults(), entries = [];

      for (const field of fields) {
        const key = field.name, value = values[key];
        if (omitChips.includes(key) || (!fixedChips.includes(key) && !alwaysChips.includes(key) && same(value,clear[key]))) continue;
        const readable = (Array.isArray(value) ? value : [value]).map(item =>
          labelValue?.(key,item) || (field.options && [...field.options].find(option => option.value === item)?.textContent) || item
        ).join(", ");
        entries.push([key,readable]);
      }
      const signature = JSON.stringify(entries.map(([key,readable]) => [translate(labels[key]),translate(readable)]));
      if (signature === previousChips) return;
      previousChips = signature;
      chips.replaceChildren();
      for (const [key,readable] of entries) {
        const fixed = fixedChips.includes(key) || same(values[key],clear[key]);
        const button = document.createElement(fixed ? "span" : "button");
        button.className = "filter-chip";
        if (fixed) {
          button.textContent = translate(labels[key]) + ": " + translate(readable);
          chips.append(button);
          continue;
        }
        button.type = "button";
        button.setAttribute("aria-label", translate("Quitar filtro {filter}",{filter:translate(labels[key])}));
        const text = document.createElement("span"), cross = document.createElement("span");
        text.textContent = translate(labels[key]) + ": " + translate(readable);
        cross.textContent = "×";
        cross.setAttribute("aria-hidden", "true");
        button.append(text,cross);
        button.addEventListener("click", () => {
          commit({...applied(),[key]:clear[key] ?? ""});
          (chips.querySelector("button") || (opener.disabled ? root : opener)).focus();
        });
        chips.append(button);
      }
      chips.hidden = !chips.childElementCount;
    }
    function apply(values, action) {
      dialog.close();
      commit(values,action);
    }
    opener.addEventListener("click", () => {
      prepare?.();
      const values = applied();
      for (const field of fields) {
        if (field.multiple) {
          for (const option of field.options) option.selected = values[field.name].includes(option.value);
        } else field.value = values[field.name] ?? "";
      }
      const advanced = form.querySelector(".filter-advanced");
      if (advanced) advanced.open = [...advanced.querySelectorAll("[name]")].some(field => field.value);
      validate?.(values);
      sync();
      dialog.showModal();
    });
    const close = () => dialog.close();
    dialog.querySelector("[data-close]").addEventListener("click", close);
    dialog.addEventListener("click", event => {
      if (event.target === dialog) {
        const bounds = dialog.getBoundingClientRect();
        if (event.clientX < bounds.left || event.clientX > bounds.right ||
            event.clientY < bounds.top || event.clientY > bounds.bottom) close();
      }
    });
    dialog.addEventListener("close", () => combos.forEach(combo => combo.close()));
    dialog.querySelector("[data-restore]").addEventListener("click", () => apply(initial(),"restore"));
    dialog.querySelector("[data-all]").addEventListener("click", () => apply(defaults(),"all"));
    if (validate) form.addEventListener("input", () => validate(read()));
    if (draftChanged) form.addEventListener("change", event => draftChanged(event.target.name,read()));
    form.addEventListener("submit", event => {
      event.preventDefault();
      const values = read();
      validate?.(values);
      const invalid = fields.find(field => !field.validity.valid);
      const advanced = invalid?.closest(".filter-advanced");
      if (advanced) advanced.open = true;
      if (form.reportValidity()) apply(values,"apply");
    });
    return {render, close, refresh: sync, enable: enabled => {
      opener.disabled = !enabled;
      if (enabled && document.activeElement === root) opener.focus();
    }};
  }
  return {create,flag,searchable};
})();
</script>
