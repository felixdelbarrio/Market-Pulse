    const metrics=cards=>(cards||[]).map(metric).join("");

      if(platform==="iOS")return`<svg viewBox="0 0 32 32" role="img" aria-label="iOS"><rect x="8" y="3.5" width="16" height="25" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="11" y="7" width="10" height="15" rx="1.5" fill="currentColor" opacity=".2"/><path d="M13 25.3h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
      if(platform==="Huawei")return`<span class="platform-monogram appgallery" aria-label="Huawei AppGallery">AG</span>`;
      return`<span class="platform-monogram all" aria-label="Todas las plataformas">•••</span>`;
    };
    const platformBadge=(platform,showLabel=true)=>`<span class="platform-badge platform-${esc(String(platform||"ALL").toLowerCase())}"><span class="platform-symbol">${platformSymbol(platform)}</span>${showLabel?`<span>${esc(({ALL:"Todas",Android:"Android",iOS:"iOS",Huawei:"Huawei"})[platform]||platform)}</span>`:""}</span>`;
    window.MarketsUI=Object.freeze({esc,icon,metric,metrics,empty,loading,legend,option,platformBadge});
  })();
</script>
