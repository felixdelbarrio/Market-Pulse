        ${Number.isInteger(row.helpful)?`<small>${U.esc(translate("{count} personas han encontrado útil esta reseña",{count:integer(row.helpful)}))}</small>`:""}
        <div class="review-blocks radar-filters">${row.attributionMethod?.startsWith("review_evidence_")?'<span class="filter-chip">Inferido</span>':""}${blocks.map(block=>`<span class="filter-chip">Bloque funcional · ${U.esc(block)}</span>`).join("")}</div>

    async function loadAnalytics(localOnly=false, heatmapOnly=false){
      const started=performance.now();
      // A new request must replace all panels still waiting for the superseded request.
      if(analyticsLoading){localOnly=false;heatmapOnly=false}
      analyticsLoading=true;
      const sheets=exportSheets.analytics;
      if(!localOnly)sheets.delete("Mapa de calor");
      if(!heatmapOnly){sheets.delete("Rating al cierre del mes");sheets.delete("Indicadores del periodo");sheets.delete("Reseñas más útiles");sheets.delete("Personas con más reseñas")}
      const token=++analyticsRequest, target=$("review-heatmap"), entityControl=$("analytics-entity");
      const scope=annualScope(), dates=annualDates(scope.year);
      radarFilters.analytics.render();
      if(!localOnly){
        target.setAttribute("aria-busy","true");
        const matrix=target.querySelector("[data-matrix]");
        if(matrix){matrix.innerHTML=U.loading(translate("Cargando el mapa de calor"));target.querySelector("[data-pages]").replaceChildren()}
        else target.innerHTML=U.loading(translate("Cargando el mapa de calor"));
      }
      if(!heatmapOnly){$("annual-chart").innerHTML=U.loading(translate("Cargando el histórico de ratings"));$("annual-series").replaceChildren()}
      if(!heatmapOnly)$("review-annual").innerHTML=U.loading(translate("Cargando indicadores de reseñas"));
      try{
        const countryCode=scope.country==="ALL"?"":scope.country;
        const request={countryCode,platform:"",segment:"ALL",months:36,bbvaOnly:false};
        const trends=heatmapOnly||scope.country==="UNKNOWN"?[]:fetchTrends(request);
        const chartReady=Promise.resolve(trends).then(rows=>{
          if(token!==analyticsRequest||state.view!=="analytics"||heatmapOnly)return;
          annualTrends=scope.country==="UNKNOWN"?[]:withPublishedRatings(rows,{country:scope.country,platform:"ALL"});
          renderAnnualChart(scope,dates,analyticsEntity);
          trackReady("analytics","Mostrar histórico de ratings",started);
        });
        const [data]=await Promise.all([
          fetchReviewData("review:analytics",{...scope,segment:heatmapSegment,entity:heatmapOnly?defaultAnalyticsEntity:analyticsEntity,language:appLanguage}),
          chartReady
        ]);
        if(token!==analyticsRequest||state.view!=="analytics")return;
        if(!localOnly)renderReviewMatrix(target,data,{...dates,country:scope.country,platform:"ALL",segment:heatmapSegment,audience:scope.audience,inferGeography:scope.inferGeography});
        if(!heatmapOnly){
          if(scope.country!=="UNKNOWN")annualYears=[...new Set(annualTrends.filter(row=>D.finite(row.ratingEom)).map(row=>row.month.slice(0,4)))].sort().reverse();
          const apps=new Set(data.entityOptions);
          for(const row of annualTrends)if(row.month.startsWith(scope.year)&&D.finite(row.ratingEom))apps.add(D.appName(row));
          apps.delete(defaultAnalyticsEntity);
          const compareCountry=isAnnualCountry(scope.country);
          const options=[...(compareCountry?["ALL"]:[]),defaultAnalyticsEntity,...[...apps].sort((a,b)=>a.localeCompare(b,locale()))];
          if(!options.includes(analyticsEntity)){
            analyticsEntity=defaultAnalyticsEntity;
            analyticsLoading=false;
            return loadAnalytics(true);
          }
          entityControl.innerHTML=options.map(name=>U.option(name,name===defaultAnalyticsEntity?"BBVA":annualEntityLabel(name),name===analyticsEntity)).join("");
          annualAppControl.refresh();
          renderAnnualChart(scope,dates,analyticsEntity);
          renderAnnualReviews($("review-annual"),data,scope);
        }
        trackReady("analytics",heatmapOnly?"Mostrar mapa de calor":"Mostrar análisis anual",started);
      }catch(error){
        if(token!==analyticsRequest||state.view!=="analytics")return;
        if(!localOnly)(target.querySelector("[data-matrix]")||target).textContent=error.message;
        if(!heatmapOnly&&$("annual-chart").querySelector(".loading-state"))$("annual-chart").textContent=error.message;
        if(!heatmapOnly)$("review-annual").textContent=error.message;
      }finally{
        if(token===analyticsRequest){
          target.setAttribute("aria-busy","false");
          analyticsLoading=false;
          annualAppControl.enable(Boolean(entityControl.options.length));
        }
      }
    }

    function renderAnnualReviews(target,{annual,topics},scope){
      const showRatings=scope.country!=="UNKNOWN"&&analyticsEntity!=="ALL";
      const rows=showRatings?D.trendRows(annualTrends,{country:scope.country,platform:"ALL",app:analyticsEntity}):[];

      const selected=months.filter(month=>month.startsWith(scope.year));
      const priorClose=(Number(scope.year)-1)+"-12";
      const opening=selected.length&&(months.includes(priorClose)?priorClose:selected[0]);
      const closing=selected.at(-1);
      const openingRating=D.ratingAt(rows,opening,scope.country==="ALL");
      const closingRating=D.ratingAt(rows,closing,scope.country==="ALL");
      const difference=(a,b)=>D.finite(a)&&D.finite(b)?a-b:null;
      const share=count=>annual.total?fmt(100*count/annual.total,1)+" %":"";
      const groups=[
        {title:"Volumen de reseñas",stats:[
          {label:"Reseñas del año seleccionado",number:annual.total,delta:difference(annual.total,annual.previousTotal)},
          {label:"Reseñas del año anterior",number:annual.previousTotal}
        ]},
        ...(showRatings?[{title:"Evolución del rating",stats:[
          {label:"Rating al inicio del periodo",number:openingRating,rating:true,foot:opening?monthLabel(opening):""},
          {label:"Último rating publicado del periodo",number:closingRating,rating:true,foot:closing?monthLabel(closing):"",delta:difference(closingRating,openingRating)}
        ]}]:[]),
        {title:"Distribución por sentimiento",stats:[
          {label:"Promotoras",number:annual.promoters,valueClass:"delta-up",foot:share(annual.promoters)},
          {label:"Neutras",number:annual.neutral,valueClass:"review-neutral-value",foot:share(annual.neutral)},
          {label:"Detractoras",number:annual.detractors,valueClass:"delta-down",foot:share(annual.detractors)}
        ]},
        {title:"Interacción con las reseñas",stats:[
          {label:"Reseñas contestadas",number:annual.answered,foot:share(annual.answered)},
          {label:"Reseñas útiles",number:annual.helpful,foot:share(annual.helpful)}

      const authors=annual.topAuthors.filter(row=>row.count>1);
      const filters=[...exportDates(annual),["Aplicación",annualEntityLabel(analyticsEntity)],["Comentarios",reviewFilterLabel("audience",scope.audience)],["Inferir datos",scope.inferGeography==="NO"?"No":"Sí"]];
      setExportSheet("analytics","Indicadores del periodo",scope.country,filters,["Indicador","Valor","Variación","Cierre"],
        annual.total||annual.previousTotal||D.finite(openingRating)||D.finite(closingRating)?

      setExportSheet("analytics","Reseñas más útiles",scope.country,[...filters,["Votos útiles mínimos",annual.helpfulMinimum]],
        reviewExportHeader,annual.topHelpful.map(review=>reviewExportRow(review,topics)));
      setExportSheet("analytics","Personas con más reseñas",scope.country,filters,["Persona","Reseñas"],
        authors.map(({author,count})=>[author,count]));
      const metrics=groups.map(({title,stats})=>`<section class="annual-metric-group"><h4>${U.esc(translate(title))}</h4>
        <div class="annual-metric-grid">${U.metrics(stats.map(({number,rating,delta,foot,...item})=>{
          const change=D.finite(delta)?signed(delta,rating?2:0):"";
          return {...item,value:rating?fmt(number,2):integer(number),
            foot:[foot,change].filter(Boolean).join(" · "),footClass:item.accent?"":delta>0?"delta-up":delta<0?"delta-down":""};
        }))}</div></section>`).join("");
      target.innerHTML=`<p class="review-chart-note">${U.esc(dateLabel(annual.start))} – ${U.esc(dateLabel(annual.end))} · <span>Todas las estrellas</span></p>
        <div class="annual-kpis">${metrics}</div>
        ${annual.topHelpful.length?`<section class="annual-review-section"><h4>Reseñas más útiles</h4><p>${U.esc(translate("Al menos {count} votos útiles",{count:integer(annual.helpfulMinimum)}))}</p>
          ${annual.topHelpful.map(review=>renderReviewCard(review,topics)).join("")}</section>`:""}
        ${authors.length?`<section class="annual-review-section"><h4>Personas con más reseñas</h4><div class="annual-author-list">
          ${authors.map(({author,count,reviews=[]})=>`<details class="annual-author">
            <summary><span data-review-content>${U.esc(author)}</span><strong>${U.esc(translate("{count} reseñas",{count:integer(count)}))}</strong></summary>
            <div class="annual-author-reviews">
              ${count>reviews.length?`<p>${U.esc(translate("Últimas {count} reseñas del periodo",{count:integer(reviews.length)}))}</p>`:""}
              ${reviews.map(review=>renderReviewCard(review,topics)).join("")}

    function renderReviewBalance(target,data,scope){
      target.innerHTML='<p class="review-chart-note">NPS en puntos sobre todas las reseñas válidas del mes. Una línea interrumpida indica un mes sin datos.</p>';
      $("review-balance-period").textContent=`${dateLabel(scope.start)} – ${dateLabel(scope.end)}`;
      if(!data.monthly.length){target.append("Sin observaciones para este intervalo.");return null}
      const plot=document.createElement("div"), tooltip=document.createElement("div");
      plot.className="trend-chart";
      const layout=document.createElement("div"), legend=document.createElement("aside");
      layout.className="map-layout";
      legend.className="geo-list";
      layout.append(plot,legend);
      tooltip.className="chart-tooltip";
      tooltip.hidden=true;
      tooltip.setAttribute("aria-hidden","true");
      function highlight(event){
        const point=event.target.closest("[data-point],[data-bucket]"), index=point?.dataset.point??point?.dataset.bucket;
        const band=index==null?null:plot.querySelector(`[data-bucket="${index}"]`);
        plot.querySelector(".chart-band.is-highlighted")?.classList.remove("is-highlighted");
        tooltip.hidden=!band;
        if(!band)return;
        band.classList.add("is-highlighted");
        tooltip.textContent=band.getAttribute("aria-label");
        const panel=target.closest(".trend-panel").getBoundingClientRect(), anchor=point.getBoundingClientRect();
        tooltip.style.left=Math.max(0,Math.min((event.clientX||anchor.x+anchor.width/2)-panel.x+12,panel.width-tooltip.offsetWidth))+"px";
        tooltip.style.top=Math.max(0,Math.min((event.clientY||anchor.y)-panel.y+16,panel.height-tooltip.offsetHeight))+"px";
      }
      for(const event of ["pointerover","pointermove","focusin"])plot.addEventListener(event,highlight);
      for(const event of ["pointerout","focusout"])plot.addEventListener(event,e=>highlight({target:plot.contains(e.relatedTarget)?e.relatedTarget:plot}));
      const months=[];
      const cursor=new Date(scope.start.slice(0,7)+"-01T00:00:00Z");
      while(cursor.toISOString().slice(0,7)<=scope.end.slice(0,7)){
        months.push(cursor.toISOString().slice(0,7));
        cursor.setUTCMonth(cursor.getUTCMonth()+1);
      }
      const points=new Map(), totals=new Map();
      for(const point of data.monthly){
        points.set(JSON.stringify([point.entity,point.month]),point.balance);
        totals.set(point.entity,(totals.get(point.entity)||0)+point.total);
      }
      const entities=data.monthlyEntityOptions;
      target.append(layout,tooltip);
      const series=entities.map(entity=>({entity,values:months.map(month=>points.get(JSON.stringify([entity,month]))??null)}));
      const render=()=>{
        tooltip.hidden=true;
        plot.innerHTML=C.reviewBalance(months,series,{fmt,monthLabel,width:plot.clientWidth});
      };
      render();
      legend.innerHTML=C.reviewBalanceLegend(entities.map(entity=>({entity,total:totals.get(entity)||0})),integer);
      return render;
    }
    function appendReviewCohort(target,label,scope){

    const heatmapColumns=8;
    function renderReviewMatrix(target,data,scope){
      const totals=new Map();
      for(const group of data.entities)for(const [id,count] of Object.entries(group.counts)){
        totals.set(id,(totals.get(id)||0)+count);
      }
      const ids=[...totals.keys()].sort((a,b)=>totals.get(b)-totals.get(a)||a.localeCompare(b));

    function renderAdminIssues(rows){if(!rows.length){$("admin-issues").innerHTML=U.empty("Sin incidencias recientes","Las capturas de la ventana revisada terminaron correctamente.");return}$("admin-issues").innerHTML=rows.map(row=>`<article class="admin-list-item"><div><strong>${U.esc(`${countryLabel(row.countryCode)} · ${row.appKey}`)}</strong><span>${U.esc(row.detail||"Sin detalle")}</span></div><div><span>${U.esc(row.platform)}</span>${statusBadge(row.status)}<time>${U.esc(dateTimeLabel(row.fetchedAt))}</time></div></article>`).join("")}
    function adminFilterScopeOptions(kind){
      const options=adminScopeOptions(kind).map(item=>kind==="country"&&item.value!=="ALL"?
        {...item,label:countryLabel(item.value)}:item);
      return [{value:"ANY",label:"Sin filtrar"},...options];
    }
    function nextAdminScopeSelection(current,value){if(value==="ANY")return["ANY"];if(value==="ALL")return["ALL"];const selected=new Set((current||[]).filter(item=>item!=="ALL"&&item!=="ANY"));if(selected.has(value))selected.delete(value);else selected.add(value);return selected.size?[...selected]:["ALL"]}
    function adminSubscriberFilterRows(rows){const filters=state.adminSubscriberFilters,query=filters.query.trim().toLowerCase(),scopeMatches=(values,selected)=>{const configured=values||[];if(selected.includes("ANY"))return true;if(selected.includes("ALL"))return configured.includes("ALL");if(configured.includes("ALL"))return false;return selected.some(value=>configured.includes(value))};return rows.filter(row=>(!query||String(row.email||"").toLowerCase().includes(query))&&(filters.status==="ALL"||(row.active?"ACTIVE":"PAUSED")===filters.status)&&(!filters.newsletter||(row.newsletterEnabled?"YES":"NO")===filters.newsletter)&&scopeMatches(row.countries,filters.countries)&&scopeMatches(row.platforms,filters.platforms))}
    function adminSubscriberScopeText(kind,values){if((values||[]).includes("ALL"))return kind==="country"?"Todos los mercados":"Todas las plataformas";return(values||[]).map(value=>kind==="country"?countryLabel(value):D.config.platformLabels[value]||value).join(", ")}
    const subscriberLanguageNames={es:"Español",en:"English",tr:"Türkçe"};
    function renderAdminSubscriptionTab(){
      const center=state.adminCenter;
      if(!center)return;
      radarFilters.admin.render();
      renderAdminSubscribers(center.subscribers||[]);

    function renderAdminNewsletterDelivery(center){
      const system=center.system, pipeline=system.reviewPipeline, operations=system.operations;
      const scheduled=operations?.unifiedAfter?pipeline?.installed:pipeline?.newsletterInstalled;
      $("newsletter-sender").textContent=[system.senderName,system.senderAddress&&`<${system.senderAddress}>`].filter(Boolean).join(" ");
      const checks=[["Remitente",system.senderAvailable?"Configurado":"Pendiente"],["Entrega",system.newsletterDeliveryEnabled?"Activada":"Desactivada"],
        ["Programación",scheduled===true?"Instalada":scheduled===false?"Sin activador":"Sin verificar"]];
      $("newsletter-checks").innerHTML=checks.map(([name,value])=>`<div class="delivery-check"><strong>${name}</strong><span>${value}</span></div>`).join("");
      $("newsletter-sender-status").textContent=system.senderAvailable?"El remitente se utiliza en los envíos automáticos y las pruebas.":system.senderError||"El remitente está pendiente de verificación.";
      $("newsletter-schedule").textContent=[system.newsletterSchedule,system.timeZone].filter(Boolean).join(" · ");
      const info=system.deliveries?.newsletter;
      const latestTest=(center.recentAlerts||[]).find(row=>row.type==="NEWSLETTER_TEST"&&row.timestamp&&row.userEmail);
      $("newsletter-history").innerHTML=[
        info?.lastDeliveryAt?`<strong>Último envío · ${U.esc(dateTimeLabel(info.lastDeliveryAt))}</strong>`:"<span>No hay envíos registrados.</span>",
        latestTest?`<span>Última prueba aceptada en el registro reciente · ${U.esc(dateTimeLabel(latestTest.timestamp))} · ${U.esc(latestTest.userEmail)}</span>`:""
      ].join("");

    function renderAdminSubscribers(rows){
      const filtered=adminSubscriberFilterRows(rows);
      $("admin-subscriber-results").textContent=`${integer(rows.length)} suscriptores · ${integer(filtered.length)} suscripciones en la selección`;
      const headings=["Suscriptor","Geografía","Idioma","Estado","Último envío","Acciones"];
      const geography=row=>adminSubscriberScopeText("country",row.countries);
      const language=row=>subscriberLanguageNames[row.newsletterLanguage]||"—";

      const size=20,pages=Math.max(1,Math.ceil(filtered.length/size));

        <tbody>${selected.map(row=>`<tr><td data-label="Suscriptor"><strong>${U.esc(row.email)}</strong></td>

          <td data-label="Último envío">${U.esc(lastDelivery(row))}</td><td data-label="Acciones"><div class="actions">
            <button type="button" class="button" data-action="edit" data-subscriber="${U.esc(row.email)}" aria-label="Editar ${U.esc(row.email)}">Editar</button>
            ${row.newsletterEnabled?`<button type="button" class="button" data-action="delete" data-subscriber="${U.esc(row.email)}" aria-label="Dar de baja ${U.esc(row.email)}">Dar de baja</button>`:""}
          </div></td></tr>`).join("")}</tbody></table></div>`:'<div class="panel empty"><p>Sin suscripciones.</p></div>';
      const exportButton=$("admin-subscriber-export");
      exportButton.disabled=!filtered.length;
      exportButton.onclick=()=>exportAdminRows("Suscripciones",headings.slice(0,-1).concat(["Plataformas","Alertas","Último acceso"]),
        filtered.map(row=>[row.email,geography(row),language(row),stateLabel(row),lastDelivery(row),adminSubscriberScopeText("platform",row.platforms),
          row.active?"Activas":"Pausadas",dateTimeLabel(row.lastSeenAt)]));
      const pagination=$("admin-subscriber-pagination");
      pagination.innerHTML=`<button type="button" class="button" data-step="-1" ${subscriberPage?"":"disabled"}>Anterior</button>
        <span> ${subscriberPage+1} / ${pages} </span><button type="button" class="button" data-step="1" ${subscriberPage+1<pages?"":"disabled"}>Siguiente</button>`;
      pagination.onclick=event=>{const step=event.target.dataset.step;if(step){subscriberPage+=Number(step);renderAdminSubscribers(rows)}};
    }
    function adminSubscriberDefault(){return{active:true,newsletterEnabled:true,countries:["ALL"],platforms:["ALL"],reviewShareEnabled:false,reviewWarningPct:15,reviewCriticalPct:30,dailyDropEnabled:true,dailyWarningDrop:.1,dailyCriticalDrop:.15,mtdDropEnabled:true,mtdWarningDrop:.3,mtdCriticalDrop:.5,ytdDropEnabled:true,ytdWarningDrop:.3,ytdCriticalDrop:.5,repeatWhileBreached:false,crossoverEnabled:true,crossoverDirection:"BOTH",deliveryMode:"DAILY_DIGEST"}}
    function adminScopeOptions(kind){return kind==="country"?[{value:"ALL",label:"Todos",meta:`${Object.keys(D.config.countries).length} mercados`},...Object.keys(D.config.countries).map(value=>({value,label:D.config.countries[value]}))]:[{value:"ALL",label:"Todas",meta:`${D.config.platforms.length} plataformas`},...D.config.platforms.map(value=>({value,label:value}))]}
    function normalizeAdminScope(kind,values){const allowed=new Set(adminScopeOptions(kind).map(item=>item.value)),clean=[...new Set((values||[]).filter(value=>allowed.has(value)))];return !clean.length||clean.includes("ALL")?["ALL"]:clean}
    function adminScopeSelection(kind){return[...$(`admin-${kind}-pills`).querySelectorAll("[data-admin-scope-value][aria-pressed=true]")].map(button=>button.dataset.adminScopeValue)}
    function adminScopeSummary(kind,values){if(values.includes("ALL"))return kind==="country"?"Todos los mercados":"Todas las plataformas";const labels=values.map(value=>kind==="country"?D.config.countries[value]||value:value);return `${values.length} ${kind==="country"?(values.length===1?"mercado":"mercados"):(values.length===1?"plataforma":"plataformas")} · ${labels.join(", ")}`}
    function renderAdminScope(kind,values){const selected=normalizeAdminScope(kind,values),container=$(`admin-${kind}-pills`);container.innerHTML=adminScopeOptions(kind).map(item=>`<button class="admin-scope-pill${item.value==="ALL"?" all":""}" type="button" data-admin-scope-kind="${kind}" data-admin-scope-value="${U.esc(item.value)}" aria-pressed="${selected.includes(item.value)}"><i aria-hidden="true"></i><span>${kind==="country"?geographyFlag(item.value):""}${U.esc(item.label)}</span>${item.meta?`<small>${U.esc(item.meta)}</small>`:""}</button>`).join("");$(`admin-${kind}-scope-summary`).textContent=adminScopeSummary(kind,selected)}
    function handleAdminScopeClick(event){const button=event.target.closest("[data-admin-scope-kind][data-admin-scope-value]");if(!button)return;renderAdminScope(button.dataset.adminScopeKind,nextAdminScopeSelection(adminScopeSelection(button.dataset.adminScopeKind),button.dataset.adminScopeValue))}
    function openAdminSubscriber(email=""){const row=(state.adminCenter?.subscribers||[]).find(item=>item.email===email),draft=Object.assign(adminSubscriberDefault(),row||{});state.adminEditingEmail=row?.email||"";$("admin-subscriber-title").textContent=row?"Editar suscripción":"Alta manual";$("admin-subscriber-save").textContent=row?"Guardar cambios":"Crear suscripción";$("admin-subscriber-email").value=row?.email||"";$("admin-subscriber-email").disabled=Boolean(row);$("admin-newsletter-language").value=row?.newsletterLanguage||appLanguage;$("admin-subscriber-active").checked=Boolean(draft.active);$("admin-newsletter-enabled").checked=Boolean(draft.newsletterEnabled);renderAdminScope("country",draft.countries);renderAdminScope("platform",draft.platforms);[["daily",draft.dailyDropEnabled,draft.dailyWarningDrop,draft.dailyCriticalDrop],["mtd",draft.mtdDropEnabled,draft.mtdWarningDrop,draft.mtdCriticalDrop],["ytd",draft.ytdDropEnabled,draft.ytdWarningDrop,draft.ytdCriticalDrop]].forEach(item=>{$(`admin-${item[0]}-enabled`).checked=Boolean(item[1]);$(`admin-${item[0]}-warning`).value=item[2];$(`admin-${item[0]}-critical`).value=item[3]});$("admin-crossover-enabled").checked=Boolean(draft.crossoverEnabled);$("admin-crossover-direction").value=draft.crossoverDirection||"BOTH";$("admin-repeat-enabled").checked=Boolean(draft.repeatWhileBreached);$("admin-subscriber-error").classList.add("hidden");$("admin-subscription-editor").hidden=false;$("admin-subscription-editor").scrollIntoView?.({block:"nearest"});
      (row?$("admin-newsletter-language"):$("admin-subscriber-email")).focus()}
    function closeAdminSubscriber(){$("admin-subscription-editor").hidden=true;state.adminEditingEmail=""}
    function adminSubscriberPayload(){const existing=(state.adminCenter?.subscribers||[]).find(item=>item.email===state.adminEditingEmail)||adminSubscriberDefault(),payload=Object.assign({},existing,{newsletterLanguage:$("admin-newsletter-language").value,active:$("admin-subscriber-active").checked,newsletterEnabled:$("admin-newsletter-enabled").checked,countries:normalizeAdminScope("country",adminScopeSelection("country")),platforms:normalizeAdminScope("platform",adminScopeSelection("platform")),dailyDropEnabled:$("admin-daily-enabled").checked,dailyWarningDrop:Number($("admin-daily-warning").value),dailyCriticalDrop:Number($("admin-daily-critical").value),mtdDropEnabled:$("admin-mtd-enabled").checked,mtdWarningDrop:Number($("admin-mtd-warning").value),mtdCriticalDrop:Number($("admin-mtd-critical").value),ytdDropEnabled:$("admin-ytd-enabled").checked,ytdWarningDrop:Number($("admin-ytd-warning").value),ytdCriticalDrop:Number($("admin-ytd-critical").value),repeatWhileBreached:$("admin-repeat-enabled").checked,crossoverEnabled:$("admin-crossover-enabled").checked,crossoverDirection:$("admin-crossover-direction").value});return{email:state.adminEditingEmail||$("admin-subscriber-email").value.trim().toLowerCase(),preferences:payload}}
    async function saveAdminSubscriber(event){event.preventDefault();const button=$("admin-subscriber-save"),errorPanel=$("admin-subscriber-error"),previous=button.textContent;button.disabled=true;button.textContent="Guardando…";errorPanel.classList.add("hidden");try{const saved=await callServer("admin:subscriber:save",adminSubscriberPayload());const rows=state.adminCenter.subscribers||[],index=rows.findIndex(row=>row.email===saved.email);if(index<0)rows.push(saved);else rows[index]=saved;trackUsage("ACTION","admin","SUBSCRIBER_SAVE");closeAdminSubscriber();await loadAdmin(true);showToast(`${saved.email}: alertas ${saved.active?"activas":"pausadas"} y newsletter ${saved.newsletterEnabled?"activa":"desactivada"}.${saved.enrollmentYtdAcknowledged?` ${saved.enrollmentYtdAcknowledged} señales YTD previas reconocidas sin envío.`:""}`,true)}catch(error){trackUsage("ERROR","admin","SUBSCRIBER_ERROR",error?.message||error);errorPanel.textContent=error?.message||String(error);errorPanel.classList.remove("hidden")}finally{button.disabled=false;button.textContent=previous}}
    async function requestAdminRatingRecovery(){if(!window.confirm("Se recuperarán ahora todos los ratings y se registrará una nueva ejecución. ¿Continuar?"))return;const button=$("admin-recovery"),previous=button.textContent;button.disabled=true;button.textContent="Recuperando ratings…";try{const result=await callServer("admin:ratings:recover");trackUsage("ACTION","admin","RATING_RECOVERY");await loadAdmin(true);showToast(`Recuperación ${result.runId} completada: ${result.rowsUpserted} filas actualizadas.`,true)}catch(error){showError(error)}finally{button.disabled=false;button.textContent=previous}}
    async function unsubscribeAdminNewsletter(button){
      const rows=state.adminCenter?.subscribers||[];
      const row=rows.find(item=>item.email===button.dataset.subscriber);
      if(!row?.newsletterEnabled||!window.confirm(`¿Dar de baja la newsletter de ${row.email}?`))return;
      button.disabled=true;
      try{
        const saved=await callServer("admin:subscriber:save",{email:row.email,preferences:{...row,newsletterEnabled:false}});
        rows[rows.indexOf(row)]=saved;
        renderAdminSubscribers(rows);
      }catch(error){showError(error)}
      finally{button.disabled=false}
    }
    async function testAdminNewsletter(event){
      event.preventDefault();
      const form=event.currentTarget, button=event.submitter||form.querySelector('button[type="submit"]');
      const fields=Object.fromEntries(new FormData(form)), fingerprint=JSON.stringify(fields);
      if(form.dataset.fingerprint!==fingerprint){
        form.dataset.fingerprint=fingerprint;
        form.dataset.requestId="NEWS-REQ-"+(window.crypto?.randomUUID?window.crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`);
      }
      const target=$("newsletter-test-result");
      target.hidden=false;target.classList.remove("error");target.textContent="Procesando solicitud…";
      button.disabled=true;
      try{
        const result=await callServer("admin:newsletter:test",{...fields,requestId:form.dataset.requestId});
        delete form.dataset.fingerprint;
        target.textContent=result.alreadyAccepted?`La prueba ${result.deliveryId} para ${result.recipient} ya había sido aceptada.`:
          [`Gmail ha aceptado la prueba para ${result.recipient}.`,result.acceptedAt&&dateTimeLabel(result.acceptedAt),
            result.messageId&&`Gmail ID ${result.messageId}`].filter(Boolean).join(" · ");
      }catch(error){target.textContent=error.message;target.classList.add("error")}
      finally{button.disabled=false}
    }
    function renderAdminAlerts(rows){if(!rows.length){$("admin-alerts").innerHTML=U.empty("Sin eventos recientes","ALERT_LOG todavía no contiene señales.");return}$("admin-alerts").innerHTML=`<table class="admin-table"><thead><tr><th>Fecha</th><th>Señal</th><th>Ámbito</th><th>Destinatario</th><th>Detalle</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${U.esc(dateTimeLabel(row.timestamp))}</td><td>${statusBadge(row.severity)}<small>${U.esc(row.type)}</small></td><td>${U.esc(`${row.countryCode} · ${row.platform}`)}</td><td>${U.esc(row.userEmail)}</td><td>${U.esc(row.detail)}</td></tr>`).join("")}</tbody></table>`}

    function showChartTooltip(point,event){const tooltip=$("chart-tooltip");tooltip.innerHTML=`<strong>${U.esc(point.dataset.label)}</strong>${U.esc(point.dataset.month)} · ${U.esc(point.dataset.value)}${state.country==="ALL"?" · BBVA Empresas":""}`;tooltip.classList.remove("hidden");positionTooltip(event.clientX,event.clientY)}
    function positionTooltip(x,y){const tooltip=$("chart-tooltip"),left=Math.min(window.innerWidth-tooltip.offsetWidth-12,x+13),top=Math.max(10,y-tooltip.offsetHeight-14);tooltip.style.left=`${left}px`;tooltip.style.top=`${top}px`}
    function hideChartTooltip(){$("chart-tooltip").classList.add("hidden")}
    const exportDates=({start,end})=>[["Desde",start],["Hasta",end]];
    const reviewExportHeader=["Fecha","Aplicación","Plataforma","Escaparate","Estrellas","Autor","Título","Comentario",
      "Texto original","Bloques funcionales","Votos útiles","Respuesta","Enlace"];
    const reviewExportRow=(row,topics)=>[row.date,row.entities?.join(" · ")||row.app,row.platform,
      row.storefronts?.map(countryLabel).join(" · "),row.rating,row.author,row.title,row.text,row.translated?row.original:"",
      (row.blocks.length?row.blocks:["general"]).map(id=>topics[id]||id).join(" · "),row.helpful,row.reply,row.url];
    let reviewsReady=false, analyticsLoading=false, monthlyReviewsLoading=false;
    function setExportSheet(view,name,country,filters,header,rows,chart=false){
      const sheets=exportSheets[view];
      if(rows.length)sheets.set(name,{name,country,filters:[["Geografía",countryLabel(country)],...filters],header,rows,chart});
      else sheets.delete(name);
    }
    async function downloadReport(){
      const view=state.view, button=$("report-button");
      if(mobileViewport.matches||button.disabled||!state.meta)return;
      const label=button.innerHTML;
      button.disabled=true;
      button.textContent=translate("Preparando Excel…");
      try{
        const country=view==="reviews"?reviewScope().country:view==="analytics"?annualScope().country:state.country;
        if(!country||country==="ALL")throw new Error("Selecciona una geografía para descargar Excel.");
        if((view==="analytics"&&analyticsLoading)||(view==="evolution"&&(state.trendsLoading||monthlyReviewsLoading))){
          throw new Error("Espera a que termine de cargar la selección.");
        }
        let sheets;
        if(view==="reviews"){
          if(!reviewsReady)throw new Error("No hay comentarios cargados para descargar.");
          const scope={...reviewScope(),language:appLanguage};
          const {rows,topics,window:dates}=await callServer("review:export",scope);
          const filters=[["Geografía",countryLabel(country)],...exportDates(dates)];
          for(const key of ["app","platform","segment","audience","inferGeography","topic","rating","search","reviewKey"]){
            if(scope[key])filters.push([({app:"Aplicación",platform:"Plataforma",segment:"Sentimiento",audience:"Comentarios",inferGeography:"Inferir datos",topic:"Bloque funcional",rating:"Estrellas",search:"Buscar",reviewKey:"Reseña"})[key],reviewFilterLabel(key,scope[key])||$(`review-${key}`)?.selectedOptions?.[0]?.textContent||scope[key]]);
          }
          sheets=[{name:"Comentarios",filters,header:reviewExportHeader,rows:rows.map(row=>reviewExportRow(row,topics))}];
        }else{
          sheets=[...(exportSheets[view]?.values()||[])].filter(sheet=>sheet.country===country);
        }
        const file=window.MarketsWorkbook.build(sheets);
        const url=URL.createObjectURL(file), link=document.createElement("a");
        link.href=url;
        const title={benchmark:"Resumen",evolution:"Análisis mensual",analytics:"Análisis anual",reviews:"Comentarios"}[view];
        link.download=`Market Pulse - ${title} - ${country}.xlsx`;
        link.click();
        window.setTimeout(()=>URL.revokeObjectURL(url),1000);
        trackUsage("ACTION",view,"REPORT_DOWNLOAD");
      }catch(error){showError(error)}
      finally{button.disabled=false;button.innerHTML=label}
    }
    function showToast(message,success=false){const toast=$("toast");toast.textContent=message;toast.classList.toggle("success",success);toast.classList.remove("hidden");window.setTimeout(()=>toast.classList.add("hidden"),7000)}
    function showError(error){const message=error?.message||String(error);trackUsage("ERROR",state.view,"CLIENT_ERROR",message);showToast(message,false)}
  })();
</script>
