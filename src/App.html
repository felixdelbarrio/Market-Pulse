    const supportedLanguage=value=>["es","en","tr"].includes(value)?value:"es";

    const locale=()=>({es:"es-ES",en:"en-GB",tr:"tr-TR"}[appLanguage]);
    const originalCopy=new WeakMap();
    function translateInterface(root){
      if(!root)return;
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      for(let node=walker.nextNode();node;node=walker.nextNode()){
        if(node.parentElement.closest("script,style,textarea,#review-results,[data-detail]"))continue;
        const previous=originalCopy.get(node);
        const original=previous?.rendered===node.data?previous.original:node.data;
        const word=original.trim(), variants=Object.hasOwn(interfaceCopy,word)?interfaceCopy[word]:null;
        if(!variants)continue;
        const rendered=appLanguage==="es"?original:original.replace(word,variants[appLanguage==="en"?0:1]);
        originalCopy.set(node,{original,rendered});
        if(node.data!==rendered)node.data=rendered;
      }
    }
    function initializeLanguage(){

        translateInterface(document.body);
      });
      translateInterface(document.body);
      new MutationObserver(records=>{
        for(const record of records){
          if(record.type==="characterData")translateInterface(record.target.parentElement);
          else for(const node of record.addedNodes){
            if(node.nodeType===Node.ELEMENT_NODE)translateInterface(node);
            else if(node.nodeType===Node.TEXT_NODE)translateInterface(node.parentElement);
          }
        }
      }).observe(document.body,{childList:true,characterData:true,subtree:true});
    }
    const fmt=(value,digits=1)=>D.finite(value)?value.toLocaleString(locale(),{minimumFractionDigits:digits,maximumFractionDigits:digits}):"—";

    const compactInteger=value=>{if(!D.finite(value))return"—";const absolute=Math.abs(value);if(absolute<1000)return integer(value);if(absolute<1000000)return`${fmt(value/1000,absolute<10000?1:0)} mil`;return`${fmt(value/1000000,absolute<10000000?1:0)} M`};
    const signed=value=>{if(!D.finite(value))return"—";const normalized=Math.abs(value)<.005?0:value;return`${normalized>0?"+":""}${fmt(normalized,2)}`};
    const initials=value=>String(value||"?").split(/\s+/).slice(0,2).map(part=>part[0]).join("").toUpperCase();
    const dateLabel=value=>value?new Intl.DateTimeFormat(locale(),{day:"2-digit",month:"short",year:"numeric"}).format(new Date(`${value}T12:00:00`)):"—";

    function serverTimeoutMs(method){return method==="admin:ratings:recover"?360000:method==="admin:newsletter:test"?120000:method==="bootstrap"?20000:method==="admin:get"?30000:20000}
    function callServer(method,argument){const started=performance.now();return new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error("El dashboard debe abrirse desde el despliegue de Apps Script."));let settled=false;const finish=callback=>value=>{if(settled)return;settled=true;window.clearTimeout(timer);trackUsage("PERFORMANCE",state.view,method,`RPC ${Math.round(performance.now()-started)} ${callback===resolve?"OK":"ERROR"}`);callback(value)};const timer=window.setTimeout(()=>finish(reject)(new Error("Market Pulse no ha respondido a tiempo. Reintenta la carga.")),serverTimeoutMs(method));const runner=google.script.run.withSuccessHandler(finish(resolve)).withFailureHandler(finish(error=>reject(new Error(error?.message||error))));if(method==="bootstrap")runner.getMarketsDashboardBootstrap();else if(method==="user:context")runner.getMarketsUserContext();else if(method==="admin:get")runner.getMarketsAdminDashboard();else if(method==="admin:subscriber:save")runner.saveMarketsAdminSubscriber(argument.email,argument.preferences);else if(method==="admin:newsletter:test")runner.sendMarketsAdminNewsletterTestEmail(argument);else if(method==="admin:ratings:recover")runner.requestMarketsAdminRatingRecovery();else if(method==="reviews:segments")runner.getMarketsReviewSegments();else if(method==="reviews")runner.getMarketsReviews(argument);else if(method==="review:page")runner.getMarketsReviewPage(argument);else if(method==="review:analytics")runner.getMarketsReviewAnalytics(argument);else if(method==="review:configure")runner.configureMarketsReviewInsights();else if(method==="performance")runner.getMarketsPerformance();else if(method==="trends")runner.getMarketsDashboardTrends(argument);else if(method==="alerts:get")runner.getMarketsAlertPreferences();else if(method==="alerts:save")runner.saveMarketsAlertPreferences(argument);else if(method==="alerts:reset")runner.resetMarketsAlertPreferences();else if(method==="alerts:test")runner.sendMarketsAlertTestEmail();else finish(reject)(new Error("Operacion no soportada: "+method))})}
    function validateBootstrap(data){if(!data||!data.meta||!Array.isArray(data.snapshot)||!Array.isArray(data.trends))throw new Error("El servidor ha devuelto una respuesta incompleta. Actualiza el despliegue de Market Pulse.");return data}
    async function loadBootstrap(){if(state.bootstrapLoading)return;state.bootstrapLoading=true;const loader=$("loader");loader.classList.remove("done","failed");$("loader-title").textContent="Preparando Market Pulse…";$("loader-detail").classList.add("hidden");$("loader-retry").classList.add("hidden");try{const data=validateBootstrap(await callServer("bootstrap"));state.meta=data.meta;state.userContext=data.userContext||{email:"",isAdmin:false};state.snapshot=data.snapshot;state.trends=data.trends;state.consolidated=data.consolidated||null;state.trendsLoading=false;state.trendCache.set("ALL|ALL|ALL|BBVA|18",state.trends);state.country=browserMarket();restoreUserPreferences();buildControls();configureAdminNavigation();renderHero();renderDashboard();startUsageTracking();if(state.country!=="ALL"||state.platform!=="ALL")scheduleTrends(0);$("footer-version").textContent=`Contrato ${data.meta.codeVersion} · Web ${data.meta.webVersion||"1"}`;loader.classList.add("done")}catch(error){showStartupFailure(error)}finally{state.bootstrapLoading=false}}
    function showStartupFailure(error){const loader=$("loader");if(!loader)return;loader.classList.remove("done");loader.classList.add("failed");$("loader-title").textContent="No hemos podido iniciar Market Pulse";$("loader-detail").textContent=error?.message||String(error);$("loader-detail").classList.remove("hidden");$("loader-retry").classList.remove("hidden")}

    function usageSessionId(){const key="markets-usage-session-v1";try{let value=sessionStorage.getItem(key);if(!value){value=window.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;sessionStorage.setItem(key,value)}return value}catch(ignored){return`${Date.now()}-${Math.random().toString(36).slice(2)}`}}
    function usageDevice(){const width=Math.min(window.innerWidth||9999,window.screen?.width||9999);return width<=780?"MOBILE":width<=1180?"TABLET":"DESKTOP"}
    function startUsageTracking(){if(state.usageStarted)return;state.usageStarted=true;trackUsage("SESSION_START",state.view,"APP_OPEN");trackUsage("VIEW",state.view,"OPEN_VIEW")}
    function trackUsage(eventType,view=state.view,action="",detail=""){state.usageQueue.push({eventType,view,action,detail:String(detail||"").slice(0,240),sessionId:usageSessionId(),webVersion:state.meta?.webVersion||"",device:usageDevice()});if(state.usageQueue.length>=12)flushUsage();else{window.clearTimeout(state.usageTimer);state.usageTimer=window.setTimeout(flushUsage,1600)}}
    function flushUsage(){window.clearTimeout(state.usageTimer);if(!state.usageQueue.length||!window.google?.script?.run)return;const batch=state.usageQueue.splice(0,25);google.script.run.withSuccessHandler(result=>{if(result?.deferred)state.usageQueue=batch.concat(state.usageQueue).slice(0,100);if(state.usageQueue.length)state.usageTimer=window.setTimeout(flushUsage,result?.deferred?1200:400)}).withFailureHandler(()=>{state.usageQueue=batch.concat(state.usageQueue).slice(0,100)}).recordMarketsUsageEvents(batch)}

    function adminSubscriberFiltersMarkup(){return`<section class="admin-subscriber-filters" aria-labelledby="admin-subscriber-filters-title"><header><div><strong id="admin-subscriber-filters-title">Encuentra cualquier suscripción</strong><span>Combina usuario, mercados, plataformas y estado.</span></div><div><b id="admin-subscriber-results" aria-live="polite">—</b><button id="admin-subscriber-filter-clear" type="button">Limpiar filtros</button></div></header><div class="admin-subscriber-filter-grid"><label class="admin-filter-search" for="admin-subscriber-search"><span>Usuario</span><input id="admin-subscriber-search" type="search" placeholder="Buscar por nombre o correo…" autocomplete="off"><i aria-hidden="true">⌕</i></label><label class="select-field" for="admin-subscriber-status"><span>Estado de alertas</span><select id="admin-subscriber-status" class="select-control"><option value="ALL">Todos los estados</option><option value="ACTIVE">Alertas activas</option><option value="PAUSED">Alertas pausadas</option></select></label></div><div class="admin-filter-scope-grid"><section aria-labelledby="admin-filter-country-title"><div><strong id="admin-filter-country-title">Mercados</strong><small>“Todos” es exacto; varios mercados coinciden con cualquiera</small></div><div id="admin-filter-country-pills" class="admin-filter-pills" role="group" aria-labelledby="admin-filter-country-title"></div></section><section aria-labelledby="admin-filter-platform-title"><div><strong id="admin-filter-platform-title">Plataformas</strong><small>“Todas” es exacto; varias coinciden con cualquiera</small></div><div id="admin-filter-platform-pills" class="admin-filter-pills" role="group" aria-labelledby="admin-filter-platform-title"></div></section></div></section>`}

    function ensureAdminSubscriberUi(){const list=$("admin-subscribers");if(list&&!$("admin-subscriber-search")){const wrapper=document.createElement("div");wrapper.innerHTML=adminSubscriberFiltersMarkup();list.before(wrapper.firstElementChild)}if(!$("admin-country-pills")){const legacy=$("admin-subscriber-countries")||$("admin-subscriber-platforms"),body=$("admin-subscriber-form")?.querySelector(".admin-subscriber-form-body"),fieldset=legacy?.closest("fieldset");if(fieldset){fieldset.className="admin-scope-fieldset";fieldset.innerHTML=adminSubscriberScopeMarkup()}else if(body){const scope=document.createElement("fieldset"),first=body.querySelector("fieldset");scope.className="admin-scope-fieldset";scope.innerHTML=adminSubscriberScopeMarkup();if(first)first.before(scope);else body.append(scope)}}}

    function activateView(view){if((["admin","reviews","analytics"].includes(view))&&!state.userContext?.isAdmin)return;const changed=state.view!==view;state.view=view;document.querySelectorAll(".nav-button").forEach(item=>item.classList.toggle("active",item.dataset.view===view));document.querySelectorAll(".view").forEach(item=>item.classList.toggle("hidden",item.id!==`view-${view}`));syncViewControls();if(changed)trackUsage("VIEW",view,"OPEN_VIEW");if(view==="overview")renderOverview();if(view==="benchmark")renderBenchmark();if(view==="evolution"||changed&&view==="overview"){state.trendsLoading=true;renderDashboard();scheduleTrends(0)}if(view==="alerts")loadAlerts();if(view==="admin")loadAdmin();if(view==="reviews")loadReviews();if(view==="analytics")loadAnalytics();renderPrintContext()}
    function syncViewControls(){const benchmark=state.view==="benchmark",privateView=state.view==="alerts"||state.view==="admin";$("benchmark-control").classList.toggle("hidden",!benchmark);$("filter-bar").classList.toggle("benchmark-mode",benchmark);$("filter-bar").setAttribute("aria-label",benchmark?"Filtros de benchmark":"Filtros globales");$("filter-wrap").classList.toggle("hidden",privateView);$("report-button").classList.toggle("hidden",privateView||["reviews","analytics"].includes(state.view))}
    function bindFilters(){
      bindOptional("review-catalog-sync","click",syncReviewCatalog);
      bindOptional("review-filter-open","click",openReviewFilters);
      bindOptional("review-filter-close","click",()=>$("review-filter-dialog").close());

        event.preventDefault();
        const next={...reviewScope(),reviewKey:""};
        for(const [key,id] of Object.entries(reviewControls))next[key]=$(id).value;
        if(next.start&&next.end&&next.start>next.end){
          $("review-end").setCustomValidity("La fecha final debe ser posterior o igual a la inicial.");

          return;

      $("month-filter").addEventListener("change",event=>{state.periodMonth=event.target.value;trackUsage("FILTER",state.view,"PERIOD_MONTH",`${state.periodYear}-${state.periodMonth}`);persistUserPreferences();renderEvolution()});

    function buildControls(){
      $("country-filter").innerHTML=U.option("ALL","Todos los mercados",state.country==="ALL")+state.meta.countries.map(item=>U.option(item.code,`${D.config.flags[item.code]||"🌐"} ${countryLabel(item.code)}`,item.code===state.country)).join("");

    function renderReviewBalance(target,data,scope){

      filter.className="select-control";

      const months=[];
      const cursor=new Date((scope.period?scope.period:data.window.start.slice(0,7))+"-01T00:00:00Z");
      const last=scope.period||data.window.end.slice(0,7);

        months.push(cursor.toISOString().slice(0,7));

          const path=[], dots=[];

        details.replaceChildren();
        for(const point of data.monthly.filter(item=>entities.includes(item.entity)).sort((a,b)=>a.month.localeCompare(b.month)||a.entity.localeCompare(b.entity))){
          const label=`${point.entity} · ${point.month} · ${fmt(score(point),1)} pp · ${point.promoters} promotoras / ${point.detractors} detractoras / ${point.total} reseñas`;
          appendReviewCohort(details,label,{...scope,app:point.entity,period:point.month});
        }
      }

            return `<td class="review-heat-cell" data-topic="${U.esc(data.topics[id])}" style="--heat:${heat}%">${count?`<button type="button" data-cell="${index}|${id}" title="${U.esc(label)}" aria-label="${U.esc(label)}">${shown}</button>`:shown}</td>`;
          }).join("")}</tr>`).join("")}</tbody></table>`:U.empty("Sin reseñas","No hay opiniones para este ámbito.");

      }

    async function saveAdminSubscriber(event){event.preventDefault();const button=$("admin-subscriber-save"),errorPanel=$("admin-subscriber-error"),previous=button.textContent;button.disabled=true;button.textContent="Guardando…";errorPanel.classList.add("hidden");try{const saved=await callServer("admin:subscriber:save",adminSubscriberPayload());const rows=state.adminCenter.subscribers||[],index=rows.findIndex(row=>row.email===saved.email);if(index<0)rows.push(saved);else rows[index]=saved;trackUsage("ACTION","admin","SUBSCRIBER_SAVE");closeAdminSubscriber();await loadAdmin(true);showToast(`${saved.email}: alertas ${saved.active?"activas":"pausadas"} y newsletter ${saved.newsletterEnabled?"activa":"desactivada"}.${saved.enrollmentYtdAcknowledged?` ${saved.enrollmentYtdAcknowledged} señales YTD previas reconocidas sin envío.`:""}`,true)}catch(error){trackUsage("ERROR","admin","SUBSCRIBER_ERROR",error?.message||error);errorPanel.textContent=error?.message||String(error);errorPanel.classList.remove("hidden")}finally{button.disabled=false;button.textContent=previous}}
    async function requestAdminRatingRecovery(){if(!window.confirm("Se recuperarán ahora todos los ratings y se registrará una nueva ejecución. ¿Continuar?"))return;const button=$("admin-recovery"),previous=button.textContent;button.disabled=true;button.textContent="Recuperando ratings…";try{const result=await callServer("admin:ratings:recover");trackUsage("ACTION","admin","RATING_RECOVERY");await loadAdmin(true);showToast(`Recuperación ${result.runId} completada: ${result.rowsUpserted} filas actualizadas.`,true)}catch(error){showError(error)}finally{button.disabled=false;button.textContent=previous}}
    function adminNewsletterRequestId(button){if(button.dataset.newsletterRequestId)return button.dataset.newsletterRequestId;const token=window.crypto?.randomUUID?window.crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;return button.dataset.newsletterRequestId=`NEWS-REQ-${token}`}
    async function testAdminNewsletter(email,button){const previous=button.textContent,requestId=adminNewsletterRequestId(button);button.disabled=true;button.textContent="Preparando…";try{const result=await callServer("admin:newsletter:test",{targetEmail:email,requestId});delete button.dataset.newsletterRequestId;trackUsage("ACTION","admin","NEWSLETTER_TEST",email);showToast(result.alreadyAccepted?`La prueba ${result.deliveryId} ya había sido aceptada; no se ha duplicado.`:`Vista previa de ${email} enviada a ${result.recipient}.`,true)}catch(error){showError(error)}finally{button.disabled=false;button.textContent=previous}}
    function renderAdminAlerts(rows){if(!rows.length){$("admin-alerts").innerHTML=U.empty("Sin eventos recientes","ALERT_LOG todavía no contiene señales.");return}$("admin-alerts").innerHTML=`<table class="admin-table"><thead><tr><th>Fecha</th><th>Señal</th><th>Ámbito</th><th>Destinatario</th><th>Detalle</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${U.esc(dateTimeLabel(row.timestamp))}</td><td>${statusBadge(row.severity)}<small>${U.esc(row.type)}</small></td><td>${U.esc(`${row.countryCode} · ${row.platform}`)}</td><td>${U.esc(row.userEmail)}</td><td>${U.esc(row.detail)}</td></tr>`).join("")}</tbody></table>`}

    function showChartTooltip(point,event){const tooltip=$("chart-tooltip");tooltip.innerHTML=`<strong>${U.esc(point.dataset.label)}</strong>${U.esc(point.dataset.month)} · ${U.esc(point.dataset.value)} rating${state.country==="ALL"?" · BBVA Empresas":""}`;tooltip.classList.remove("hidden");positionTooltip(event.clientX,event.clientY)}
    function positionTooltip(x,y){const tooltip=$("chart-tooltip"),left=Math.min(window.innerWidth-tooltip.offsetWidth-12,x+13),top=Math.max(10,y-tooltip.offsetHeight-14);tooltip.style.left=`${left}px`;tooltip.style.top=`${top}px`}
    function hideChartTooltip(){$("chart-tooltip").classList.add("hidden")}
    async function downloadReport(){const button=$("report-button"),label=button.innerHTML;button.disabled=true;button.innerHTML="<span>Preparando informe…</span>";try{const viewLabels={overview:"Resumen",benchmark:"Benchmark",evolution:"Evolución"};if(!viewLabels[state.view])throw new Error("La vista actual no admite descarga de informe.");if(state.trendPromise)await state.trendPromise;if(document.fonts?.ready)await document.fonts.ready;const request=trendRequest(),key=trendKey(request);let reportTrends=state.trendCache.get(key);if(!reportTrends){reportTrends=await callServer("trends",request);state.trendCache.set(key,reportTrends||[])}const viewLabel=viewLabels[state.view],scopeLabel=`${state.country==="ALL"?"Todos los mercados":countryLabel(state.country)} · ${D.config.platformLabels[state.platform]}`;MarketsReport.render({target:$("print-report"),meta:state.meta,snapshot:state.snapshot,trends:reportTrends||[],benchmarkSegment:state.benchmarkSegment,benchmarkWeighted:state.benchmarkWeighted,view:state.view,selection:{...selection(),app:state.view==="evolution"?state.evolutionApp:""},periodYear:state.periodYear,periodMonth:state.periodMonth,generatedAt:new Date()});trackUsage("ACTION",state.view,"REPORT_DOWNLOAD");document.title=`Market Pulse · ${viewLabel} · ${scopeLabel} · ${state.meta.dataDate}`;window.print()}catch(error){showError(error)}finally{button.disabled=false;button.innerHTML=label}}
    function renderPrintContext(){$("print-context").textContent=`${overviewContext()} · Benchmark: ${activeBenchmark()} · Gráficas: ${trendScope()} · Evolución: ${state.periodYear&&state.periodMonth?monthLabel(`${state.periodYear}-${state.periodMonth}`):"último cierre"} · ${dateLabel(state.meta?.dataDate)} · generado ${dateTimeLabel(new Date().toISOString())}`}
    function showToast(message,success=false){const toast=$("toast");toast.textContent=message;toast.classList.toggle("success",success);toast.classList.remove("hidden");window.setTimeout(()=>toast.classList.add("hidden"),7000)}
    function showError(error){const message=error?.message||String(error);trackUsage("ERROR",state.view,"CLIENT_ERROR",message);showToast(message,false)}
  })();
</script>
