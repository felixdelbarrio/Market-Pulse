<script>
  (()=>{
    "use strict";
    const D=window.MarketsDomain,U=window.MarketsUI,C=window.MarketsCharts,T=window.MarketsTheme;
    const state={meta:null,userContext:null,snapshot:[],trends:[],consolidated:null,country:"ALL",platform:"ALL",benchmarkSegment:"BANK",view:"overview",periodYear:"",periodMonth:"",trendsLoading:true,trendToken:0,trendTimer:0,trendCache:new Map(),trendPromise:null,alertCenter:null,alertDraft:null,alertsLoading:false,alertsLoaded:false,adminCenter:null,adminLoading:false,adminLoaded:false};
    const $=id=>document.getElementById(id);
    const fmt=(value,digits=1)=>D.finite(value)?value.toLocaleString("es-ES",{minimumFractionDigits:digits,maximumFractionDigits:digits}):"—";
    const integer=value=>D.finite(value)?Math.round(value).toLocaleString("es-ES"):"—";
    const signed=value=>{if(!D.finite(value))return"—";const normalized=Math.abs(value)<.005?0:value;return`${normalized>0?"+":""}${fmt(normalized,2)}`};
    const initials=value=>String(value||"?").split(/\s+/).slice(0,2).map(part=>part[0]).join("").toUpperCase();
    const dateLabel=value=>value?new Intl.DateTimeFormat("es-ES",{day:"2-digit",month:"short",year:"numeric"}).format(new Date(`${value}T12:00:00`)):"—";
    const dateTimeLabel=value=>value?new Intl.DateTimeFormat("es-ES",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(value)):"—";
    const monthLabel=value=>value?new Intl.DateTimeFormat("es-ES",{month:"short",year:"2-digit"}).format(new Date(`${value}-15T12:00:00`)):"—";
    const monthName=value=>value?new Intl.DateTimeFormat("es-ES",{month:"long"}).format(new Date(`2024-${String(value).padStart(2,"0")}-15T12:00:00`)):"—";
    const countryLabel=code=>D.config.countries[code]||state.meta?.countries.find(item=>item.code===code)?.name||code;
    const selection=()=>({country:state.country,platform:state.platform});

    document.addEventListener("DOMContentLoaded",()=>{bindNavigation();bindFilters();bindInteractions();$("dialog-close").innerHTML=U.icon("close");loadBootstrap()});

    function callServer(method,argument){return new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error("El dashboard debe abrirse desde el despliegue de Apps Script."));const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error?.message||error)));if(method==="bootstrap")runner.getMarketsDashboardBootstrap();else if(method==="user:context")runner.getMarketsUserContext();else if(method==="admin:get")runner.getMarketsAdminDashboard();else if(method==="trends")runner.getMarketsDashboardTrends(argument);else if(method==="alerts:get")runner.getMarketsAlertPreferences();else if(method==="alerts:save")runner.saveMarketsAlertPreferences(argument);else if(method==="alerts:reset")runner.resetMarketsAlertPreferences();else if(method==="alerts:test")runner.sendMarketsAlertTestEmail();else reject(new Error("Operacion no soportada: "+method))})}
    async function loadBootstrap(){try{const [data,userContext]=await Promise.all([callServer("bootstrap"),callServer("user:context")]);state.meta=data.meta;state.userContext=userContext;state.snapshot=data.snapshot||[];state.trends=data.trends||[];state.consolidated=data.consolidated||null;state.trendsLoading=false;state.trendCache.set("ALL|ALL|ALL|BBVA|18",state.trends);restoreUserPreferences();buildControls();configureAdminNavigation();renderHero();renderDashboard();if(state.country!=="ALL"||state.platform!=="ALL")scheduleTrends(0);$("footer-version").textContent=`Contrato ${data.meta.codeVersion} · Web ${data.meta.webVersion||"1"}`}catch(error){showError(error)}finally{$("loader").classList.add("done")}}

    function bindNavigation(){document.querySelectorAll(".nav-button").forEach(button=>button.addEventListener("click",()=>activateView(button.dataset.view)));$("admin-refresh").addEventListener("click",()=>loadAdmin(true));syncViewControls()}
    function activateView(view){if(view==="admin"&&!state.userContext?.isAdmin)return;state.view=view;document.querySelectorAll(".nav-button").forEach(item=>item.classList.toggle("active",item.dataset.view===view));document.querySelectorAll(".view").forEach(item=>item.classList.toggle("hidden",item.id!==`view-${view}`));syncViewControls();if(view==="evolution")renderEvolution();if(view==="alerts")loadAlerts();if(view==="admin")loadAdmin()}
    function syncViewControls(){const benchmark=state.view==="benchmark",privateView=state.view==="alerts"||state.view==="admin";$("benchmark-control").classList.toggle("hidden",!benchmark);$("filter-bar").classList.toggle("benchmark-mode",benchmark);$("filter-bar").setAttribute("aria-label",benchmark?"Filtros de benchmark":"Filtros globales");$("filter-wrap").classList.toggle("hidden",privateView);$("report-button").classList.toggle("hidden",privateView)}
    function bindFilters(){
      $("country-filter").addEventListener("change",event=>{state.country=event.target.value;syncGlobalControlState();filtersChanged()});
      $("segment-filter").addEventListener("change",event=>{state.benchmarkSegment=event.target.value;persistUserPreferences();renderBenchmark();renderPrintContext()});
      $("year-filter").addEventListener("change",event=>{state.periodYear=event.target.value;state.periodMonth="";persistUserPreferences();renderEvolution()});
      $("month-filter").addEventListener("change",event=>{state.periodMonth=event.target.value;persistUserPreferences();renderEvolution()});
    }
    function bindInteractions(){
      $("incident-button").addEventListener("click",()=>$("incident-dialog").showModal());$("dialog-close").addEventListener("click",()=>$("incident-dialog").close());$("report-button").addEventListener("click",downloadReport);
      $("alert-form").addEventListener("submit",saveAlerts);$("alert-reset-button").addEventListener("click",resetAlerts);$("alert-test-button").addEventListener("click",testAlerts);$("alert-country-scope").addEventListener("change",handleAlertScopeChange);$("alert-platform-scope").addEventListener("change",handleAlertScopeChange);$("alert-active").addEventListener("change",markAlertsDirty);["daily","mtd","ytd"].forEach(period=>$(period+"-enabled").addEventListener("change",()=>{syncAlertRuleInputs();markAlertsDirty()}));$("repeat-enabled").addEventListener("change",markAlertsDirty);$("crossover-enabled").addEventListener("change",()=>{syncAlertRuleInputs();markAlertsDirty()});$("alert-form").addEventListener("input",event=>{if(event.target.matches("input,select"))markAlertsDirty()});
      document.addEventListener("error",event=>{if(event.target.matches?.(".app-logo img"))event.target.parentElement.classList.add("logo-error")},true);
      document.addEventListener("pointerover",event=>{const point=event.target.closest?.(".chart-point");if(point)showChartTooltip(point,event)});document.addEventListener("pointermove",event=>{if(!$("chart-tooltip").classList.contains("hidden"))positionTooltip(event.clientX,event.clientY)});document.addEventListener("pointerout",event=>{if(event.target.closest?.(".chart-point"))hideChartTooltip()});document.addEventListener("focusin",event=>{const point=event.target.closest?.(".chart-point");if(point){const box=point.getBoundingClientRect();showChartTooltip(point,{clientX:box.left+box.width/2,clientY:box.top})}});document.addEventListener("focusout",event=>{if(event.target.closest?.(".chart-point"))hideChartTooltip()});
    }
    function buildControls(){
      $("country-filter").innerHTML=U.option("ALL","Todos los mercados",state.country==="ALL")+state.meta.countries.map(item=>U.option(item.code,`${D.config.flags[item.code]||"🌐"} ${countryLabel(item.code)}`,item.code===state.country)).join("");
      $("segment-filter").value=state.benchmarkSegment;
      $("platform-switch").innerHTML=["ALL",...D.config.platforms].map(platform=>`<button class="platform-button ${platform===state.platform?"active":""}" data-platform="${platform}" type="button" aria-pressed="${platform===state.platform}">${U.platformBadge(platform)}</button>`).join("");
      $("platform-switch").querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>{state.platform=button.dataset.platform;$("platform-switch").querySelectorAll("button").forEach(item=>{const active=item===button;item.classList.toggle("active",active);item.setAttribute("aria-pressed",String(active))});filtersChanged()}));syncGlobalControlState();
    }
    function syncGlobalControlState(){$("segment-filter").disabled=false;$("segment-filter").title="Selecciona el benchmark competitivo"}
    function configureAdminNavigation(){$("admin-nav").classList.toggle("hidden",!state.userContext?.isAdmin)}
    function preferenceKey(){return`markets-voc-preferences:${String(state.userContext?.email||"session").toLowerCase()}`}
    function restoreUserPreferences(){try{const saved=JSON.parse(localStorage.getItem(preferenceKey())||"{}");const countries=new Set(["ALL",...(state.meta?.countries||[]).map(item=>item.code)]);const platforms=new Set(["ALL",...D.config.platforms]);const segments=new Set(Object.keys(D.config.segmentLabels));if(countries.has(saved.country))state.country=saved.country;if(platforms.has(saved.platform))state.platform=saved.platform;if(segments.has(saved.benchmarkSegment))state.benchmarkSegment=saved.benchmarkSegment;if(/^\d{4}$/.test(saved.periodYear||""))state.periodYear=saved.periodYear;if(/^\d{2}$/.test(saved.periodMonth||""))state.periodMonth=saved.periodMonth}catch(ignored){}}
    function persistUserPreferences(){if(!state.meta)return;try{localStorage.setItem(preferenceKey(),JSON.stringify({country:state.country,platform:state.platform,benchmarkSegment:state.benchmarkSegment,periodYear:state.periodYear,periodMonth:state.periodMonth}))}catch(ignored){}}
    function filtersChanged(){state.periodYear="";state.periodMonth="";persistUserPreferences();renderDashboard();scheduleTrends(120)}
    function scheduleTrends(delay){window.clearTimeout(state.trendTimer);state.trendTimer=window.setTimeout(loadTrends,delay)}
    function trendRequest(){return{countryCode:state.country==="ALL"?"":state.country,platform:state.platform==="ALL"?"":state.platform,segment:"ALL",months:18,bbvaOnly:state.country==="ALL"}}
    function trendKey(request){return[request.countryCode||"ALL",request.platform||"ALL",request.segment,request.bbvaOnly?"BBVA":"ALL",request.months].join("|")}
    async function loadTrends(){const request=trendRequest(),key=trendKey(request),token=++state.trendToken;if(state.trendCache.has(key)){state.trends=state.trendCache.get(key);state.trendsLoading=false;renderDashboard();return}state.trendsLoading=true;renderChartsLoading();state.trendPromise=callServer("trends",request);try{const trends=await state.trendPromise;if(token!==state.trendToken)return;state.trends=trends||[];state.trendCache.set(key,state.trends)}catch(error){if(token===state.trendToken)showError(error)}finally{if(token===state.trendToken){state.trendsLoading=false;state.trendPromise=null;renderDashboard()}}}

    function renderDashboard(){renderOverview();renderBenchmark();renderEvolution();renderPrintContext()}
    function renderHero(){const run=state.meta.latestRun||{},status=run.status||"SIN RUN",incidents=run.incidents||[];$("run-status").textContent=status==="OK"?"Datos actualizados":status==="PARTIAL"?"Actualización parcial":status;$("run-dot").className=`status-dot ${status==="OK"?"":status==="PARTIAL"?"warn":"bad"}`;$("run-date").textContent=`${dateTimeLabel(run.startedAt)} · ${run.appsOk??0}/${run.appsTotal??0} apps con rating`;$("incident-button").textContent=incidents.length?`${incidents.length} incidencia${incidents.length===1?"":"s"}`:"Sin incidencias";$("incident-button").disabled=!incidents.length;$("incident-list").innerHTML=incidents.map(item=>`<article class="incident"><strong>${U.esc(`${D.config.flags[item.countryCode]||"🌐"} ${countryLabel(item.countryCode)}`)} · ${U.platformBadge(item.platform)} · ${U.esc(item.status)}</strong><span>${U.esc(`${appNameFromKey(item.appKey)} · ${item.detail}`)}</span></article>`).join("")||U.empty("Sin incidencias","La última actualización terminó correctamente.")}
    const appNameFromKey=appKey=>{const row=state.snapshot.find(item=>item.appKey===appKey);return row?D.appName(row):appKey};
    const selectionContext=scope=>`${state.country==="ALL"?"Todos los mercados":countryLabel(state.country)} · ${D.config.platformLabels[state.platform]} · ${scope}`;
    const overviewContext=()=>selectionContext("BBVA Empresas");
    const activeBenchmark=()=>state.country==="ALL"?"BBVA Empresas":D.config.segmentLabels[state.benchmarkSegment];
    const trendScope=()=>state.country==="ALL"?"BBVA Empresas":"Todo el mercado";
    const evolutionContext=()=>selectionContext(trendScope());

    function renderOverview(){
      const rows=D.selectionRows(state.snapshot,selection(),"BANK"),focus=rows.filter(row=>row.isBbva),benchmarkRows=D.selectionRows(state.snapshot,selection(),"ALL",true);
      renderExecutiveKpis(focus,benchmarkRows);renderOverviewComparison();renderSignals(focus,benchmarkRows);renderCountries(focus);$("overview-subtitle").textContent=overviewContext();$("data-date").textContent=`Actualizado ${dateLabel(state.meta.dataDate)}`;$("overview-comparison-context").textContent=state.country==="ALL"?"BBVA Empresas por geografía, con el nombre completo de cada banco":"BBVA Empresas y bancos de "+countryLabel(state.country);
    }
    function renderExecutiveKpis(focus,benchmarkRows){
      const uniqueFocus=D.uniqueStoreRows(focus),consolidated=state.platform==="ALL"?(state.country==="ALL"?state.consolidated?.group:state.consolidated?.countries?.[state.country]):null,score=D.finite(consolidated?.rating)?consolidated.rating:D.mean(uniqueFocus.map(row=>row.rating)),volume=D.volumeSummary(focus),observed=focus.filter(row=>D.finite(row.rating)),coverage=focus.length?observed.length/focus.length:null,leaders=D.countBbvaLeaders(benchmarkRows);
      const cards=[{label:D.finite(consolidated?.rating)?"Rating consolidado":"Rating medio visible",value:fmt(score,2),suffix:"/ 5",foot:D.finite(consolidated?.rating)?`Cobertura de pesos ${fmt((consolidated.coverage||0)*100,0)}%`:`${uniqueFocus.filter(row=>D.finite(row.rating)).length} fichas BBVA únicas`,accent:true},{label:"Valoraciones acumuladas",value:integer(volume.accumulated),foot:volumeFoot(volume,false)},{label:"Nuevas valoraciones",value:integer(volume.period),suffix:"30d",foot:volumeFoot(volume,true)},{label:"Liderazgos BBVA",value:String(leaders.value),suffix:`de ${leaders.comparable}`,foot:"Posiciones #1 comparables"},{label:"Cobertura BBVA",value:fmt(D.finite(coverage)?coverage*100:null,0),suffix:"%",foot:`${observed.length}/${focus.length} observaciones BBVA · ${focus.filter(row=>row.fresh).length} frescas`}];
      $("kpi-grid").innerHTML=U.metrics(cards);
    }
    function volumeFoot(volume,period){const base=period?`${volume.comparable} fichas BBVA con comparativa`:`${volume.counted} fichas BBVA con volumen`;return volume.shared?`${base} · Android compartida, sin duplicar`:base}
    function renderCountries(focus){const groups=D.groupBy(focus,row=>row.countryCode),codes=Object.keys(groups).filter(code=>groups[code].some(row=>D.finite(row.rating))).sort();$("market-count").textContent=`${codes.length} mercado${codes.length===1?"":"s"} · solo BBVA Empresas`;if(!codes.length){$("country-grid").innerHTML=U.empty("Sin datos BBVA para esta selección","Prueba otra plataforma.");return}$("country-grid").innerHTML=codes.map(code=>{const platformRows=(state.platform==="ALL"?D.config.platforms:[state.platform]).map(platform=>({platform,item:groups[code].find(row=>row.platform===platform&&D.finite(row.rating))})).filter(entry=>entry.item);const average=D.mean(platformRows.map(entry=>entry.item.rating));return`<article class="country-card"><div class="country-title"><div class="country-name"><span class="flag">${D.config.flags[code]||"🌐"}</span>${U.esc(countryLabel(code))}</div><span class="country-score">${fmt(average,2)} media BBVA</span></div><div class="platform-list">${platformRows.map(({platform,item})=>renderMarketRow(code,platform,item)).join("")}</div></article>`}).join("")}
    function renderMarketRow(code,platform,item){const linked=Boolean(item.storeUrl),showVolume=item.volumeScope!=="SHARED_LISTING",tag=linked?"a":"div",store=D.config.storeLabels[platform]||"market",attrs=linked?marketLinkAttributes(item,code):"",volume=showVolume?`<span class="rating-count">${integer(item.ratingCount)} valoraciones${D.finite(item.ratingCountDelta30d)?` · ${item.ratingCountDelta30d>=0?"+":""}${integer(item.ratingCountDelta30d)} en 30d`:""}</span>`:"";return`<${tag} class="platform-row${linked?" market-link":""}"${attrs}><span class="platform-name">${U.platformBadge(platform)}</span><div class="rating-track"><div class="rating-fill" style="width:${item.rating/5*100}%"></div></div><span class="rating-number">${fmt(item.rating,2)}<em class="${item.delta30d>0?"delta-up":item.delta30d<0?"delta-down":""}">${signed(item.delta30d)}</em></span>${volume}${linked?`<span class="market-action"><span>${U.esc(store)}</span>${U.icon("right")}</span>`:""}</${tag}>`}
    function marketLinkAttributes(item,code){const store=D.config.storeLabels[item.platform]||"market",country=countryLabel(code||item.countryCode);return` href="${U.esc(item.storeUrl)}" target="_blank" rel="noopener noreferrer" title="Abrir ficha web de ${U.esc(store)} para ${U.esc(country)}" aria-label="Abrir ${U.esc(store)} web: ${U.esc(D.appName(item))}, ${U.esc(country)}, rating ${fmt(item.rating,2)}"`}
    function renderSignals(focus,benchmarkRows){const deltas=focus.filter(row=>D.finite(row.delta30d)),movement=[...deltas].sort((a,b)=>Math.abs(b.delta30d)-Math.abs(a.delta30d))[0],best=[...focus].filter(row=>D.finite(row.rating)).sort((a,b)=>b.rating-a.rating)[0],peer=state.country==="ALL"?null:[...benchmarkRows].filter(row=>!row.isBbva&&D.finite(row.rating)).sort((a,b)=>b.rating-a.rating)[0],incomplete=focus.filter(row=>!row.rankingComplete).length,markets=new Set(focus.map(row=>row.countryCode)).size;const signals=[{icon:"arrows",title:"Mayor movimiento BBVA",text:movement?`${countryLabel(movement.countryCode)} · ${movement.platform}`:"Sin histórico",value:movement?signed(movement.delta30d):"—",cls:movement?.delta30d>0?"delta-up":"delta-down"},{icon:"check",title:"Mejor rating BBVA",text:best?`${countryLabel(best.countryCode)} · ${best.platform}`:"Sin rating",value:fmt(best?.rating,2)},{icon:"right",title:state.country==="ALL"?"Alcance BBVA Empresas":"Referencia competitiva",text:state.country==="ALL"?"Mercados visibles":peer?D.appName(peer):"Sin competidor",value:state.country==="ALL"?String(markets):fmt(peer?.rating,2)},{icon:"check",title:"Calidad BBVA",text:`${incomplete} registros incompletos`,value:`${focus.length-incomplete}/${focus.length||0}`}];$("signal-list").innerHTML=signals.map(item=>`<article class="signal"><div class="signal-icon">${U.icon(item.icon)}</div><div><strong>${U.esc(item.title)}</strong><span>${U.esc(item.text)}</span></div><div class="signal-value ${item.cls||""}">${U.esc(item.value)}</div></article>`).join("")}

    function renderBenchmark(){$("benchmark-context").textContent=selectionContext(D.config.segmentLabels[state.benchmarkSegment]);const rows=D.selectionRows(state.snapshot,selection(),state.benchmarkSegment,true).filter(row=>D.finite(row.rating)),groups=D.groupBy(rows,row=>row.countryCode),codes=Object.keys(groups).sort();if(!codes.length){$("benchmark-grid").innerHTML=U.empty("Benchmark sin datos","Selecciona otra plataforma o benchmark.");return}$("benchmark-grid").innerHTML=codes.map(code=>{const platforms=(state.platform==="ALL"?D.config.platforms:[state.platform]).filter(platform=>groups[code].some(row=>row.platform===platform)),boards=platforms.map(platform=>renderPlatformBoard(platform,groups[code].filter(row=>row.platform===platform))).join("");return`<article class="benchmark-country"><header class="benchmark-country-head"><strong><span class="flag">${D.config.flags[code]||"🌐"}</span>${U.esc(countryLabel(code))}</strong><span>${U.esc(D.config.segmentLabels[state.benchmarkSegment])}</span></header><div class="platform-boards" style="grid-template-columns:repeat(${platforms.length},minmax(0,1fr))">${boards}</div></article>`}).join("")}
    const renderPlatformBoard=(platform,rows)=>`<section class="platform-board"><header class="platform-head">${U.platformBadge(platform)}<span>${rows.length} apps</span></header><ol class="rank-list">${D.rankRows(rows).map(renderRankRow).join("")}</ol></section>`;
    function renderRankRow(row){const linked=Boolean(row.storeUrl),tag=linked?"a":"div";return`<li class="rank-item"><${tag} class="rank-row${row.isBbva?" bbva":""}${linked?" market-link":""}"${linked?marketLinkAttributes(row,row.countryCode):""}><span class="rank-number">${row.computedRank}</span>${appLogo(row)}<div class="app-info"><strong>${U.esc(D.appName(row))}</strong><span>${row.isBbva?"BBVA Empresas":row.segment==="BANK"?"Banca":"Fintech / Neobanco"}</span></div><div class="rank-metric"><strong>${fmt(row.rating,2)}</strong><span class="${row.delta30d>0?"delta-up":row.delta30d<0?"delta-down":""}">${signed(row.delta30d)}</span></div>${linked?`<span class="rank-open" aria-hidden="true"><span>Market</span>${U.icon("right")}</span>`:""}</${tag}></li>`}
    function appLogo(row){const url=state.meta.logos?.[row.appKey];return`<span class="app-logo">${url?`<img src="${U.esc(url)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:""}<b>${U.esc(initials(D.appName(row)))}</b></span>`}

    function activeTrendRows(){return D.trendRows(state.trends,selection())}
    function renderChartsLoading(){const loading=U.loading();$("evolution-chart").innerHTML=loading;$("evolution-legend").innerHTML="";$("series-summary").innerHTML=U.loading("Cargando movimientos","Se reutiliza la caché de tendencias.");$("evolution-kpis").innerHTML=U.metrics(Array.from({length:6},()=>({label:"Cargando",value:"—",foot:"Datos en caché"})))}
    function chartOptions(period="",idPrefix="markets"){return{period,idPrefix,format:fmt,monthLabel,allMarkets:state.country==="ALL",context:evolutionContext()}}
    function renderOverviewComparison(){const groups=D.ratingComparison(state.snapshot,selection());$("overview-comparison").innerHTML=C.ratingBars(groups,{format:fmt,label:row=>state.country==="ALL"?`BBVA ${countryLabel(row.countryCode)}`:row.isBbva?`BBVA ${countryLabel(row.countryCode)}`:D.appName(row)})}
    function syncPeriodControls(rows){const model=D.periodModel(rows,state.periodYear,state.periodMonth);state.periodYear=model.year;state.periodMonth=model.month;$("year-filter").innerHTML=model.years.map(year=>U.option(year,year,year===model.year)).join("");$("month-filter").innerHTML=model.months.map(month=>U.option(month,monthName(month),month===model.month)).join("");$("year-filter").disabled=!model.years.length;$("month-filter").disabled=!model.months.length;return model}
    function renderEvolution(){
      const rows=activeTrendRows(),period=syncPeriodControls(rows),context=evolutionContext();$("chart-context-chip").textContent=context;$("chart-context").textContent=context;$("filter-hierarchy-copy").textContent=`${state.country==="ALL"?"Todos los mercados":countryLabel(state.country)} → ${D.config.platformLabels[state.platform]} → ${period.period?monthLabel(period.period):"Sin periodo"}`;
      if(state.trendsLoading){renderChartsLoading();return}const kpis=D.evolutionKpis(rows,state.snapshot,selection(),period.period);renderEvolutionKpis(kpis);const series=D.prepareSeries(rows,selection()),chart=C.lineChart(series,chartOptions(period.period,"evolution"));$("evolution-chart").innerHTML=chart.svg;$("evolution-legend").innerHTML=chart.legend;renderSeriesSummary(chart.series,period.period);$("movement-period").textContent=kpis.monthPeriod?`${monthLabel(kpis.monthPeriod)} → ${monthLabel(kpis.currentPeriod)}`:"Sin periodo anterior";
    }
    function renderEvolutionKpis(kpis){const annualClass=kpis.annual>0?"delta-up":kpis.annual<0?"delta-down":"",monthlyClass=kpis.monthly>0?"delta-up":kpis.monthly<0?"delta-down":"";const cards=[{label:"Cierre año anterior",value:fmt(kpis.yearClose,2),suffix:"/ 5",foot:kpis.yearPeriod?monthLabel(kpis.yearPeriod):"Sin cierre anterior",accent:true},{label:"Cierre mes anterior",value:fmt(kpis.monthClose,2),suffix:"/ 5",foot:kpis.monthPeriod?monthLabel(kpis.monthPeriod):"Sin mes anterior"},{label:"Variación anual",value:signed(kpis.annual),foot:kpis.yearPeriod?`Desde ${monthLabel(kpis.yearPeriod)}`:"Sin base anual",valueClass:annualClass},{label:"Variación mensual",value:signed(kpis.monthly),foot:kpis.monthPeriod?`Desde ${monthLabel(kpis.monthPeriod)}`:"Sin base mensual",valueClass:monthlyClass},{label:"Última actualización",value:dateLabel(state.meta.dataDate),foot:`Cierre seleccionado: ${monthLabel(kpis.currentPeriod)}`},{label:"Cobertura BBVA",value:fmt(D.finite(kpis.coverage)?kpis.coverage*100:null,0),suffix:"%",foot:`${kpis.observed}/${kpis.expected} series esperadas`}];$("evolution-kpis").innerHTML=U.metrics(cards)}
    function renderSeriesSummary(series,period){if(!series.length){$("series-summary").innerHTML=U.empty("Sin series","No hay movimientos para este periodo.");return}$("series-summary").innerHTML=series.map((item,index)=>{const points=[...item.points].filter(point=>D.finite(point.value)&&point.month<=period).sort((a,b)=>a.month.localeCompare(b.month)),current=points.at(-1),previous=points.at(-2),change=current&&previous?current.value-previous.value:null,color=T.chart.palette[index%T.chart.palette.length];return`<article class="series-card"><i class="series-dot" style="background:${color}"></i><div><strong>${U.esc(item.label)}</strong><span>${fmt(current?.value,2)} rating · ${current?monthLabel(current.month):"sin dato"}</span></div><b class="${change>0?"delta-up":change<0?"delta-down":""}">${signed(change)}</b></article>`}).join("")}

    async function loadAlerts(force=false){if(state.alertsLoading||state.alertsLoaded&&!force){if(state.alertsLoaded)renderAlerts();return}state.alertsLoading=true;$("alerts-loading").classList.remove("hidden");$("alerts-content").classList.add("hidden");try{state.alertCenter=await callServer("alerts:get");state.alertDraft=JSON.parse(JSON.stringify(state.alertCenter.preferences));state.alertsLoaded=true;renderAlerts()}catch(error){showError(error);$("alerts-loading").textContent=error?.message||String(error)}finally{state.alertsLoading=false}}
    function renderAlerts(){const center=state.alertCenter,draft=state.alertDraft;if(!center||!draft)return;$("alerts-loading").classList.add("hidden");$("alerts-content").classList.remove("hidden");$("alert-user-email").textContent=center.user.email;$("alert-system-copy").textContent=center.system.privacy;$("alert-active").checked=Boolean(draft.active);$("alert-master-copy").textContent=draft.active?"Tu resumen personal está activo":"Activa tu resumen personal";$("alert-mail-status").textContent=center.system.emailDeliveryEnabled?"Envío global activo":"Envío global desactivado";$("alert-mail-orb").classList.toggle("bad",!center.system.emailDeliveryEnabled);$("alert-schedule").textContent=center.system.schedule;$("alert-delivery-scope").textContent=center.system.deliveryScope;$("review-source-message").textContent=center.system.reviewDataMessage;$("review-warning").value=draft.reviewWarningPct;$("review-critical").value=draft.reviewCriticalPct;["daily","mtd","ytd"].forEach(period=>{$(period+"-enabled").checked=Boolean(draft[period+"DropEnabled"]);$(period+"-warning").value=draft[period+"WarningDrop"];$(period+"-critical").value=draft[period+"CriticalDrop"]});$("repeat-enabled").checked=Boolean(draft.repeatWhileBreached);$("crossover-enabled").checked=Boolean(draft.crossoverEnabled);$("crossover-direction").value=draft.crossoverDirection;$("alert-test-button").disabled=!center.system.emailDeliveryEnabled;const warning=$("alert-config-warning");warning.textContent=center.system.configWarning||"";warning.classList.toggle("hidden",!center.system.configWarning);renderAlertScopes();renderAlertActivity(center.recentEvents||[]);syncAlertRuleInputs();$("alert-save-state").textContent=draft.persisted?`Guardado ${draft.updatedAt?dateTimeLabel(draft.updatedAt):"para tu cuenta"}`:"Valores recomendados · activa y guarda cuando quieras"}
    function renderAlertScopes(){const selectedCountries=state.alertDraft.countries||["ALL"],selectedPlatforms=state.alertDraft.platforms||["ALL"],countries=[{code:"ALL",name:"Todos"},...Object.entries(D.config.countries).map(([code,name])=>({code,name}))],platforms=["ALL",...D.config.platforms];$("alert-country-scope").innerHTML=countries.map(item=>scopeChip("alert-country",item.code,`${item.code==="ALL"?"":D.config.flags[item.code]||""} ${item.name}`.trim(),selectedCountries.includes(item.code))).join("");$("alert-platform-scope").innerHTML=platforms.map(platform=>scopeChip("alert-platform",platform,U.platformBadge(platform),selectedPlatforms.includes(platform),true)).join("");updateAlertScopeSummaries()}
    const scopeChip=(name,value,label,checked,trusted=false)=>`<label class="scope-chip"><input type="checkbox" name="${name}" value="${U.esc(value)}" ${checked?"checked":""}><span>${trusted?label:U.esc(label)}</span></label>`;
    function updateAlertScopeSummaries(){const countries=selectedAlertScope("alert-country"),platforms=selectedAlertScope("alert-platform");$("alert-country-scope-summary").textContent=countries.includes("ALL")?"Todos los mercados, incluidas futuras incorporaciones":countries.map(countryLabel).join(", ");$("alert-platform-scope-summary").textContent=platforms.includes("ALL")?"Todas las plataformas":platforms.map(item=>D.config.platformLabels[item]||item).join(", ")}
    function handleAlertScopeChange(event){if(!event.target.matches("input[type=checkbox]"))return;const inputs=[...event.currentTarget.querySelectorAll("input[type=checkbox]")],selected=inputs.filter(input=>input.checked).map(input=>input.value),normalized=D.exclusiveScopeSelection(selected,event.target.value,event.target.checked);inputs.forEach(input=>input.checked=normalized.includes(input.value));updateAlertScopeSummaries();markAlertsDirty()}
    function selectedAlertScope(name){const values=[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(input=>input.value);return values.length?values:["ALL"]}
    function alertDraftFromForm(){return{active:$("alert-active").checked,countries:selectedAlertScope("alert-country"),platforms:selectedAlertScope("alert-platform"),reviewShareEnabled:false,reviewWarningPct:Number($("review-warning").value),reviewCriticalPct:Number($("review-critical").value),dailyDropEnabled:$("daily-enabled").checked,dailyWarningDrop:Number($("daily-warning").value),dailyCriticalDrop:Number($("daily-critical").value),mtdDropEnabled:$("mtd-enabled").checked,mtdWarningDrop:Number($("mtd-warning").value),mtdCriticalDrop:Number($("mtd-critical").value),ytdDropEnabled:$("ytd-enabled").checked,ytdWarningDrop:Number($("ytd-warning").value),ytdCriticalDrop:Number($("ytd-critical").value),repeatWhileBreached:$("repeat-enabled").checked,crossoverEnabled:$("crossover-enabled").checked,crossoverDirection:$("crossover-direction").value,deliveryMode:"DAILY_DIGEST"}}
    function syncAlertRuleInputs(){["daily","mtd","ytd"].forEach(period=>{$(period+"-warning").disabled=!$(period+"-enabled").checked;$(period+"-critical").disabled=!$(period+"-enabled").checked});$("crossover-direction").disabled=!$("crossover-enabled").checked}
    function markAlertsDirty(){$("alert-master-copy").textContent=$("alert-active").checked?"Tu resumen personal estará activo":"Las alertas quedarán en pausa";$("alert-save-state").textContent="Tienes cambios sin guardar"}
    function setAlertActionsBusy(busy){["alert-save-button","alert-reset-button","alert-test-button"].forEach(id=>$(id).disabled=busy||(id==="alert-test-button"&&!state.alertCenter?.system.emailDeliveryEnabled))}
    async function saveAlerts(event){event.preventDefault();setAlertActionsBusy(true);try{const saved=await callServer("alerts:save",alertDraftFromForm());state.alertCenter.preferences=saved;state.alertDraft=JSON.parse(JSON.stringify(saved));renderAlerts();showToast("Tus alertas se han guardado solo para tu cuenta.",true)}catch(error){showError(error)}finally{setAlertActionsBusy(false)}}
    async function resetAlerts(){setAlertActionsBusy(true);try{const saved=await callServer("alerts:reset");state.alertCenter.preferences=saved;state.alertDraft=JSON.parse(JSON.stringify(saved));renderAlerts();showToast("Valores recomendados restaurados.",true)}catch(error){showError(error)}finally{setAlertActionsBusy(false)}}
    function renderAlertTestResult(result,error){const panel=$("alert-test-result");panel.classList.remove("hidden");panel.classList.toggle("error",Boolean(error));if(error){panel.innerHTML=`<div><strong>No se pudo aceptar la prueba</strong><span>${U.esc(error?.message||String(error))}</span></div>`;return}const delivery=result.senderAddress?` · remitente ${result.senderName} <${result.senderAddress}>`:"";const sender=result.effectiveSender?` · ejecutado por ${result.effectiveSender}`:"";const gmail=result.messageId?` · Gmail ID ${result.messageId}`:"";const audit=result.auditLogged?" · auditoría registrada":" · auditoría pendiente";panel.innerHTML=`<div><strong>Gmail ha aceptado la prueba ${U.esc(result.deliveryId)}</strong><span>Destino ${U.esc(result.recipient)}${U.esc(delivery)}${U.esc(sender)}${U.esc(gmail)}${U.esc(audit)} · backend ${U.esc(result.codeVersion)} / web ${U.esc(result.webVersion)}. Busca ese identificador en Recibidos, spam o cuarentena.</span></div>`}
    async function testAlerts(){setAlertActionsBusy(true);try{const result=await callServer("alerts:test");if(!result?.sent||!result?.accepted)throw new Error("Google no ha aceptado la solicitud de correo.");renderAlertTestResult(result);showToast(`Prueba aceptada para ${result.recipient} · ${result.deliveryId}.`,true);await loadAlerts(true)}catch(error){renderAlertTestResult(null,error);showError(error)}finally{setAlertActionsBusy(false)}}
    function alertActivityLabel(type){return type==="RATING_DROP_DAILY"?"Caída diaria":type==="RATING_DROP_MTD"?"Caída desde inicio de mes":type==="RATING_DROP_YTD"?"Caída desde inicio de año":type==="TEST"?"Prueba de entrega":"Cruce competitivo"}
    function renderAlertActivity(events){if(!events.length){$("alert-activity").innerHTML=U.empty("Todavía no hay alertas para ti","Cuando una regla se active, aparecerá aquí y recibirás el resumen por email.");return}$("alert-activity").innerHTML=events.map(event=>`<article class="alert-event"><i class="alert-event-dot ${event.severity==="CRITICAL"?"critical":event.severity==="POSITIVE"?"positive":""}"></i><div><strong>${U.esc(alertActivityLabel(event.type))}</strong><span>${U.esc(event.countryCode)} · ${U.platformBadge(event.platform)} · ${U.esc(event.detail)}</span></div><time>${U.esc(dateTimeLabel(event.timestamp))}</time></article>`).join("")}

    async function loadAdmin(force=false){if(!state.userContext?.isAdmin)return;if(state.adminLoading||state.adminLoaded&&!force){if(state.adminLoaded)renderAdmin();return}state.adminLoading=true;$("admin-loading").classList.remove("hidden");$("admin-content").classList.add("hidden");try{state.adminCenter=await callServer("admin:get");state.adminLoaded=true;renderAdmin()}catch(error){$("admin-loading").textContent=error?.message||String(error);showError(error)}finally{state.adminLoading=false}}
    function statusBadge(value){const text=String(value||"—"),tone=/^(OK|ACTIVE|VERIFIED|SENT)$/i.test(text)?"ok":/PARTIAL|WARN|PENDING/i.test(text)?"warn":/ERROR|FAIL|DENIED|DISABLED/i.test(text)?"bad":"";return`<span class="admin-status ${tone}">${U.esc(text)}</span>`}
    function renderAdmin(){const center=state.adminCenter;if(!center)return;$("admin-loading").classList.add("hidden");$("admin-content").classList.remove("hidden");$("admin-generated-at").textContent=`Generado ${dateTimeLabel(center.generatedAt)} · ${center.administrator}`;$("admin-kpis").innerHTML=U.metrics([{label:"Suscripciones activas",value:String(center.summary.activeSubscribers),foot:`${center.summary.pausedSubscribers} pausadas`,accent:true},{label:"Ejecuciones visibles",value:String(center.summary.recentRuns),foot:"Ventana operativa reciente"},{label:"Incidencias recientes",value:String(center.summary.recentIssues),foot:"FETCH_LOG distinto de OK",valueClass:center.summary.recentIssues?"delta-down":"delta-up"},{label:"Eventos de alerta",value:String(center.summary.recentAlertEvents),foot:"Auditoría reciente"}]);renderAdminSystem(center.system);renderAdminRuns(center.recentRuns||[]);renderAdminIssues(center.fetchIssues||[]);renderAdminSubscribers(center.subscribers||[]);renderAdminAlerts(center.recentAlerts||[])}
    function renderAdminSystem(system){const items=[{label:"Backend / Web",value:`${system.codeVersion} / ${system.webVersion}`},{label:"Carga diaria",value:`${system.dailySchedule} · ${system.timeZone}`},{label:"Monitor de salud",value:system.healthMonitorEnabled?`Activo · ${system.healthSchedule}`:"Desactivado"},{label:"Destinatario técnico",value:system.healthRecipient||"Sin configurar"},{label:"Envío de alertas",value:system.emailDeliveryEnabled?"Activo":"Desactivado"},{label:"Remitente",value:system.senderAddress||"Sin alias",meta:system.senderVerificationStatus||system.senderError},{label:"Administradores",value:(system.administratorEmails||[]).join(", ")||"Sin configurar"}];$("admin-system").innerHTML=items.map(item=>`<article><small>${U.esc(item.label)}</small><strong>${U.esc(item.value)}</strong>${item.meta?`<span>${U.esc(item.meta)}</span>`:""}</article>`).join("")}
    function renderAdminRuns(rows){if(!rows.length){$("admin-runs").innerHTML=U.empty("Sin ejecuciones","RUN_LOG todavía no contiene actividad.");return}$("admin-runs").innerHTML=`<table class="admin-table"><thead><tr><th>Inicio</th><th>Estado</th><th>Apps</th><th>Errores</th><th>Filas</th><th>Duración</th><th>Alertas</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${U.esc(dateTimeLabel(row.startedAt))}<small>${U.esc(row.runId)}</small></td><td>${statusBadge(row.status)}</td><td>${integer(row.appsOk)} / ${integer(row.appsTotal)}</td><td>${integer(row.appsError)}</td><td>${integer(row.rowsUpserted)}</td><td>${D.finite(row.durationMs)?fmt(row.durationMs/1000,1)+" s":"—"}</td><td>${integer(row.emailsSent)}<small>${U.esc(row.deliveryStatus||"")}</small></td></tr>`).join("")}</tbody></table>`}
    function renderAdminIssues(rows){if(!rows.length){$("admin-issues").innerHTML=U.empty("Sin incidencias recientes","Las capturas de la ventana revisada terminaron correctamente.");return}$("admin-issues").innerHTML=rows.map(row=>`<article class="admin-list-item"><div><strong>${U.esc(`${D.config.flags[row.countryCode]||"🌐"} ${countryLabel(row.countryCode)} · ${row.appKey}`)}</strong><span>${U.esc(row.detail||"Sin detalle")}</span></div><div>${U.platformBadge(row.platform,false)}${statusBadge(row.status)}<time>${U.esc(dateTimeLabel(row.fetchedAt))}</time></div></article>`).join("")}
    function renderAdminSubscribers(rows){if(!rows.length){$("admin-subscribers").innerHTML=U.empty("Sin suscripciones","Todavía no se han guardado preferencias.");return}$("admin-subscribers").innerHTML=rows.map(row=>`<article class="admin-list-item"><div><strong>${U.esc(row.email)}</strong><span>${U.esc((row.countries||[]).join(", "))} · ${U.esc((row.platforms||[]).join(", "))}</span></div><div>${statusBadge(row.active?"ACTIVE":"PAUSED")}<time>${U.esc(dateTimeLabel(row.updatedAt||row.lastSeenAt))}</time></div></article>`).join("")}
    function renderAdminAlerts(rows){if(!rows.length){$("admin-alerts").innerHTML=U.empty("Sin eventos recientes","ALERT_LOG todavía no contiene señales.");return}$("admin-alerts").innerHTML=`<table class="admin-table"><thead><tr><th>Fecha</th><th>Señal</th><th>Ámbito</th><th>Destinatario</th><th>Detalle</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${U.esc(dateTimeLabel(row.timestamp))}</td><td>${statusBadge(row.severity)}<small>${U.esc(row.type)}</small></td><td>${U.esc(`${row.countryCode} · ${row.platform}`)}</td><td>${U.esc(row.userEmail)}</td><td>${U.esc(row.detail)}</td></tr>`).join("")}</tbody></table>`}

    function showChartTooltip(point,event){const tooltip=$("chart-tooltip");tooltip.innerHTML=`<strong>${U.esc(point.dataset.label)}</strong>${U.esc(point.dataset.month)} · ${U.esc(point.dataset.value)} rating${state.country==="ALL"?" · BBVA Empresas":""}`;tooltip.classList.remove("hidden");positionTooltip(event.clientX,event.clientY)}
    function positionTooltip(x,y){const tooltip=$("chart-tooltip"),left=Math.min(window.innerWidth-tooltip.offsetWidth-12,x+13),top=Math.max(10,y-tooltip.offsetHeight-14);tooltip.style.left=`${left}px`;tooltip.style.top=`${top}px`}
    function hideChartTooltip(){$("chart-tooltip").classList.add("hidden")}
    async function downloadReport(){const button=$("report-button"),label=button.innerHTML;button.disabled=true;button.innerHTML="<span>Preparando informe…</span>";try{if(state.view==="alerts")throw new Error("La configuración privada de alertas no forma parte del informe analítico.");if(state.trendPromise)await state.trendPromise;if(document.fonts?.ready)await document.fonts.ready;const request=trendRequest(),key=trendKey(request);let reportTrends=state.trendCache.get(key);if(!reportTrends){reportTrends=await callServer("trends",request);state.trendCache.set(key,reportTrends||[])}const viewLabel={overview:"Resumen",benchmark:"Benchmark",evolution:"Evolución"}[state.view]||"Resumen",scopeLabel=`${state.country==="ALL"?"Todos los mercados":countryLabel(state.country)} · ${D.config.platformLabels[state.platform]}`;MarketsReport.render({target:$("print-report"),meta:state.meta,snapshot:state.snapshot,trends:reportTrends||[],benchmarkSegment:state.benchmarkSegment,view:state.view,selection:selection(),periodYear:state.periodYear,periodMonth:state.periodMonth,generatedAt:new Date()});document.title=`BBVA COMMERCIAL · ${viewLabel} · ${scopeLabel} · ${state.meta.dataDate}`;window.print()}catch(error){showError(error)}finally{button.disabled=false;button.innerHTML=label}}
    function renderPrintContext(){$("print-context").textContent=`${overviewContext()} · Benchmark: ${activeBenchmark()} · Gráficas: ${trendScope()} · Evolución: ${state.periodYear&&state.periodMonth?monthLabel(`${state.periodYear}-${state.periodMonth}`):"último cierre"} · ${dateLabel(state.meta?.dataDate)} · generado ${dateTimeLabel(new Date().toISOString())}`}
    function showToast(message,success=false){const toast=$("toast");toast.textContent=message;toast.classList.toggle("success",success);toast.classList.remove("hidden");window.setTimeout(()=>toast.classList.add("hidden"),7000)}
    function showError(error){showToast(error?.message||String(error),false)}
  })();
</script>
