        ()=>fetchReviewData("review:page",{...reviewScope(),language:appLanguage,page:reviewPage},true),
        ()=>fetchReviewData("review:nps",annualNpsScope(annualScope()),true),

        },
        ()=>fetchReviewData("review:analytics",annualReviewRequest(annualScope()),true)
      ];
      function schedule(){
        if(!steps.length)return;
        window.setTimeout(()=>{
          if(document.visibilityState!=="visible"){
            document.addEventListener("visibilitychange",schedule,{once:true});
            return;
          }
          if(activeRpc){schedule();return}
          const run=()=>{
            if(document.visibilityState!=="visible"||activeRpc){schedule();return}
            Promise.resolve().then(steps.shift()).catch(()=>{}).finally(schedule);
          };
          if(window.requestIdleCallback)window.requestIdleCallback(run,{timeout:2000});
          else run();
        },1200);
      }
      schedule();
    }

      if(analyticsLoading){localOnly=false;heatmapOnly=false}

      const cached=hasReviewResponse("review:analytics",request);
      const showLoading=!sameView&&!cached;
      if(!sameView)renderedAnalyticsKey="";
      pendingAnalyticsKey=key;
      analyticsLoading=true;
      const sheets=exportSheets.analytics;
      if(!sameView&&!localOnly)sheets.delete("Mapa de calor");
      if(!sameView&&!heatmapOnly){sheets.delete("Rating al cierre del mes");sheets.delete("Indicadores del periodo");sheets.delete("Reseñas más útiles");sheets.delete("Personas con más reseñas")}

        ?translate("Indicadores del acumulado del año hasta la fecha"):translate("Indicadores de {year}",{year:scope.year});
      radarFilters.analytics.render();
      if(!localOnly&&showLoading){
        target.setAttribute("aria-busy","true");
        const matrix=target.querySelector("[data-matrix]");
        if(matrix){matrix.innerHTML=U.loading(translate("Cargando el mapa de calor"));target.querySelector("[data-pages]").replaceChildren()}
        else target.innerHTML=U.loading(translate("Cargando el mapa de calor"));
      }
      if(!heatmapOnly){
        const trends=annualTrendRequest(scope);
        if(!sameView&&scope.country!=="UNKNOWN"&&!cachedTrendRows(trends)){
          $("annual-chart").innerHTML=U.loading(translate("Cargando el histórico de ratings"));
          $("annual-series").replaceChildren();

        if(showLoading)$("review-annual").innerHTML=U.loading(translate("Cargando indicadores de reseñas"));
        loadAnnualNps(scope,dates);

        const trends=heatmapOnly||scope.country==="UNKNOWN"?[]:fetchTrends(annualTrendRequest(scope));

          const apps=new Set(data.entityOptions);
          for(const row of annualTrends)if(row.month.startsWith(scope.year)&&D.finite(row.ratingEom))apps.add(D.appName(row));
          apps.delete(defaultAnalyticsEntity);
          const compareCountry=isAnnualCountry(scope.country);
          const options=[...(compareCountry?["ALL"]:[]),defaultAnalyticsEntity,...[...apps].sort((a,b)=>a.localeCompare(b,locale()))];
          if(!options.includes(analyticsEntity)){
            analyticsEntity=defaultAnalyticsEntity;
            analyticsLoading=false;
            pendingAnalyticsKey="";
            return loadAnalytics(true);
          }
          entityControl.innerHTML=options.map(name=>U.option(name,name===defaultAnalyticsEntity?"BBVA":annualEntityLabel(name),name===analyticsEntity)).join("");
          annualAppControl.refresh();
          renderAnnualReviews($("review-annual"),data,scope);

      }finally{

    function renderAdminActivity(target,days,label,primary,heading="Actividad diaria"){

      const max=Math.max(1,...days.map(primary));
      const months=new Map();
      for(const day of days){const key=day.date.slice(0,7);months.set(key,(months.get(key)||0)+1)}
      const monthFormat=new Intl.DateTimeFormat(locale(),{month:"long",year:"numeric",timeZone:"UTC"});
      const control=(step,caption)=>`<button type="button" class="button activity-control" data-step="${step}" aria-label="${caption}">${step<0?"‹":"›"}</button>`;
      root.innerHTML=`<section class="activity-timeline"><div class="activity-heading"><div><strong>${U.esc(translate(heading))}</strong>
        <p class="activity-range small muted" aria-live="polite"></p></div><button type="button" class="button" data-step="end">Últimos días</button></div>
        <div class="activity-navigation">${control(-1,"Ver días anteriores")}<ul class="activity-chart" tabindex="0" aria-label="${U.esc(label)}">${days.map((day,i)=>{
          const month=day.date.slice(0,7), value=primary(day);
          const description=`${dateLabel(day.date)} · ${integer(value)} ${translate(label).toLocaleLowerCase(locale())}`;
          return `<li class="activity-column" data-date="${day.date}" aria-label="${U.esc(description)}" title="${U.esc(description)}"><span>${integer(value)}</span>
            <div class="activity-bars"><i style="height:${100*value/max}%"></i></div>
            <time datetime="${day.date}">${day.date.slice(8)}</time>${days[i-1]?.date.slice(0,7)!==month?`<span class="activity-month" style="--days:${months.get(month)}">${U.esc(monthFormat.format(new Date(month+"-01T00:00:00Z")))}</span>`:""}</li>`;
        }).join("")}</ul>${control(1,"Ver días siguientes")}</div></section>`;
      const chart=root.querySelector(".activity-chart"), range=root.querySelector(".activity-range");
      const earlier=root.querySelector('[data-step="-1"]'), later=root.querySelector('[data-step="1"]'), latest=root.querySelector('[data-step="end"]');
      const step=()=>chart.children[1]?.offsetLeft-chart.children[0].offsetLeft||chart.children[0].offsetWidth||1;
      const update=()=>{
        const left=chart.scrollLeft, width=step();
        earlier.disabled=left<=1;later.disabled=latest.disabled=left+chart.clientWidth>=chart.scrollWidth-1;
        const first=Math.min(days.length-1,Math.floor((left+1)/width));
        const last=Math.min(days.length-1,Math.max(first,Math.ceil((left+chart.clientWidth-1)/width)-1));

    }

        operations?.activeReviewStage?"Esperando "+operations.activeReviewStage:"Pendiente del supervisor";

        const timing=system.deliveryTiming?.[id], audit=system.deliveries?.[id];
        const data=Date.parse(timing?.startedAt)>=Date.parse(audit?.startedAt||0)?{...audit,...timing}:audit||{};
        const running=data.status==="RUNNING"&&Date.now()-Date.parse(data.startedAt)<7*60000;
        const known=Number.isInteger(data.sent)&&Number.isInteger(data.total)&&data.sent>=0&&data.sent<=data.total;
        const details=[
          Number.isInteger(data.attempted)?`${integer(data.attempted)} intentadas`:"",

          status:runningRatings?"En curso":["PARTIAL","OK"].includes(latest?.status)&&latest.appsError===0&&latest.appsTotal>0&&latest.appsOk+latest.appsNoRating===latest.appsTotal?"Activo":latest?.status||"Sin ejecuciones",updatedAt:latest?.startedAt,done:latest?latest.appsOk+latest.appsNoRating+latest.appsError:0,total:latest?.appsTotal,retryAt:ratingSchedule?.retryAt,error:ratingSchedule?.failure},
        {id:"newsletter",priority:2,group:"Envíos planificados",name:"Newsletter mensual",schedule:system.newsletterSchedule,enabled:system.newsletterDeliveryEnabled,...delivery("newsletter",operations?.newsletter?.startedAt)},
        ...(pipeline?.jobs||[]).map(job=>({...job,name:job.label,
          group:({supervisor:"Supervisor",ios:"Recopilación de reseñas",android:"Recopilación de reseñas",
            alerts:"Envíos planificados",translate:"Traducción de reseñas y respuestas",publish:"Generación de snapshots"})[job.id],
          schedule:job.id==="supervisor"?`Cada ${operations?.interval||15} minutos`:pipeline.day,
          enabled:job.id==="supervisor"?pipeline.installed!==false:undefined,
          updatedAt:job.id==="supervisor"?operations?.supervisorLast:job.lastAttemptAt,
          nextTurnAt:job.id==="supervisor"&&pipeline.workerInstalled&&operations?.nextWorkerAt?new Date(operations.nextWorkerAt).toISOString():"",
          waitingFor:job.id==="supervisor"?(operations?.activeReviewStage||""):"",
          ...(job.id==="translate"&&operations?.translationRetryAt>Date.now()?{status:"Esperando cuota de traducción",retryAt:operations.translationRetryAt}:{}),
          detail:job.id==="supervisor"?([operations?.unifiedAfter?"Supervisión unificada":"Supervisión de reseñas",system.healthMonitorEnabled?"Monitor de salud · "+system.healthSchedule:"Monitor de salud desactivado",operations?.health?.startedAt?dateTimeLabel(operations.health.startedAt):""].filter(Boolean).join(" · ")):
            [job.id==="ios"||job.id==="android"?`${job.added||0} nuevas · ${job.updated||0} actualizadas · ${job.failures||0} errores`:"",
             job.replyPending==null?"":job.replyPending+" respuestas pendientes"].filter(Boolean).join(" · "),
          ...(job.id==="alerts"?delivery("reviewAlerts",job.lastAttemptAt):{})})),
        {id:"index",priority:3,group:"Clasificación de reseñas",name:"Clasificación de comentarios",...index,status:waiting(index),
          detail:index?.complete?"Recorrido completado. El supervisor revisa las nuevas reseñas.":""},
        {id:"geography",priority:3,group:"Inferencia geográfica",name:"Inferencia geográfica Android",...geo,status:waiting(geo),
          done:geo?.processed,total:geo?.last?geo.total:undefined,
          detail:geo?`${integer(geo.processed)} Android sin geografía revisadas · ${integer(geo.counts?.INFERIDO||0)} inferidas · ${integer(geo.counts?.NO_ATRIBUIBLE||0)} no atribuibles`:""},
        {id:"androidMetadata",priority:6,group:"Mantenimiento y backup",name:"Refresco de metadatos Android",...androidMetadata,status:waiting(androidMetadata),
          detail:androidMetadata?`${integer(androidMetadata.pages||0)} páginas · ${integer(androidMetadata.updated||0)} reseñas actualizadas`:""},
        {id:"maintenance",priority:6,group:"Mantenimiento y backup",name:"Mantenimiento incremental",...maintenance,done:maintenance?.total,
          detail:maintenance?.total==null?"":`${maintenance.invalid} inválidas · ${maintenance.duplicates} duplicadas · ${maintenance.archived||0} archivadas`},
        {...backup,id:"backup",priority:6,group:"Mantenimiento y backup",name:"Backup mensual",done:backup?.id?1:0,total:1},
        ...(system.functionalJobs||[]).map(job=>({...job,group:"Catálogo global de funcionalidades",

      const actions={backup:"Crear copia mensual",index:"Clasificar pendientes",geography:"Iniciar inferencia",maintenance:"Iniciar mantenimiento",

      const processCard=job=>{

          ${job.waitingFor?`<p class="small muted">Trabajo activo · ${U.esc(job.waitingFor)}</p>`:""}${statusLine("Último avance",job.lastProgressAt)}${statusLine("Último éxito",job.lastSuccessAt)}

          ${job.id==="ratings"?`<button id="admin-recovery" class="button" type="button" data-run-job="ratings" ${["En curso","En cola"].includes(status)?"disabled":""}>Solicitar recuperación de ratings</button>`:operations?.owner&&actions[job.id]?`<button class="button" type="button" data-run-job="${job.id}" ${!job.enabled||["En curso","En cola"].includes(status)?"disabled":""}>${actions[job.id]}</button>`:""}</article>`;
      };

      root.innerHTML=[...groups.values()].sort((a,b)=>a.priority-b.priority).map(group=>`<section class="process-group">
        <div class="panel-header"><h3>${U.esc(group.name)}</h3><span class="small muted">Prioridad ${group.priority}</span></div>

    function renderAdminJobSettings(operations, pipeline, system) {
      const panel=$("admin-job-settings");

      panel.classList.toggle("hidden",!operations?.owner||!["schedule","storage"].includes($("admin-business-section").value));
      if(!operations?.owner)return;

        <button class="button" type="submit">Guardar</button></form>`;

        {id:"index",name:"Clasificación de reseñas",priority:3},{id:"geography",name:"Inferencia geográfica Android",priority:3},{id:"backup",name:"Backup mensual",priority:6},{id:"maintenance",name:"Mantenimiento",priority:6},
        {id:"androidMetadata",name:"Refresco de metadatos Android",priority:6}];
      const forms=jobs.map(job=>{
        const settings=operations.config[job.id]||{};
        const enabled=settings.enabled ?? true;

          <label><input type="checkbox" name="enabled" ${enabled?"checked":""}> Habilitado</label>
          <label>Prioridad <input type="number" name="priority" min="1" max="6" value="${settings.priority||job.priority}" required></label>
          <label>Desde <input type="time" name="time" value="${U.esc(settings.time||"08:00")}" required></label>
          <label>Zona horaria <input name="timeZone" value="${U.esc(settings.timeZone||system.timeZone)}" required></label>
          <button class="button" type="submit">Guardar</button></fieldset></form>`;
      });
      const labels={telemetry:"Telemetría",executions:"Ejecuciones",backups:"Backups",captures:"Capturas",alerts:"Alertas",experience:"Incidencias de experiencia"};
      const folders=Object.entries(operations.folders||{}).map(([kind,id])=>`<form data-job-action="folder" data-id="${U.esc(kind)}">
        <label>${U.esc(labels[kind])} <input name="folder" value="${U.esc(id)}" required></label>

        catch(error){$("admin-job-settings-result").textContent=error.message}
        finally{button.disabled=false}
      };
    }

      try{
        const country=view==="reviews"?reviewScope().country:view==="analytics"?annualScope().country:state.country;
        if(!country||country==="ALL")throw new Error("Selecciona una geografía para descargar Excel.");
        if((view==="analytics"&&analyticsLoading)||(view==="evolution"&&(state.trendsLoading||monthlyReviewsLoading))){
          throw new Error("Espera a que termine de cargar la selección.");
        }
        let sheets;
        if(view==="reviews"){
          if(!reviewsReady)throw new Error("No hay comentarios cargados para descargar.");
          const scope={...reviewScope(),language:appLanguage};
          const {rows,topics,window:dates}=await callServer("review:export",scope);
          const filters=[["Geografía",countryLabel(country)],...exportDates(dates)];
          for(const key of ["app","platform","segment","audience","inferGeography","topic","rating","search","reviewKey"]){
            if(scope[key])filters.push([({app:"Aplicación",platform:"Plataforma",segment:"Sentimiento",audience:"Comentarios",inferGeography:"Inferir datos",topic:"Bloque funcional",rating:"Estrellas",search:"Buscar",reviewKey:"Reseña"})[key],reviewFilterLabel(key,scope[key])||$(`review-${key}`)?.selectedOptions?.[0]?.textContent||scope[key]]);
          }
          sheets=[{name:"Comentarios",filters,header:reviewExportHeader,rows:rows.map(row=>reviewExportRow(row,topics))}];
        }else{
          sheets=[...(exportSheets[view]?.values()||[])].filter(sheet=>sheet.country===country);
        }
        const file=window.MarketsWorkbook.build(sheets);
        const url=URL.createObjectURL(file), link=document.createElement("a");
        link.href=url;
        const title={benchmark:"Resumen",evolution:"Análisis mensual",analytics:"Análisis anual",reviews:"Comentarios"}[view];
        link.download=`EDC Market Pulse - ${title} - ${country}.xlsx`;
        link.click();
        window.setTimeout(()=>URL.revokeObjectURL(url),1000);
        trackUsage("ACTION",view,"REPORT_DOWNLOAD");
      }catch(error){showError(error)}
      finally{button.disabled=false;button.innerHTML=label}
    }
    function showToast(message,success=false){const toast=$("toast");toast.textContent=message;toast.classList.toggle("success",success);toast.classList.remove("hidden");window.setTimeout(()=>toast.classList.add("hidden"),7000)}
    function showError(error){const message=error?.message||String(error);trackUsage("ERROR",state.view,"CLIENT_ERROR",message);showToast(message,false)}
  })();
</script>
