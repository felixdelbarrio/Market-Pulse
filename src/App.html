    const supportedLanguage=value=>["es","en","tr"].includes(value)?value:"es";
    const browserLanguages=navigator.languages?.length?navigator.languages:[navigator.language];
    let appLanguage=browserLanguages.map(tag=>tag?.split("-")[0].toLowerCase()).find(value=>["es","en","tr"].includes(value))||"es";
    const locale=()=>({es:"es-ES",en:"en-GB",tr:"tr-TR"}[appLanguage]);
    const translate=(key,values={})=>{
      const variants=Object.hasOwn(interfaceCopy,key)?interfaceCopy[key]:null;
      const text=appLanguage==="es"||!variants?key:variants[appLanguage==="en"?0:1];
      return text.replace(/\{(\w+)\}/g,(match,name)=>values[name]??match);
    };
    const originalCopy=new WeakMap(), originalAttributes=new WeakMap();
    const localizedAttributes=["aria-label","title","placeholder"];
    function translateInterface(root){
      if(!root)return;
      const attributeSelector=localizedAttributes.map(name=>`[${name}]`).join(",");
      for(const element of [root,...root.querySelectorAll(attributeSelector)]){
        if(element.closest("[data-review-content],[data-detail]"))continue;
        for(const name of localizedAttributes){
          const value=element.getAttribute(name);
          if(!value)continue;
          const attributes=originalAttributes.get(element)||{};
          const previous=attributes[name];
          const original=previous?.rendered===value?previous.original:value;
          const rendered=translate(original);
          if(!previous&&original===rendered&&!Object.hasOwn(interfaceCopy,original))continue;
          attributes[name]={original,rendered};
          originalAttributes.set(element,attributes);
          if(value!==rendered)element.setAttribute(name,rendered);

        const trends=heatmapOnly||scope.country==="UNKNOWN"?[]:fetchTrends(request);
        const chartReady=Promise.resolve(trends).then(rows=>{

          annualTrends=scope.country==="UNKNOWN"?[]:withPublishedRatings(rows,{country:scope.country,platform:"ALL"});

        });
        const [data]=await Promise.all([
          fetchReviewData("review:analytics",{...scope,segment:heatmapSegment,entity:heatmapOnly?defaultAnalyticsEntity:analyticsEntity,language:appLanguage}),
          chartReady
        ]);
        if(token!==analyticsRequest||state.view!=="analytics")return;
        if(!localOnly)renderReviewMatrix(target,data,{...dates,country:scope.country,platform:"ALL",segment:heatmapSegment,audience:scope.audience});

          annualAppControl.refresh();

        if(token!==analyticsRequest||state.view!=="analytics")return;

    function renderReviewBalance(target,data,scope){

      function highlight(event){
        const point=event.target.closest("[data-point],[data-bucket]"), index=point?.dataset.point??point?.dataset.bucket;

      const months=[];

        }
        const file=window.MarketsWorkbook.build(sheets);
        const url=URL.createObjectURL(file), link=document.createElement("a");
        link.href=url;
        const title={benchmark:"Resumen",evolution:"Análisis mensual",analytics:"Análisis anual",reviews:"Comentarios"}[view];
        link.download=`Market Pulse - ${title} - ${country}.xlsx`;
        link.click();
        window.setTimeout(()=>URL.revokeObjectURL(url),1000);
        trackUsage("ACTION",view,"REPORT_DOWNLOAD");
      }catch(error){showError(error)}
      finally{button.disabled=false;button.innerHTML=label}
    }
    function showToast(message,success=false){const toast=$("toast");toast.textContent=message;toast.classList.toggle("success",success);toast.classList.remove("hidden");window.setTimeout(()=>toast.classList.add("hidden"),7000)}
    function showError(error){const message=error?.message||String(error);trackUsage("ERROR",state.view,"CLIENT_ERROR",message);showToast(message,false)}
  })();
</script>
