    const originalCopy=new WeakMap();
    function translateInterface(root){
      if(!root)return;
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      for(let node=walker.nextNode();node;node=walker.nextNode()){
        if(node.parentElement.closest("script,style,textarea,#review-results,[data-detail]"))continue;
        const previous=originalCopy.get(node);
        const original=previous?.rendered===node.data?previous.original:node.data;
        const word=original.trim(), variants=Object.hasOwn(interfaceCopy,word)?interfaceCopy[word]:null;
        if(!variants)continue;
        const rendered=appLanguage==="es"?original:original.replace(word,variants[appLanguage==="en"?0:1]);
        originalCopy.set(node,{original,rendered});
        if(node.data!==rendered)node.data=rendered;
      }

    const compactInteger=value=>{if(!D.finite(value))return"—";const absolute=Math.abs(value);if(absolute<1000)return integer(value);if(absolute<1000000)return`${fmt(value/1000,absolute<10000?1:0)} mil`;return`${fmt(value/1000000,absolute<10000000?1:0)} M`};
    const signed=value=>{if(!D.finite(value))return"—";const normalized=Math.abs(value)<.005?0:value;return`${normalized>0?"+":""}${fmt(normalized,2)}`};

setMarketsAlertPreferences();else if(method==="alerts:test")runner.sendMarketsAlertTestEmail();else finish(reject)(new Error("Operacion no soportada: "+method))})}
    function validateBootstrap(data){if(!data||!data.meta||!Array.isArray(data.snapshot)||!Array.isArray(data.trends))throw new Error("El servidor ha devuelto una respuesta incompleta. Actualiza el despliegue de Market Pulse.");return data}
    async function loadBootstrap(){if(state.bootstrapLoading)return;state.bootstrapLoading=true;const loader=$("loader");loader.classList.remove("done","failed");$("loader-title").textContent="Preparando Market Pulse…";$("loader-detail").classList.add("hidden");$("loader-retry").classList.add("hidden");try{const data=validateBootstrap(await callServer("bootstrap"));state.meta=data.meta;state.userContext=data.userContext||{email:"",isAdmin:false};if(Array.isArray(data.reviewSegments))reviewSegments=Promise.resolve(data.reviewSegments);state.snapshot=data.snapshot;state.trends=data.trends;state.consolidated=data.consolidated||null;state.trendsLoading=false;state.trendCache.set("ALL|ALL|ALL|BBVA|18",state.trends);state.country=browserMarket();restoreUserPreferences();buildControls();configureAdminNavigation();renderRunStatus();renderDashboard();startUsageTracking();if(state.country!=="ALL"||state.platform!=="ALL")scheduleTrends(0);$("footer-version").textContent=`Contrato ${data.meta.codeVersion} · Web ${data.meta.webVersion||"1"}`;loader.classList.add("done")}catch(error){showStartupFailure(error)}finally{state.bootstrapLoading=false}}
    function showStartupFailure(error){const loader=$("loader");if(!loader)return;loader.classList.remove("done");loader.classList.add("failed");$("loader-title").textContent="No hemos podido iniciar Market Pulse";$("loader-detail").textContent=error?.message||String(error);$("loader-detail").classList.remove("hidden");$("loader-retry").classList.remove("hidden")}

    let usageSession="";
    function usageSessionId(){
      if(usageSession)return usageSession;
      const key="markets-usage-session-v1";
      try{
        const saved=sessionStorage.getItem(key);
        if(/^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$/i.test(saved||""))return usageSession=saved;
      }catch(ignored){}
      try{
        const random=window.crypto?.getRandomValues(new Uint8Array(16));
        if(!random)return "";
        usageSession=Array.from(random,byte=>byte.toString(16).padStart(2,"0")).join("");
      }catch(ignored){return ""}
      try{sessionStorage.setItem(key,usageSession)}catch(ignored){}
      return usageSession;
    }
    function usageDevice(){const width=Math.min(window.innerWidth||9999,window.screen?.width||9999);return width<=780?"MOBILE":width<=1180?"TABLET":"DESKTOP"}
    function startUsageTracking(){if(state.usageStarted)return;state.usageStarted=true;trackUsage("SESSION_START",state.view,"APP_OPEN");trackUsage("VIEW",state.view,"OPEN_VIEW")}
    function trackUsage(eventType,view=state.view,action="",detail=""){const sessionId=usageSessionId();if(!sessionId)return;state.usageQueue.push({eventType,view,action,detail:String(detail||"").slice(0,240),sessionId,webVersion:state.meta?.webVersion||"",device:usageDevice()});if(state.usageQueue.length>=12)flushUsage();else{window.clearTimeout(state.usageTimer);state.usageTimer=window.setTimeout(flushUsage,1600)}}
    function flushUsage(){window.clearTimeout(state.usageTimer);if(!state.usageQueue.length||!window.google?.script?.run)return;const batch=state.usageQueue.splice(0,25);google.script.run.withSuccessHandler(result=>{if(result?.deferred)state.usageQueue=batch.concat(state.usageQueue).slice(0,100);if(state.usageQueue.length)state.usageTimer=window.setTimeout(flushUsage,result?.deferred?1200:400)}).withFailureHandler(()=>{state.usageQueue=batch.concat(state.usageQueue).slice(0,100)}).recordMarketsUsageEvents(batch)}

    async function loadAnalytics(localOnly=false){
      const token=++analyticsRequest, target=$("review-heatmap"), segment=$("analytics-segment");
      const entityControl=$("analytics-entity"), balanceControl=$("analytics-balance-entity");
      entityControl.disabled=true;
      if(!localOnly){
        radarFilters.analytics.enable(false);
        renderBalanceEntity=null;
        balanceControl.disabled=true;
        target.innerHTML=U.loading();
        $("review-balance").replaceChildren();
      }
      for(const id of ["review-deltas","review-examples","review-recent"])$(id).replaceChildren();
      $("review-deltas").innerHTML=U.loading();
      try{
        await prepareReviewSegments(segment);
        if(token!==analyticsRequest||state.view!=="analytics")return;
        const scope=analyticsScope();
        radarFilters.analytics.render();
        const data=await callServer("review:analytics",{...scope,entity:analyticsEntity});
        if(token!==analyticsRequest||state.view!=="analytics")return;
        const options=data.entityOptions;
        if(analyticsEntity&&!options.includes(analyticsEntity)){
          analyticsEntity="";
          return loadAnalytics(localOnly);
        }
        if(!options.includes(balanceEntity))balanceEntity="";
        for(const [control,value] of [[entityControl,analyticsEntity],[balanceControl,balanceEntity]]){
          control.innerHTML=U.option("","Todas",!value)+options.map(name=>U.option(name,name,name===value)).join("");
        }
        const applied={...scope,start:data.window.start,end:data.window.end};
        const allStars={...applied,segment:""};
        if(!localOnly){
          renderReviewMatrix(target,data,applied);
          renderBalanceEntity=renderReviewBalance($("review-balance"),data,allStars);
        }
        renderReviewGaps($("review-deltas"),data,{...allStars,app:analyticsEntity});
        const examples=$("review-examples");
        examples.textContent=data.examples.length?"Ejemplos seleccionados por similitud textual dentro de cada bloque.":"Sin ejemplos para este ámbito.";
        for(const {block,review} of data.examples){
          examples.insertAdjacentHTML("beforeend",renderReviewCard(review,data.topics));
          appendReviewCohort(examples,`Abrir reseña · ${data.topics[block]}`,{...allStars,app:analyticsEntity,start:data.window.recent,reviewKey:review.key});
        }
        $("review-recent").replaceChildren();
        appendReviewCohort($("review-recent"),`${integer(data.recentTotal)} reseñas únicas`,{...allStars,app:analyticsEntity,start:data.window.recent});
      }catch(error){
        if(token===analyticsRequest&&state.view==="analytics")$(localOnly?"review-deltas":"review-heatmap").textContent=error.message;
      }finally{
        if(token===analyticsRequest){
          radarFilters.analytics.enable(Boolean(segment.options.length));
          entityControl.disabled=false;
          balanceControl.disabled=false;
        }
      }
    }
    function renderReviewGaps(target,data,scope){

    function renderReviewBalance(target,data,scope){

      $("review-balance-period").textContent=`${dateLabel(scope.start)} – ${dateLabel(scope.end)}`;
      if(!data.monthly.length){target.append("Sin observaciones para este intervalo.");return null}
      const plot=document.createElement("div"), details=document.createElement("div"), tooltip=document.createElement("div");
      plot.className="trend-chart";
      const layout=document.createElement("div"), legend=document.createElement("aside");
      layout.className="map-layout";
      legend.className="geo-list";
      layout.append(plot,legend);
      tooltip.className="chart-tooltip";
      tooltip.hidden=true;
      tooltip.setAttribute("aria-hidden","true");
      function highlight(event){
        const point=event.target.closest("[data-point],[data-bucket]"), index=point?.dataset.point??point?.dataset.bucket;
        const band=index==null?null:plot.querySelector(`[data-bucket="${index}"]`);
        plot.querySelector(".chart-band.is-highlighted")?.classList.remove("is-highlighted");
        tooltip.hidden=!band;
        if(!band)return;

        tooltip.textContent=band.getAttribute("aria-label");
        const panel=target.closest(".trend-panel").getBoundingClientRect(), anchor=point.getBoundingClientRect();
        tooltip.style.left=Math.max(0,Math.min((event.clientX||anchor.x+anchor.width/2)-panel.x+12,panel.width-tooltip.offsetWidth))+"px";
        tooltip.style.top=Math.max(0,Math.min((event.clientY||anchor.y)-panel.y+16,panel.height-tooltip.offsetHeight))+"px";
      }
      for(const event of ["pointerover","pointermove","focusin"])plot.addEventListener(event,highlight);
      for(const event of ["pointerout","focusout"])plot.addEventListener(event,e=>highlight({target:plot.contains(e.relatedTarget)?e.relatedTarget:plot}));
      const months=[];
      const cursor=new Date(scope.start.slice(0,7)+"-01T00:00:00Z");
      while(cursor.toISOString().slice(0,7)<=scope.end.slice(0,7)){
        months.push(cursor.toISOString().slice(0,7));
        cursor.setUTCMonth(cursor.getUTCMonth()+1);
      }
      const points=new Map(), totals=new Map();
      for(const point of data.monthly){
        points.set(JSON.stringify([point.entity,point.month]),point.balance);

      }
      legend.addEventListener("click",event=>{
        const row=event.target.closest("[data-entity]");
        if(!row)return;
        balanceEntity=balanceEntity===row.dataset.entity?"":row.dataset.entity;
        $("analytics-balance-entity").value=balanceEntity;
        render();
        [...legend.querySelectorAll("[data-entity]")].find(button=>button.dataset.entity===row.dataset.entity)?.focus({preventScroll:true});
      });
      function render(){
        const entities=balanceEntity?[balanceEntity]:data.entityOptions;
        tooltip.hidden=true;
        plot.innerHTML=C.reviewBalance(months,entities.map(entity=>({entity,values:months.map(month=>points.get(JSON.stringify([entity,month]))??null)})),
          {fmt,monthLabel,width:plot.clientWidth});
        legend.innerHTML=C.reviewBalanceLegend(data.entityOptions.map(entity=>({entity,total:totals.get(entity)||0})),balanceEntity,integer);
        details.replaceChildren();
        for(const point of data.monthly.filter(item=>entities.includes(item.entity)).sort((a,b)=>a.month.localeCompare(b.month)||a.entity.localeCompare(b.entity))){
          const label=`${point.entity} · ${point.month} · ${fmt(point.balance,1)} pp · ${point.promoters} promotoras / ${point.detractors} detractoras / ${point.total} reseñas`;
          const start=point.month+"-01", next=new Date(start+"T00:00:00Z");
          next.setUTCMonth(next.getUTCMonth()+1);
          const end=reviewDay(next.toISOString().slice(0,10),-1);
          appendReviewCohort(details,label,{...scope,app:point.entity,start:start<scope.start?scope.start:start,end:end>scope.end?scope.end:end});
        }
      }
      const list=document.createElement("details"), caption=document.createElement("summary");
      caption.textContent="Ver denominadores y abrir reseñas";
      list.append(caption,details);
      target.append(layout,tooltip,list);

    }

    function renderReviewMatrix(target,data,scope){
      const totals=new Map();
      for(const group of data.entities)for(const [id,count] of Object.entries(group.counts)){
        totals.set(id,(totals.get(id)||0)+count);
      }
      const ids=[...totals.keys()].sort((a,b)=>totals.get(b)-totals.get(a)||a.localeCompare(b));
      const max=Math.max(1,...data.entities.flatMap(group=>Object.values(group.counts)));
      const summary=`${integer(data.classified)} clasificadas de ${integer(data.total)} reseñas · ${data.window.start} a ${data.window.end}`;
      const leading=ids[0];
      target.innerHTML=`${leading?`<p class="heatmap-focus">Bloque más frecuente · ${U.esc(data.topics[leading])} · ${integer(totals.get(leading))} menciones por entidad</p>`:""}<div data-summary></div><div class="heatmap-controls"><label>Medida <select data-measure class="select-control"><option value="count">N.º de opiniones</option><option value="share">% de opiniones</option></select></label></div>
        <div data-matrix class="heatmap-scroll"></div><div data-pages class="heatmap-pagination"></div>`;
      appendReviewCohort(target.querySelector("[data-summary]"),summary,scope);
      const table=target.querySelector("[data-matrix]"), pages=target.querySelector("[data-pages]"), measure=target.querySelector("[data-measure]");
      let rowPage=0,columnPage=0;
      function render(){
        const rows=data.entities.slice(rowPage*12,rowPage*12+12), columns=ids.slice(columnPage*8,columnPage*8+8);
        table.innerHTML=columns.length?`<table class="review-matrix">
          <thead><tr><th scope="col">Entidad</th>${columns.map(id=>`<th scope="col">${U.esc(data.topics[id])}</th>`).join("")}</tr></thead>
          <tbody>${rows.map((group,index)=>`<tr><th scope="row"><span class="heatmap-identity">${entityLogo(group.label,scope.country,scope.platform)}${U.esc(group.label)}</span><small>${integer(group.total)} reseñas</small></th>${columns.map(id=>{
            const count=group.counts[id]||0, share=Math.round(100*count/group.total);
            const percent=measure.value==="share", shown=percent?`${share} %`:integer(count);
            const heat=Math.ceil(4*count/(percent?group.total:max));
            const label=`${group.label} · ${data.topics[id]} · ${count} reseñas · ${share} %`;
            const content=`<span class="heat-cell-topic">${U.esc(data.topics[id])}</span><span>${shown}</span>`;
            return `<td>${count?`<button class="heat-cell heat-${heat}" type="button" data-cell="${index}|${id}" title="${U.esc(label)}" aria-label="${U.esc(label)}">${content}</button>`:`<span class="heat-cell heat-0">${content}</span>`}</td>`;
          }).join("")}</tr>`).join("")}</tbody></table>`:U.empty("Sin reseñas","No hay opiniones para este ámbito.");
        table.onclick=event=>{
          const cell=event.target.closest("[data-cell]");
          if(!cell)return;
          const [index,id]=cell.dataset.cell.split("|");
          openReviewCohort({...scope,app:rows[index].label,topic:id},cell.getAttribute("aria-label"));
        };
        pages.innerHTML=[["Entidades",rowPage,data.entities.length,12,"row"],["Bloques",columnPage,ids.length,8,"column"]].map(([label,index,total,size,key])=>
          `<span>${label} ${total?index+1:0}/${Math.ceil(total/size)}</span><button type="button" data-page="${key}|-1" aria-label="${label}: anterior" ${index===0?"disabled":""}>‹</button><button type="button" data-page="${key}|1" aria-label="${label}: siguiente" ${(index+1)*size>=total?"disabled":""}>›</button>`).join("");
      }
      pages.onclick=event=>{
        const button=event.target.closest("[data-page]");
        if(!button)return;
        const [key,step]=button.dataset.page.split("|");
        if(key==="row")rowPage+=Number(step);else columnPage+=Number(step);
        render();
      };
      measure.onchange=render;
      render();
    }

      const options=adminScopeOptions(kind).map(item=>kind==="country"&&item.value!=="ALL"?
        {...item,label:countryLabel(item.value)}:item);
      return [{value:"ANY",label:"Sin filtrar"},...options];
    }
    function nextAdminScopeSelection(current,value){if(value==="ANY")return["ANY"];if(value==="ALL")return["ALL"];const selected=new Set((current||[]).filter(item=>item!=="ALL"&&item!=="ANY"));if(selected.has(value))selected.delete(value);else selected.add(value);return selected.size?[...selected]:["ALL"]}
    function adminSubscriberFilterRows(rows){const filters=state.adminSubscriberFilters,query=filters.query.trim().toLowerCase(),scopeMatches=(values,selected)=>{const configured=values||[];if(selected.includes("ANY"))return true;if(selected.includes("ALL"))return configured.includes("ALL");if(configured.includes("ALL"))return false;return selected.some(value=>configured.includes(value))};return rows.filter(row=>(!query||String(row.email||"").toLowerCase().includes(query))&&(filters.status==="ALL"||(row.active?"ACTIVE":"PAUSED")===filters.status)&&scopeMatches(row.countries,filters.countries)&&scopeMatches(row.platforms,filters.platforms))}
    function adminSubscriberScopeText(kind,values){if((values||[]).includes("ALL"))return kind==="country"?"Todos los mercados":"Todas las plataformas";return(values||[]).map(value=>kind==="country"?countryLabel(value):D.config.platformLabels[value]||value).join(", ")}
    function renderAdminSubscribers(rows){const filtered=adminSubscriberFilterRows(rows),result=$("admin-subscriber-results");if(result)result.textContent=`${filtered.length} de ${rows.length} ${rows.length===1?"suscripción":"suscripciones"}`;if(!rows.length){$("admin-subscribers").innerHTML=U.empty("Sin suscripciones","Todavía no hay usuarios dados de alta.");return}if(!filtered.length){$("admin-subscribers").innerHTML=U.empty("Sin coincidencias","Prueba otra combinación o limpia los filtros.");return}$("admin-subscribers").innerHTML=filtered.map(row=>{const rules=[row.active&&row.dailyDropEnabled?"Diaria":"",row.active&&row.mtdDropEnabled?"15→15":"",row.active&&row.ytdDropEnabled?"Anual":"",row.active&&row.crossoverEnabled?"Cruces":"",row.newsletterEnabled?"Newsletter":""].filter(Boolean);return`<article class="admin-list-item"><div><strong>${U.esc(row.email)}</strong><span>${U.esc(adminSubscriberScopeText("country",row.countries))} · ${U.esc(adminSubscriberScopeText("platform",row.platforms))}</span><div class="admin-subscriber-summary">${(rules.length?rules:["Sin comunicaciones activas"]).map(rule=>`<b>${U.esc(rule)}</b>`).join("")}</div></div><div>${statusBadge(row.active?"ACTIVE":"PAUSED")}<time>Newsletter: ${row.newsletterEnabled?"Activa":"Desactivada"}</time><time>Alta: ${U.esc(dateTimeLabel(row.registeredAt))}</time><time>Último acceso: ${U.esc(dateTimeLabel(row.lastSeenAt))}</time><time>Última entrega: ${U.esc(dateTimeLabel(row.lastDeliveryAt))}</time><time>Actualizado: ${U.esc(dateTimeLabel(row.updatedAt||row.lastSeenAt))}</time><div class="admin-subscriber-actions"><button class="alert-button ghost" type="button" data-admin-test-newsletter="${U.esc(row.email)}">Probar newsletter</button><button class="alert-button secondary" type="button" data-admin-edit-subscriber="${U.esc(row.email)}">Editar comunicaciones</button></div></div></article>`}).join("")}
    function adminSubscriberDefault(){return{active:true,newsletterEnabled:true,countries:["ALL"],platforms:["ALL"],reviewShareEnabled:false,reviewWarningPct:15,reviewCriticalPct:30,dailyDropEnabled:true,dailyWarningDrop:.1,dailyCriticalDrop:.15,mtdDropEnabled:true,mtdWarningDrop:.3,mtdCriticalDrop:.5,ytdDropEnabled:true,ytdWarningDrop:.3,ytdCriticalDrop:.5,repeatWhileBreached:false,crossoverEnabled:true,crossoverDirection:"BOTH",deliveryMode:"DAILY_DIGEST"}}
    function adminScopeOptions(kind){return kind==="country"?[{value:"ALL",label:"Todos",meta:`${Object.keys(D.config.countries).length} mercados`},...Object.keys(D.config.countries).map(value=>({value,label:D.config.countries[value]}))]:[{value:"ALL",label:"Todas",meta:`${D.config.platforms.length} plataformas`},...D.config.platforms.map(value=>({value,label:value}))]}
    function normalizeAdminScope(kind,values){const allowed=new Set(adminScopeOptions(kind).map(item=>item.value)),clean=[...new Set((values||[]).filter(value=>allowed.has(value)))];return !clean.length||clean.includes("ALL")?["ALL"]:clean}
    function adminScopeSelection(kind){return[...$(`admin-${kind}-pills`).querySelectorAll("[data-admin-scope-value][aria-pressed=true]")].map(button=>button.dataset.adminScopeValue)}
    function adminScopeSummary(kind,values){if(values.includes("ALL"))return kind==="country"?"Todos los mercados":"Todas las plataformas";const labels=values.map(value=>kind==="country"?D.config.countries[value]||value:value);return `${values.length} ${kind==="country"?(values.length===1?"mercado":"mercados"):(values.length===1?"plataforma":"plataformas")} · ${labels.join(", ")}`}
    function renderAdminScope(kind,values){const selected=normalizeAdminScope(kind,values),container=$(`admin-${kind}-pills`);container.innerHTML=adminScopeOptions(kind).map(item=>`<button class="admin-scope-pill${item.value==="ALL"?" all":""}" type="button" data-admin-scope-kind="${kind}" data-admin-scope-value="${U.esc(item.value)}" aria-pressed="${selected.includes(item.value)}"><i aria-hidden="true"></i><span>${kind==="country"?geographyFlag(item.value):""}${U.esc(item.label)}</span>${item.meta?`<small>${U.esc(item.meta)}</small>`:""}</button>`).join("");$(`admin-${kind}-scope-summary`).textContent=adminScopeSummary(kind,selected)}
    function handleAdminScopeClick(event){const button=event.target.closest("[data-admin-scope-kind][data-admin-scope-value]");if(!button)return;renderAdminScope(button.dataset.adminScopeKind,nextAdminScopeSelection(adminScopeSelection(button.dataset.adminScopeKind),button.dataset.adminScopeValue))}
    function openAdminSubscriber(email=""){const row=(state.adminCenter?.subscribers||[]).find(item=>item.email===email),draft=Object.assign(adminSubscriberDefault(),row||{});state.adminEditingEmail=row?.email||"";$("admin-subscriber-title").textContent=row?`Editar ${row.email}`:"Dar de alta usuario";$("admin-subscriber-email").value=row?.email||"";$("admin-subscriber-email").disabled=Boolean(row);$("admin-newsletter-language").value=row?.newsletterLanguage||appLanguage;$("admin-subscriber-active").checked=Boolean(draft.active);$("admin-newsletter-enabled").checked=Boolean(draft.newsletterEnabled);renderAdminScope("country",draft.countries);renderAdminScope("platform",draft.platforms);[["daily",draft.dailyDropEnabled,draft.dailyWarningDrop,draft.dailyCriticalDrop],["mtd",draft.mtdDropEnabled,draft.mtdWarningDrop,draft.mtdCriticalDrop],["ytd",draft.ytdDropEnabled,draft.ytdWarningDrop,draft.ytdCriticalDrop]].forEach(item=>{$(`admin-${item[0]}-enabled`).checked=Boolean(item[1]);$(`admin-${item[0]}-warning`).value=item[2];$(`admin-${item[0]}-critical`).value=item[3]});$("admin-crossover-enabled").checked=Boolean(draft.crossoverEnabled);$("admin-crossover-direction").value=draft.crossoverDirection||"BOTH";$("admin-repeat-enabled").checked=Boolean(draft.repeatWhileBreached);$("admin-subscriber-error").classList.add("hidden");$("admin-subscriber-dialog").showModal()}
    function closeAdminSubscriber(){$("admin-subscriber-dialog").close();state.adminEditingEmail=""}
    function adminSubscriberPayload(){const existing=(state.adminCenter?.subscribers||[]).find(item=>item.email===state.adminEditingEmail)||adminSubscriberDefault(),payload=Object.assign({},existing,{newsletterLanguage:$("admin-newsletter-language").value,active:$("admin-subscriber-active").checked,newsletterEnabled:$("admin-newsletter-enabled").checked,countries:normalizeAdminScope("country",adminScopeSelection("country")),platforms:normalizeAdminScope("platform",adminScopeSelection("platform")),dailyDropEnabled:$("admin-daily-enabled").checked,dailyWarningDrop:Number($("admin-daily-warning").value),dailyCriticalDrop:Number($("admin-daily-critical").value),mtdDropEnabled:$("admin-mtd-enabled").checked,mtdWarningDrop:Number($("admin-mtd-warning").value),mtdCriticalDrop:Number($("admin-mtd-critical").value),ytdDropEnabled:$("admin-ytd-enabled").checked,ytdWarningDrop:Number($("admin-ytd-warning").value),ytdCriticalDrop:Number($("admin-ytd-critical").value),repeatWhileBreached:$("admin-repeat-enabled").checked,crossoverEnabled:$("admin-crossover-enabled").checked,crossoverDirection:$("admin-crossover-direction").value});return{email:state.adminEditingEmail||$("admin-subscriber-email").value.trim().toLowerCase(),preferences:payload}}
    async function saveAdminSubscriber(event){event.preventDefault();const button=$("admin-subscriber-save"),errorPanel=$("admin-subscriber-error"),previous=button.textContent;button.disabled=true;button.textContent="Guardando…";errorPanel.classList.add("hidden");try{const saved=await callServer("admin:subscriber:save",adminSubscriberPayload());const rows=state.adminCenter.subscribers||[],index=rows.findIndex(row=>row.email===saved.email);if(index<0)rows.push(saved);else rows[index]=saved;trackUsage("ACTION","admin","SUBSCRIBER_SAVE");closeAdminSubscriber();await loadAdmin(true);showToast(`${saved.email}: alertas ${saved.active?"activas":"pausadas"} y newsletter ${saved.newsletterEnabled?"activa":"desactivada"}.${saved.enrollmentYtdAcknowledged?` ${saved.enrollmentYtdAcknowledged} señales YTD previas reconocidas sin envío.`:""}`,true)}catch(error){trackUsage("ERROR","admin","SUBSCRIBER_ERROR",error?.message||error);errorPanel.textContent=error?.message||String(error);errorPanel.classList.remove("hidden")}finally{button.disabled=false;button.textContent=previous}}
    async function requestAdminRatingRecovery(){if(!window.confirm("Se recuperarán ahora todos los ratings y se registrará una nueva ejecución. ¿Continuar?"))return;const button=$("admin-recovery"),previous=button.textContent;button.disabled=true;button.textContent="Recuperando ratings…";try{const result=await callServer("admin:ratings:recover");trackUsage("ACTION","admin","RATING_RECOVERY");await loadAdmin(true);showToast(`Recuperación ${result.runId} completada: ${result.rowsUpserted} filas actualizadas.`,true)}catch(error){showError(error)}finally{button.disabled=false;button.textContent=previous}}
    function adminNewsletterRequestId(button){if(button.dataset.newsletterRequestId)return button.dataset.newsletterRequestId;const token=window.crypto?.randomUUID?window.crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;return button.dataset.newsletterRequestId=`NEWS-REQ-${token}`}
    async function testAdminNewsletter(email,button){const previous=button.textContent,requestId=adminNewsletterRequestId(button);button.disabled=true;button.textContent="Preparando…";try{const result=await callServer("admin:newsletter:test",{targetEmail:email,requestId});delete button.dataset.newsletterRequestId;trackUsage("ACTION","admin","NEWSLETTER_TEST",email);showToast(result.alreadyAccepted?`La prueba ${result.deliveryId} ya había sido aceptada; no se ha duplicado.`:`Vista previa de ${email} enviada a ${result.recipient}.`,true)}catch(error){showError(error)}finally{button.disabled=false;button.textContent=previous}}
    function renderAdminAlerts(rows){if(!rows.length){$("admin-alerts").innerHTML=U.empty("Sin eventos recientes","ALERT_LOG todavía no contiene señales.");return}$("admin-alerts").innerHTML=`<table class="admin-table"><thead><tr><th>Fecha</th><th>Señal</th><th>Ámbito</th><th>Destinatario</th><th>Detalle</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${U.esc(dateTimeLabel(row.timestamp))}</td><td>${statusBadge(row.severity)}<small>${U.esc(row.type)}</small></td><td>${U.esc(`${row.countryCode} · ${row.platform}`)}</td><td>${U.esc(row.userEmail)}</td><td>${U.esc(row.detail)}</td></tr>`).join("")}</tbody></table>`}

    function showChartTooltip(point,event){const tooltip=$("chart-tooltip");tooltip.innerHTML=`<strong>${U.esc(point.dataset.label)}</strong>${U.esc(point.dataset.month)} · ${U.esc(point.dataset.value)} rating${state.country==="ALL"?" · BBVA Empresas":""}`;tooltip.classList.remove("hidden");positionTooltip(event.clientX,event.clientY)}
    function positionTooltip(x,y){const tooltip=$("chart-tooltip"),left=Math.min(window.innerWidth-tooltip.offsetWidth-12,x+13),top=Math.max(10,y-tooltip.offsetHeight-14);tooltip.style.left=`${left}px`;tooltip.style.top=`${top}px`}
    function hideChartTooltip(){$("chart-tooltip").classList.add("hidden")}
    async function downloadReport(){const button=$("report-button"),label=button.innerHTML;button.disabled=true;button.innerHTML="<span>Preparando informe…</span>";try{const viewLabels={overview:"Resumen",benchmark:"Benchmark",evolution:"Evolución"};if(!viewLabels[state.view])throw new Error("La vista actual no admite descarga de informe.");if(state.trendPromise)await state.trendPromise;if(document.fonts?.ready)await document.fonts.ready;const request=trendRequest(),key=trendKey(request);let reportTrends=state.trendCache.get(key);if(!reportTrends){reportTrends=await callServer("trends",request);state.trendCache.set(key,reportTrends||[])}const viewLabel=viewLabels[state.view],scopeLabel=`${state.country==="ALL"?"Todos los mercados":countryLabel(state.country)} · ${D.config.platformLabels[state.platform]}`;MarketsReport.render({target:$("print-report"),meta:state.meta,snapshot:state.snapshot,trends:reportTrends||[],benchmarkSegment:state.benchmarkSegment,benchmarkWeighted:state.benchmarkWeighted,view:state.view,selection:{...selection(),app:state.view==="evolution"?state.evolutionApp:""},periodYear:state.periodYear,periodMonth:state.periodMonth,generatedAt:new Date()});trackUsage("ACTION",state.view,"REPORT_DOWNLOAD");document.title=`Market Pulse · ${viewLabel} · ${scopeLabel} · ${state.meta.dataDate}`;window.print()}catch(error){showError(error)}finally{button.disabled=false;button.innerHTML=label}}
    function renderPrintContext(){$("print-context").textContent=`${overviewContext()} · Benchmark: ${activeBenchmark()} · Gráficas: ${trendScope()} · Evolución: ${state.periodYear&&state.periodMonth?monthLabel(`${state.periodYear}-${state.periodMonth}`):"último cierre"} · ${dateLabel(state.meta?.dataDate)} · generado ${dateTimeLabel(new Date().toISOString())}`}
    function showToast(message,success=false){const toast=$("toast");toast.textContent=message;toast.classList.toggle("success",success);toast.classList.remove("hidden");window.setTimeout(()=>toast.classList.add("hidden"),7000)}
    function showError(error){const message=error?.message||String(error);trackUsage("ERROR",state.view,"CLIENT_ERROR",message);showToast(message,false)}
  })();
</script>
