<!doctype html>
<html lang="es">
<head>
  <base target="_top"><meta charset="utf-8">
  <?!= includeMarketsWebPartial_('BrandAssets'); ?>
  <?!= includeMarketsWebPartial_('DesignSystem'); ?>
  <style>
    body{min-height:100vh;background:var(--color-primary-bg-surface)}
    .feedback-brand{background:var(--color-primary-bg-action);color:var(--color-primary-text-on-main);padding:var(--space-2) var(--space-3);font:700 var(--text-l)/var(--line-l) var(--font-body)}
    #feedback-dialog{width:min(40rem,calc(100% - var(--space-4)));padding:var(--space-3);border:var(--stroke) solid var(--color-primary-border);border-radius:var(--radius-component);color:var(--color-primary-text-main);background:var(--color-primary-bg-alternative)}
    #feedback-dialog::backdrop{background:color-mix(in srgb,var(--color-primary-bg-action) 18%,transparent)}
    #edition-feedback{display:grid;gap:var(--space-2);margin-top:var(--space-2)}
    .edition-rating{display:flex;flex-wrap:wrap;gap:var(--space-2);border:0;padding:0;margin:0}
    .edition-rating label{display:flex;align-items:center;gap:var(--space-1);padding:var(--space-1);border:var(--stroke) solid var(--color-primary-border);border-radius:var(--radius-component);cursor:pointer}
    .edition-rating img{display:block;width:var(--icon-size);height:var(--icon-size)}
    .edition-rating legend{font-size:var(--text-s);margin-bottom:var(--space-1)}
    #edition-feedback textarea{display:block;width:100%;resize:vertical;padding:var(--space-1);font:inherit;border:var(--stroke) solid var(--color-primary-border);border-radius:var(--radius-component)}
    #edition-feedback [role=status]:empty{display:none}
  </style>
</head>
<body>
  <header class="feedback-brand">BBVA · EDC Market Pulse</header>
  <dialog id="feedback-dialog" aria-labelledby="feedback-title">
    <div class="dialog-head">
      <h1 id="feedback-title"><?= rating ? 'Valorar esta edición (opcional)' : newsletter ? 'Newsletter de EDC Market Pulse' : 'Valorar alerta de EDC Market Pulse' ?></h1>
      <button class="dialog-close" id="feedback-close" type="button" aria-label="Cerrar"></button>
    </div>
    <form id="edition-feedback" data-token="<?= token ?>" data-newsletter="<?= newsletter ? 'yes' : 'no' ?>">
      <? if (rating) { const thumbs = marketsEmailFooterImages_(includeMarketsWebPartial_('BrandIdentity')); ?>
        <fieldset class="edition-rating"><legend>Valoración</legend>
          <label><input type="radio" name="rating" value="positive" <? if (rating === 'positive') { ?>checked<? } ?> required><img src="data:image/png;base64,<?!= thumbs.feedbackPositive || '' ?>" alt="Útil"></label>
          <label><input type="radio" name="rating" value="negative" <? if (rating === 'negative') { ?>checked<? } ?> required><img src="data:image/png;base64,<?!= thumbs.feedbackNegative || '' ?>" alt="Mejorable"></label>
        </fieldset>
        <label>Observaciones (opcional)<textarea name="observation" rows="4" maxlength="1000"></textarea></label>
      <? } else { ?>
        <p><?= unsubscribe ? 'Confirma la baja desde la cuenta corporativa que recibió el correo.' : 'Confirma la acción desde la cuenta corporativa que recibió el correo.' ?></p>
      <? } ?>
      <button type="submit" id="vote" class="alert-button primary"><?= rating ? 'Enviar' : choice ?></button>
      <p id="status" role="status"></p>
      <? if (destination) { ?><a id="destination" href="<?= destination ?>" hidden>Abrir EDC Market Pulse</a><? } ?>
    </form>
  </dialog>
  <script>
    const dialog = document.getElementById("feedback-dialog");
    const form = document.getElementById("edition-feedback");
    const vote = document.getElementById("vote");
    const status = document.getElementById("status");
    document.getElementById("feedback-close").onclick = () => dialog.close();
    dialog.showModal();
    form.onsubmit = event => {
      event.preventDefault();
      vote.disabled = true;
      status.textContent = "Guardando…";
      const runner = google.script.run.withSuccessHandler(result => {
        status.textContent = result?.preview ? "Enlace de prueba verificado." : result?.unsubscribed ? "Suscripción desactivada." : result?.open ? "Acceso registrado." : "Valoración registrada.";
        if (result?.open) document.getElementById("destination").hidden = false;
      }).withFailureHandler(error => {
        status.textContent = error.message;
        vote.disabled = false;
      });
      if (form.dataset.newsletter === "yes") {
        const values = new FormData(form);
        runner.saveMarketsNewsletterInteraction(form.dataset.token, values.get("rating") || "", values.get("observation") || "");
      } else runner.saveMarketsAlertFeedback(form.dataset.token, form.elements.rating?.value, form.elements.observation?.value);
    };
  </script>
</body>
</html>
