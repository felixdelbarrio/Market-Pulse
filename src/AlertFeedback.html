<!doctype html>
<html lang="es">
<head><base target="_top"><meta charset="utf-8"></head>
<body>
  <main>
    <h1>¿Te ha resultado útil la alerta?</h1>
    <p>Confirma la valoración desde la cuenta corporativa que recibió el correo.</p>
    <button type="button" id="vote" data-token="<?= token ?>"><?= choice ?></button>
    <p id="status" role="status"></p>
  </main>
  <script>
    const vote = document.getElementById("vote");
    const status = document.getElementById("status");
    vote.onclick = () => {
      vote.disabled = true;
      status.textContent = "Guardando valoración…";
      google.script.run.withSuccessHandler(() => {
        status.textContent = "Valoración registrada.";
      }).withFailureHandler(error => {
        status.textContent = error.message;
        vote.disabled = false;
      }).saveMarketsAlertFeedback(vote.dataset.token);
    };
  </script>
</body>
</html>
