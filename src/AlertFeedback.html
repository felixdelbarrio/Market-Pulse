<!doctype html>
<html lang="es">
<head><base target="_top"><meta charset="utf-8"></head>
<body>
  <main>
    <h1><?= newsletter ? "Newsletter de Market Pulse" : "¿Te ha resultado útil la alerta?" ?></h1>
    <p>Confirma la valoración desde la cuenta corporativa que recibió el correo.</p>
    <button type="button" id="vote" data-token="<?= token ?>" data-newsletter="<?= newsletter ? "yes" : "no" ?>"><?= choice ?></button>
    <p id="status" role="status"></p>
    <a id="destination" href="<?= destination ?>" hidden>Abrir Market Pulse</a>
  </main>
  <script>
    const vote = document.getElementById("vote");
    const status = document.getElementById("status");
    vote.onclick = () => {
      vote.disabled = true;
      status.textContent = "Guardando valoración…";
      const runner = google.script.run.withSuccessHandler(result => {
        status.textContent = result?.open ? "Acceso registrado." : "Valoración registrada.";
        if (result?.open) document.getElementById("destination").hidden = false;
      }).withFailureHandler(error => {
        status.textContent = error.message;
        vote.disabled = false;
      });
      if (vote.dataset.newsletter === "yes") runner.saveMarketsNewsletterInteraction(vote.dataset.token);
      else runner.saveMarketsAlertFeedback(vote.dataset.token);
    };
  </script>
</body>
</html>
