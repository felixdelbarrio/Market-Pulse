<script>
  (()=>{
    "use strict";
    function lineChart(series,options){
      const ui=window.MarketsUI,theme=window.MarketsTheme.chart,finite=window.MarketsDomain.finite;
      const visible=(series||[]).slice(0,12).map(item=>({...item,points:(item.points||[]).filter(point=>!options.period||point.month<=options.period)})).filter(item=>item.points.length);
      if(!visible.length)return{svg:ui.empty("Sin datos para esta selección","No existen observaciones con los filtros y el periodo elegidos."),series:[]};
      const months=options.months||[...new Set(visible.flatMap(item=>item.points.map(point=>point.month)))].sort();
      const monthIndex=new Map(months.map((month,index)=>[month,index]));
      const values=visible.flatMap(item=>item.points.map(point=>point.value)).filter(finite);
      let min=Math.max(1,Math.floor((Math.min(...values)-.12)*10)/10),max=Math.min(5,Math.ceil((Math.max(...values)+.12)*10)/10);if(max-min<.4){min=Math.max(1,min-.2);max=Math.min(5,max+.2)}
      const width=theme.width,height=theme.height,left=theme.left,right=theme.right,top=theme.top,bottom=theme.bottom,plotW=width-left-right,plotH=height-top-bottom;
      const x=month=>left+(months.length===1?plotW/2:monthIndex.get(month)/(months.length-1)*plotW);const y=value=>top+(max-value)/(max-min)*plotH;
      const ticks=Array.from({length:5},(_,index)=>min+(max-min)*index/4);const step=Math.max(1,Math.ceil(months.length/8));
      const grid=ticks.map(value=>`<g><line x1="${left}" y1="${y(value)}" x2="${width-right}" y2="${y(value)}" stroke="${theme.grid}"/><text x="${left-12}" y="${y(value)+4}" text-anchor="end" fill="${theme.axis}" font-size="${theme.fontSize}">${options.format(value,1)}</text></g>`).join("");
      const labels=months.map((month,index)=>index%step===0||index===months.length-1?`<text x="${x(month)}" y="${height-16}" text-anchor="middle" fill="${theme.axis}" font-size="${theme.fontSize}">${ui.esc(options.monthLabel(month))}</text>`:"").join("");
      const lines=visible.map((item,index)=>{const color=theme.palette[index%theme.palette.length];const points=item.points.filter(point=>finite(point.value)).sort((a,b)=>a.month.localeCompare(b.month));const path=points.map((point,position)=>`${position?"L":"M"}${x(point.month).toFixed(1)},${y(point.value).toFixed(1)}`).join(" ");const circles=points.map(point=>`<circle class="chart-point" tabindex="0" cx="${x(point.month)}" cy="${y(point.value)}" r="${theme.pointRadius}" fill="${color}" stroke="${theme.surface}" stroke-width="${theme.pointStroke}" data-label="${ui.esc(item.label)}" data-month="${ui.esc(options.monthLabel(point.month))}" data-value="${options.format(point.value,2)}"></circle>`).join("");return`<path d="${path}" fill="none" stroke="${color}" stroke-width="${item.isBbva?theme.focusLineWidth:theme.lineWidth}" stroke-linejoin="round" stroke-linecap="round" opacity="${item.isBbva?1:.82}"/>${circles}`}).join("");
      const scope=options.context,idPrefix=options.idPrefix||"markets";
      const svg=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="${idPrefix}-chart-title ${idPrefix}-chart-desc"><title id="${idPrefix}-chart-title">Evolución mensual de ratings</title><desc id="${idPrefix}-chart-desc">${ui.esc(scope)}. Periodo hasta ${ui.esc(options.monthLabel(months.at(-1)))}</desc>${grid}<line x1="${left}" y1="${top}" x2="${left}" y2="${height-bottom}" stroke="${theme.axis}"/>${labels}${lines}</svg>`;
      return{svg,series:visible};
    }
    function ratingBars(groups,options){
      const ui=window.MarketsUI,finite=window.MarketsDomain.finite;
      const boards=(groups||[]).map(group=>`<section class="rating-board"><header><strong>${ui.esc(group.platform)}</strong><span>${group.rows.length} ${group.rows.length===1?"referencia":"referencias"}</span></header><ol>${group.rows.map(row=>{const value=finite(row.rating)?row.rating:0;return`<li><span class="rating-bar-label" title="${ui.esc(options.label(row))}">${ui.esc(options.label(row))}</span><span class="rating-bar-metric"><span class="rating-bar-track"><i style="width:${Math.max(0,Math.min(100,value/5*100))}%"></i></span><b aria-label="Rating ${ui.esc(options.format(value,1))} sobre 5">${ui.esc(options.format(value,1))}</b></span></li>`}).join("")}</ol></section>`).join("");
      return boards?`<div class="rating-comparison-grid">${boards}</div>`:ui.empty("Sin ratings comparables","Prueba otro mercado o plataforma.");
    }
    function monthlyMatrix(model,options){
      const ui=window.MarketsUI,finite=window.MarketsDomain.finite;
      if(!model?.periods?.length||!model?.rows?.length)return ui.empty("Sin cierres mensuales","Aún no hay histórico suficiente para esta selección.");
      const header=model.periods.map((month,index)=>`<th scope="col" class="${index===model.periods.length-1?"latest":""}"><span>${ui.esc(options.monthLabel(month))}</span>${index===model.periods.length-1?'<small><i></i>Actual</small>':""}</th>`).join("");
      const body=model.rows.map(row=>`${options.showScopes?`<tr class="monthly-scope"><th scope="rowgroup" colspan="${model.periods.length}">${ui.esc(row.country)}</th></tr>`:""}<tr>${row.cells.map((cell,index)=>{const hasDelta=finite(cell.delta)&&Math.abs(cell.delta)>=.005,tone=cell.delta>0?"delta-up":"delta-down";const reviews=cell.platforms.map(item=>{const detail=item.unavailable?"N/D: Google Play no permite desagregar esta ficha por geografía.":`${options.integer(item.value)} opiniones`;return`<span class="monthly-review${item.unavailable?" unavailable":""}" title="${ui.esc(detail)}"><span>${ui.esc(item.platform)}</span><b>${item.unavailable?"N/D":options.compactInteger(item.value)}</b></span>`}).join("");return`<td class="${index===row.cells.length-1?"latest":""}"><div class="monthly-rating"><strong>${options.format(cell.rating,2)}</strong>${hasDelta?`<em class="${tone}">${ui.esc(options.signed(cell.delta))}</em>`:""}</div><div class="monthly-reviews">${reviews}</div></td>`}).join("")}</tr>`).join("");
      return`<div class="monthly-matrix-scroll"><table class="monthly-matrix"><caption>Evolución mensual del rating y volumen de opiniones de BBVA Empresas</caption><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table></div>`;
    }
    function newReviewImpact(model,options){
      const ui=window.MarketsUI,finite=window.MarketsDomain.finite,summary=model?.summary||{};
      if(!model?.previousPeriod||!model?.rows?.length)return ui.empty("Aún no hay base mensual","Se necesitan dos cierres consecutivos con rating y volumen acumulado.");
      const status=impact=>!finite(impact)?{label:"Sin estimación",tone:"neutral"}:impact>.005?{label:"Impulsa el rating",tone:"positive"}:impact<-.005?{label:"Presiona el rating",tone:"negative"}:{label:"Mantiene el nivel",tone:"neutral"};
      const reason=row=>row.reasons.includes("SHARED_LISTING")?"Ficha Android compartida: no admite atribución a este mercado":row.reasons.includes("SHARED_CONFLICT")?"La ficha compartida no presenta cierres consistentes":row.reasons.includes("ROUNDING")?"El redondeo del rating acumulado impide una estimación fiable":row.reasons.includes("NO_NEW_REVIEWS")?"Sin nuevas opiniones en el mes":"Falta uno de los dos cierres comparables";
      const platformModels=summary.platforms||[],validPlatforms=platformModels.filter(item=>finite(item.rating)),unavailablePlatforms=platformModels.filter(item=>!finite(item.rating));
      const platformCards=validPlatforms.map(item=>{const signal=status(item.impact);return`<article class="new-review-platform-card ${signal.tone}"><header><strong>${ui.esc(item.platform)}</strong><span>${item.availableSeries}/${item.totalSeries} fichas</span></header><div><strong>${options.format(item.rating,2)}<small> / 5</small></strong><b class="${signal.tone}">${ui.esc(signal.label)} · ${ui.esc(options.signed(item.impact))}</b></div><p>${options.integer(item.newReviews)} opiniones utilizables · cálculo exclusivo de ${ui.esc(item.platform)}</p></article>`}).join("");
      const unavailableNote=unavailablePlatforms.length?`<div class="new-review-unavailable"><strong>Sin estimación agregada:</strong><span>${unavailablePlatforms.map(item=>`${ui.esc(item.platform)} (${item.availableSeries}/${item.totalSeries} fichas calculables)`).join(" · ")}</span></div>`:"";
      const rows=model.rows.map(row=>{const signal=status(row.impact),scope=row.scopeLabel||row.country;return`<tr><th scope="row"><strong>${ui.esc(row.platform)}</strong>${options.showScopes?`<small>${ui.esc(scope)}</small>`:""}<small>${row.volumeScope==="SHARED_LISTING"?"Una única ficha multipaís":"Ficha independiente"}</small></th><td><strong>${finite(row.rating)?options.format(row.rating,2):"N/D"}</strong>${finite(row.rating)?" / 5":""}<small>${finite(row.rating)?`Estimación ${row.confidence==="HIGH"?"estable":row.confidence==="MEDIUM"?"orientativa":"sensible al redondeo"}`:ui.esc(reason(row))}</small></td><td><strong>${finite(row.newReviews)?options.integer(row.newReviews):"N/D"}</strong><small>opiniones nuevas de esta ficha</small></td><td><strong class="${signal.tone}">${ui.esc(options.signed(row.impact))}</strong><small>vs. rating previo de la misma ficha</small></td><td><span class="new-review-status ${signal.tone}">${ui.esc(signal.label)}</span></td></tr>`}).join("");
      const coverage=summary.totalSeries?summary.availableSeries/summary.totalSeries:null;
      return`<div class="new-review-overview"><div class="new-review-platform-grid">${platformCards||'<article class="new-review-platform-card neutral"><header><strong>Sin estimaciones publicables</strong></header><p>El detalle inferior explica qué impide calcular cada ficha.</p></article>'}</div><div class="new-review-mini"><article><span>Cobertura</span><strong>${options.integer(summary.availableSeries)}/${options.integer(summary.totalSeries)}</strong><small>${finite(coverage)?options.format(coverage*100,0)+"% de fichas únicas":"Sin base"}</small></article><article><span>Balance</span><strong>${options.integer(summary.improvingSeries)} / ${options.integer(summary.pressuringSeries)}</strong><small>impulsan / presionan</small></article><article><span>Estables</span><strong>${options.integer(summary.stableSeries)}</strong><small>sin diferencia relevante</small></article></div></div>${unavailableNote}<div class="new-review-table-scroll"><table class="new-review-table"><caption>Rating estimado de las opiniones nuevas por ficha y plataforma</caption><thead><tr><th>Plataforma</th><th>Nota del mes</th><th>Volumen</th><th>Efecto</th><th>Lectura</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    // Geometry, interaction targets and classes from News Radar's trend-chart.js.
    function reviewBalance(months,series,options){
      const {esc}=window.MarketsUI, {monthLabel,fmt,width:availableWidth}=options;
      const width=Math.max(320,Math.min(900,availableWidth||900)), height=260, left=42,right=20,top=24,bottom=42;
      const x=i=>left+(months.length===1?.5:i/(months.length-1))*(width-left-right);
      const y=value=>top+(100-value)/200*(height-top-bottom);
      const ticks=[-100,-50,0,50,100].map(value=>`<line x1="${left}" x2="${width-right}" y1="${y(value)}" y2="${y(value)}" class="chart-grid"/><text x="${left-12}" y="${y(value)+4}" text-anchor="end">${value}</text>`).join("");
      const labels=[...new Set([0,Math.floor((months.length-1)/2),months.length-1])].map(i=>
        `<text x="${x(i)}" y="${height-12}" text-anchor="${i===0?"start":i===months.length-1?"end":"middle"}">${esc(monthLabel(months[i]))}</text>`).join("");
      const lines=series.map(({entity,values})=>{
        let segment=null;
        const points=[], paths=[];
        values.forEach((value,i)=>{
          if(value===null){segment=null;return}
          const px=x(i), py=y(value);
          if(!segment){segment=[];paths.push(segment)}
          segment.push([px,py]);
          points.push(`<circle class="chart-point" data-point="${i}" cx="${px}" cy="${py}" r="4" fill="${reviewSeriesColor(entity)}"/>`);
        });
        const path=group=>group.map(([px,py],i)=>`${i?"L":"M"}${px.toFixed(1)},${py.toFixed(1)}`).join(" ");
        const areas=series.length===1?paths.filter(group=>group.length>1).map(group=>
          `<path class="chart-area" d="${path(group)} L${group.at(-1)[0]},${y(0)} L${group[0][0]},${y(0)} Z"/>`).join(""):"";
        return `<g>${areas}<path d="${paths.map(path).join(" ")}" stroke="${reviewSeriesColor(entity)}" class="chart-line"/>${points.join("")}</g>`;
      }).join("");
      const bands=months.map((month,i)=>{
        const start=i?(x(i-1)+x(i))/2:left, end=i<months.length-1?(x(i)+x(i+1))/2:width-right;
        const observations=series.filter(row=>row.values[i]!==null).map(row=>`${row.entity}: ${fmt(row.values[i],1)} pp`);
        const label=`${monthLabel(month)} · ${observations.join(" · ")||"Sin datos"}`;
        return `<rect class="chart-band" data-bucket="${i}" tabindex="0" aria-label="${esc(label)}" x="${start}" y="${top}" width="${end-start}" height="${height-top-bottom}"/>`;
      }).join("");
      return `<svg viewBox="0 0 ${width} ${height}" role="group" aria-label="Saldo mensual por entidad, de menos cien a cien puntos porcentuales">${ticks}${labels}${bands}${lines}</svg>`;
    }
    function reviewSeriesColor(entity){
      let hash=0;
      for(const char of entity)hash=(Math.imul(31,hash)+char.codePointAt(0))>>>0;
      return `var(--chart-series-${entity==="BBVA Empresas"?1:2+hash%5})`;
    }
    function reviewBalanceLegend(rows,integer){
      const {esc}=window.MarketsUI, max=Math.max(1,...rows.map(row=>row.total));
      return `<p class="eyebrow">ENTIDADES DE SEGUIMIENTO</p><div class="geo-entities">${rows.map(({entity,total})=>
        `<div class="geo-row"><span class="identity-label"><i aria-hidden="true" style="background:${reviewSeriesColor(entity)}"></i>${esc(entity)}</span><span class="geo-count">${integer(total)}</span><span class="geo-track" aria-hidden="true"><span style="width:${100*total/max}%;background:${reviewSeriesColor(entity)}"></span></span></div>`
      ).join("")}</div>`;
    }
    function reviewGaps(rows,fmt,translate){
      if(!rows.some(row=>row.gap!==null))return "";
      const {esc}=window.MarketsUI, width=960,left=260,right=20,top=16,step=28,height=top+step*rows.length+55;
      const min=Math.min(0,...rows.map(row=>row.gap)), max=Math.max(0,...rows.map(row=>row.gap));
      const interval=[5,10,20,40,50,100].find(value=>value>=Math.max(5,(max-min)/8))||100;
      const low=Math.min(-interval,Math.floor(min/interval)*interval), high=Math.max(interval,Math.ceil(max/interval)*interval);
      const x=value=>left+(value-low)/(high-low)*(width-left-right), zero=x(0), bottom=top+step*rows.length;
      const grid=Array.from({length:1+Math.round((high-low)/interval)},(_,i)=>{
        const value=low+i*interval, px=x(value);
        return `<path class="${value===0?"gap-zero":"gap-grid"}" d="M${px} ${top}V${bottom}"/><text x="${px}" y="${bottom+20}" text-anchor="middle">${value}</text>`;
      }).join("");
      const bars=rows.map((row,i)=>{
        const y=top+i*step, end=x(row.gap);
        return `<path class="gap-grid" d="M${left} ${y+step/2}H${width-right}"/><text x="${left-8}" y="${y+step/2+4}" text-anchor="end">${esc(row.label)}</text><rect class="${row.gap<0?"gap-negative":"gap-positive"}" x="${Math.min(zero,end)}" y="${y+4}" width="${Math.abs(end-zero)}" height="${step-8}"><title>${esc(row.label)}: ${fmt(row.gap,1)} pp</title></rect>`;
      }).join("");
      return `<div class="review-gap-plot"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(translate("Brecha de saldo por bloque"))}"><rect class="gap-background" x="${left}" y="${top}" width="${width-left-right}" height="${bottom-top}"/>${grid}${bars}<text x="${(left+width-right)/2}" y="${height-8}" text-anchor="middle">${esc(translate("Brecha de saldo vs. base histórica (pp)"))}</text></svg></div>`;
    }
    window.MarketsCharts=Object.freeze({lineChart,ratingBars,monthlyMatrix,newReviewImpact,reviewBalance,reviewBalanceLegend,reviewGaps});
  })();
</script>
