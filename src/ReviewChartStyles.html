<style>
.annual-chart-layout{display:grid;grid-template-columns:minmax(0,1fr) min(var(--sidebar-width),42%);align-items:start}
.annual-chart-layout:has(.series-summary:empty){grid-template-columns:minmax(0,1fr)}
.annual-chart-layout .chart-wrap svg{min-height:0}
.annual-chart-layout .series-summary{max-block-size:var(--chart-height);overflow:auto}
.annual-chart-layout .series-summary:empty{display:none}
.annual-chart-layout .series-card{grid-template-columns:var(--space-1) minmax(0,1fr) auto;overflow-wrap:anywhere}
@media(max-width:780px){
  .annual-chart-layout .series-summary,.annual-chart-layout .series-card{padding:var(--space-1)}
  .annual-chart-layout .series-card{grid-template-columns:var(--space-1) minmax(0,1fr)}
  .annual-chart-layout .series-card>b{grid-column:2}
}
/* News Radar chart styles scoped to the monthly balance card. */
#review-balance-panel .trend-chart svg{width:100%;display:block;overflow:visible}
#review-balance-panel .trend-chart svg text{fill:var(--color-primary-text-secondary);font-size:var(--text-s);font-family:var(--font-body)}
#review-balance-panel .chart-grid{stroke:var(--color-primary-border);stroke-dasharray:4 6;stroke-width:var(--stroke)}

#review-gap-panel .review-gap-plot{width:100%;overflow-x:auto;margin-block:var(--space-3)}

#review-gap-panel .gap-positive{fill:var(--color-primary-text-positive)}

.analytics-app{width:min(100%,var(--sidebar-width));margin-bottom:var(--space-2)}
.section-head h2>.icon{margin-inline-end:var(--space-1);vertical-align:middle}
.review-gap-table .admin-table th[scope=col]:not(:first-child),.review-gap-table .admin-table td{text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}

#review-balance-panel .geo-count{font-weight:500}
#review-balance-panel .geo-track{grid-column:span 2;display:block;height:var(--focus-offset);background:var(--color-primary-border);border-radius:var(--radius-component);overflow:hidden}
#review-balance-panel .geo-track>span{display:block;height:100%;background:var(--color-primary-bg-action);border-radius:inherit}

#review-balance-panel .identity-label i{width:var(--space-1);height:var(--space-1);border-radius:50%;flex:none}
@media(max-width:767px){#review-balance-panel .map-layout{grid-template-columns:1fr}#review-balance-panel .geo-entities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--space-2)}}
