.radar-filters{
  --color-primary-bg-action:#001391;
  --color-primary-bg-action-pressed:#070e46;
  --color-primary-bg-alternative:#ffffff;
  --color-primary-bg-surface:#f7f8f8;
  --color-primary-text-main:#070e46;
  --color-primary-text-secondary:#46536d;
  --color-primary-text-on-main:#ffffff;
  --color-primary-border:#e2e6ea;
  --color-primary-ui-system-focus:#0c6dff;
  --space-1:8px;
  --space-2:16px;
  --space-3:24px;
  --radius-container:16px;
  --radius-component:8px;
  --font-body:'Benton Sans BBVA', Arial, sans-serif;
  --font-heading:'Tiempos Headline', Georgia, serif;
  --text-s:12px;
  --line-s:16px;
  --text-m:15px;
  --line-m:24px;
  --text-l:20px;
  --text-xl:24px;
  --line-xl:40px;
  --text-2xl:32px;
  --line-2xl:48px;
  --sidebar-width:272px;
  --control-height:48px;
  --icon-size:24px;
  --stroke:1px;
  --focus-width:2px;
  --focus-offset:4px;
  --shadow-panel:0 4px 24px color-mix(in srgb, var(--color-primary-bg-action-pressed) 4%, transparent);
  --dialog-width:560px;
  --transition-duration:160ms;
  --color-primary-bg-hover:color-mix(in srgb, var(--color-primary-border) 60%, var(--color-primary-bg-surface));
  --date-field-width:168px;
}
.radar-filters :is(button,input,select){font:inherit;max-width:100%;min-width:0}
.radar-filters .button{border:var(--stroke) solid var(--color-primary-border);background:var(--color-primary-bg-alternative);color:var(--color-primary-bg-action);border-radius:var(--radius-component);padding:var(--space-1) var(--space-2);min-height:var(--control-height);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);transition:background var(--transition-duration) ease,border-color var(--transition-duration) ease}
.radar-filters .filter-icon{width:var(--icon-size);height:var(--icon-size);fill:currentColor;flex-shrink:0}
.radar-filters .button:hover{background:var(--color-primary-bg-surface);border-color:var(--color-primary-bg-action);text-decoration:none}
.radar-filters .button.primary{background:var(--color-primary-bg-action);border-color:var(--color-primary-bg-action);color:var(--color-primary-text-on-main)}
.radar-filters .button.primary:hover{background:var(--color-primary-bg-action-pressed)}
.radar-filters label{display:grid;gap:var(--space-1);font-weight:500;font-size:var(--text-s);line-height:var(--line-s)}
.radar-filters input,.radar-filters select{width:100%;min-width:0;color:var(--color-primary-text-main);background:var(--color-primary-bg-alternative);border:var(--stroke) solid var(--color-primary-border);border-radius:var(--radius-component);padding:var(--space-1) var(--space-2);min-height:var(--control-height);font-size:var(--text-m);font-weight:400}
.radar-filters input:hover,.radar-filters select:hover{border-color:var(--color-primary-text-secondary)}
.radar-filters .filter-chips{display:flex;flex-wrap:wrap;gap:var(--space-1);padding-top:var(--space-2);border-top:var(--stroke) solid var(--color-primary-border)}
.radar-filters .filter-chip{display:inline-flex;align-items:center;gap:var(--space-1);max-width:100%;padding:calc(var(--space-1)/2) var(--space-1);height:var(--control-height);border:var(--stroke) solid var(--color-primary-border);border-radius:var(--radius-component);background:var(--color-primary-bg-surface);color:var(--color-primary-bg-action);font-size:var(--text-s);line-height:var(--line-m);text-align:left}
.radar-filters .filter-chip span:first-child{min-width:0;overflow-wrap:anywhere;line-height:var(--line-s);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.radar-filters .filter-chip [aria-hidden]{font-size:var(--text-l);flex-shrink:0}
.radar-filters .filter-chip:hover{background:var(--color-primary-bg-hover);border-color:var(--color-primary-bg-action)}
.radar-filters .record-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--sidebar-width)),1fr));gap:var(--space-2);align-items:end;margin-block:var(--space-3)}
.radar-filters .filter-dialog{margin:0;height:100dvh;max-height:100dvh;width:min(var(--dialog-width),100%);max-width:100%;border:0;border-radius:0 var(--radius-container) var(--radius-container) 0;overflow-y:auto;overflow-x:hidden;padding:var(--space-3);color:var(--color-primary-text-main);background:var(--color-primary-bg-alternative);box-shadow:var(--shadow-panel)}
.radar-filters .filter-dialog::backdrop{background:color-mix(in srgb,var(--color-primary-bg-action-pressed) 65%,transparent)}
.radar-filters .dialog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2)}
.radar-filters .filter-dialog-actions{position:sticky;bottom:calc(-1 * var(--space-3));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-1);padding:var(--space-2) 0;background:var(--color-primary-bg-alternative);border-top:var(--stroke) solid var(--color-primary-border);z-index:2}
.radar-filters .filter-dialog-actions .primary{grid-column:1/-1}
.radar-filters .filter-dialog-actions>*{min-width:0;overflow-wrap:anywhere}
