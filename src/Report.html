<script>
  (()=>{
    "use strict";
    const D=window.MarketsDomain,U=window.MarketsUI,C=window.MarketsCharts;
    const finite=D.finite;
    const esc=value=>U.esc(value==null?"":String(value));
    const fmt=(value,digits=1)=>finite(value)?value.toLocaleString("es-ES",{minimumFractionDigits:digits,maximumFractionDigits:digits}):"—";
    const integer=value=>finite(value)?Math.round(value).toLocaleString("es-ES"):"—";
    const signed=value=>{if(!finite(value))return"—";const normalized=Math.abs(value)<.005?0:value;return`${normalized>0?"+":""}${fmt(normalized,2)}`};
    const pct=value=>finite(value)?`${fmt(value*100,0)}%`:"—";
    const dateLabel=value=>{if(!value)return"—";const date=/^\d{4}-\d{2}-\d{2}$/.test(String(value))?new Date(`${value}T12:00:00`):new Date(value);return Number.isNaN(date.getTime())?String(value):new Intl.DateTimeFormat("es-ES",{day:"2-digit",month:"long",year:"numeric"}).format(date)};
    const dateTimeLabel=value=>{const date=new Date(value);return Number.isNaN(date.getTime())?"—":new Intl.DateTimeFormat("es-ES",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(date)};
    const monthLabel=value=>value?new Intl.DateTimeFormat("es-ES",{month:"short",year:"2-digit"}).format(new Date(`${value}-15T12:00:00`)):"—";
    const countryName=(code,meta)=>D.config.countries[code]||meta?.countries?.find(item=>item.code===code)?.name||code;
    const platformOrder=platform=>D.config.platforms.indexOf(platform);
    const tone=value=>!finite(value)?"neutral":value>.005?"positive":value<-.005?"negative":"neutral";

    function render(input){
      const target=input?.target;
      if(!target)throw new Error("No se ha encontrado el contenedor del informe.");
      const meta=input.meta||{},snapshot=input.snapshot||[],trends=input.trends||[],segment=input.benchmarkSegment||"BANK",generatedAt=input.generatedAt||new Date();
      const selection={country:"ALL",platform:"ALL"};
      const bbva=snapshot.filter(row=>row.isBbva);
      const observed=bbva.filter(row=>finite(row.rating));
      const competitive=D.selectionRows(snapshot,selection,segment,true).filter(row=>finite(row.rating));
      const volume=D.volumeSummary(bbva);
      const leaders=D.countBbvaLeaders(competitive);
      const average=D.mean(observed.map(row=>row.rating));
      const expected=bbva.length;
      const fresh=bbva.filter(row=>row.fresh&&finite(row.rating)).length;
      const coverage=expected?fresh/expected:null;
      const period=D.periodModel(trends,"","").period;
      const evolution=D.evolutionKpis(D.trendRows(trends,selection),snapshot,selection,period);
      const series=D.prepareSeries(D.trendRows(trends,selection),selection);
      const chart=C.lineChart(series,{period,idPrefix:"report",format:fmt,monthLabel,allMarkets:true,context:"BBVA Empresas en todos los mercados"});
      const geography=buildGeography(bbva,meta);
      const benchmark=buildBenchmark(competitive,meta);
      const movements=buildMovements(series);
      const detail=buildDetail(bbva,benchmark,meta);
      const signals=buildSignals(observed,benchmark,coverage,meta);
      const incidents=meta.latestRun?.incidents||[];
      const runStatus=meta.latestRun?.status||"SIN RUN";
      const totalPages=9;
      const context={meta,generatedAt,totalPages};
      const pages=[
        coverPage(context,{average,coverage,leaders,volume,period,evolution,runStatus}),
        executivePage(context,{average,coverage,leaders,volume,evolution,signals,observed,expected}),
        geographyPage(context,{geography}),
        benchmarkPage(context,{benchmark:benchmark.slice(0,12),segment},4,"Mercados A–M","03A"),
        benchmarkPage(context,{benchmark:benchmark.slice(12),segment},5,"Mercados P–V","03B"),
        evolutionPage(context,{chart,movements,evolution,period}),
        detailPage(context,{detail:detail.slice(0,12)},7,"Mercados A–M","05A"),
        detailPage(context,{detail:detail.slice(12)},8,"Mercados P–V","05B"),
        qualityPage(context,{coverage,fresh,expected,incidents,runStatus,meta})
      ];
      target.innerHTML=pages.join("");
      target.setAttribute("aria-hidden","false");
      return{pages:totalPages,rows:{geography:geography.length,benchmark:benchmark.length,detail:detail.length},period};
    }

    function buildGeography(rows,meta){
      return Object.entries(D.groupBy(rows,row=>row.countryCode)).map(([countryCode,items])=>{
        const byPlatform=Object.fromEntries(D.config.platforms.map(platform=>[platform,items.find(row=>row.platform===platform)]));
        const rated=items.filter(row=>finite(row.rating));
        return{countryCode,country:countryName(countryCode,meta),rating:D.mean(rated.map(row=>row.rating)),delta:D.mean(rated.map(row=>row.delta30d)),coverage:rated.length/D.config.platforms.length,platforms:byPlatform};
      }).sort((a,b)=>a.country.localeCompare(b.country,"es"));
    }

    function buildBenchmark(rows,meta){
      return Object.values(D.groupBy(rows,row=>`${row.countryCode}|${row.platform}`)).map(group=>{
        const ranked=D.rankRows(group),bbva=ranked.find(row=>row.isBbva),leader=ranked[0],complete=ranked.length>1&&ranked.every(row=>row.rankingComplete);
        return{countryCode:group[0].countryCode,country:countryName(group[0].countryCode,meta),platform:group[0].platform,bbva,leader,complete,apps:ranked.length,gap:bbva&&leader?bbva.rating-leader.rating:null};
      }).sort((a,b)=>a.country.localeCompare(b.country,"es")||platformOrder(a.platform)-platformOrder(b.platform));
    }

    function buildMovements(series){
      return series.map(item=>{const points=[...(item.points||[])].filter(point=>finite(point.value)).sort((a,b)=>a.month.localeCompare(b.month));const current=points.at(-1),previous=points.at(-2);return{label:item.label,current:current?.value,period:current?.month,delta:current&&previous?current.value-previous.value:null}}).sort((a,b)=>(a.delta??0)-(b.delta??0));
    }

    function buildDetail(rows,benchmark,meta){
      const rankMap=new Map(benchmark.map(item=>[`${item.countryCode}|${item.platform}`,item]));
      return [...rows].sort((a,b)=>countryName(a.countryCode,meta).localeCompare(countryName(b.countryCode,meta),"es")||platformOrder(a.platform)-platformOrder(b.platform)).map(row=>{
        const rank=rankMap.get(`${row.countryCode}|${row.platform}`);
        return{...row,country:countryName(row.countryCode,meta),computedRank:rank?.bbva?.computedRank,rankApps:rank?.apps,rankComplete:rank?.complete,leader:rank?.leader};
      });
    }

    function buildSignals(observed,benchmark,coverage,meta){
      const deltas=observed.filter(row=>finite(row.delta30d)).sort((a,b)=>a.delta30d-b.delta30d);
      const worst=deltas[0],best=deltas.at(-1);
      const opportunities=benchmark.filter(item=>item.complete&&item.bbva&&item.bbva.computedRank>1).sort((a,b)=>b.gap-a.gap);
      const defended=benchmark.filter(item=>item.complete&&item.bbva?.computedRank===1).sort((a,b)=>b.gap-a.gap);
      const cards=[];
      if(worst)cards.push({type:"attention",eyebrow:"Prioridad",title:`${countryName(worst.countryCode,meta)} · ${worst.platform}`,copy:`Es el mayor retroceso mensual de BBVA Empresas: ${signed(worst.delta30d)} puntos, con un rating actual de ${fmt(worst.rating,2)}.`});
      if(opportunities[0])cards.push({type:"opportunity",eyebrow:"Oportunidad competitiva",title:`A ${fmt(Math.abs(opportunities[0].gap),2)} pts del líder`,copy:`${opportunities[0].country} · ${opportunities[0].platform}: BBVA ocupa la posición ${opportunities[0].bbva.computedRank} de ${opportunities[0].apps}.`});
      if(defended[0])cards.push({type:"strength",eyebrow:"Fortaleza",title:`Liderazgo en ${defended[0].country}`,copy:`BBVA Empresas lidera ${defended[0].platform} con ${fmt(defended[0].bbva.rating,2)} frente a ${esc(defended[0].leader?.isBbva?"el resto del mercado":defended[0].leader?.appName||"el mercado")}.`});
      else if(best)cards.push({type:"strength",eyebrow:"Mejor impulso",title:`${countryName(best.countryCode,meta)} · ${best.platform}`,copy:`Mejora ${signed(best.delta30d)} puntos en el último mes y alcanza ${fmt(best.rating,2)}.`});
      if(!finite(coverage)||coverage<1)cards.push({type:"quality",eyebrow:"Calidad del dato",title:`Cobertura ${pct(coverage)}`,copy:"Conviene interpretar comparativas y promedios junto con las fuentes pendientes de actualización."});
      return cards.slice(0,4);
    }

    function pageShell(context,pageNumber,title,kicker,body,className=""){
      return`<section class="report-page ${className}"><header class="report-header"><div class="report-header-brand"><span class="bbva-logo" role="img" aria-label="BBVA"></span><i></i><strong>COMMERCIAL</strong></div><div><span>${esc(kicker)}</span><b>${esc(title)}</b></div><time>${esc(dateLabel(context.meta.dataDate))}</time></header><div class="report-content">${body}</div><footer class="report-footer"><span>BBVA COMMERCIAL · Ratings y valoraciones públicas de las stores · Uso interno</span><span>${pageNumber} / ${context.totalPages}</span></footer></section>`;
    }

    function coverPage(context,data){
      return`<section class="report-page report-cover"><div class="report-cover-top"><div class="report-cover-brand"><span class="bbva-logo" role="img" aria-label="BBVA"></span><i></i><strong>COMMERCIAL</strong></div><span class="report-confidential">USO INTERNO</span></div><div class="report-cover-main"><span class="report-overline">Ratings intelligence · Voice of Customer</span><h1>La voz del mercado,<br><em>convertida en decisión.</em></h1><p>Informe ejecutivo de BBVA Empresas en Android, iOS y Huawei. Una lectura global de percepción, posición competitiva y evolución.</p><div class="report-cover-meta"><div><small>Datos a cierre de</small><strong>${esc(dateLabel(context.meta.dataDate))}</strong></div><div><small>Generado</small><strong>${esc(dateTimeLabel(context.generatedAt))}</strong></div><div><small>Benchmark</small><strong>Mercado bancario</strong></div></div></div><div class="report-cover-strip"><article><span>Rating medio</span><strong>${fmt(data.average,2)}</strong><small>Escala 1–5</small></article><article><span>Cobertura</span><strong>${pct(data.coverage)}</strong><small>Apps BBVA actualizadas</small></article><article><span>Liderazgos</span><strong>${integer(data.leaders.value)}</strong><small>de ${integer(data.leaders.comparable)} comparables</small></article><article><span>Reseñas</span><strong>${integer(data.volume.accumulated)}</strong><small>Volumen deduplicado</small></article></div><footer class="report-cover-footer"><span>BBVA COMMERCIAL</span><span>01 / ${context.totalPages}</span></footer></section>`;
    }

    function executivePage(context,data){
      const kpis=[
        ["Rating medio",fmt(data.average,2),"BBVA Empresas · todas las stores"],
        ["Evolución mensual",signed(data.evolution.monthly),data.evolution.monthPeriod?`vs. ${monthLabel(data.evolution.monthPeriod)}`:"Sin cierre comparable"],
        ["Evolución anual",signed(data.evolution.annual),data.evolution.yearPeriod?`vs. ${monthLabel(data.evolution.yearPeriod)}`:"Sin cierre comparable"],
        ["Liderazgos",`${integer(data.leaders.value)} / ${integer(data.leaders.comparable)}`,"Mercados y stores comparables"],
        ["Nuevas reseñas",integer(data.volume.period),"Últimos 30 días · deduplicado"],
        ["Cobertura fresca",pct(data.coverage),`${data.observed.length} con rating · ${data.expected} esperadas`]
      ];
      const body=`<div class="report-title"><span>01 · Lectura ejecutiva</span><h2>Qué merece atención ahora</h2><p>Indicadores preparados para decidir, no para replicar la interfaz.</p></div><div class="report-kpi-grid">${kpis.map((item,index)=>`<article class="report-kpi ${index===1||index===2?tone(index===1?data.evolution.monthly:data.evolution.annual):""}"><span>${esc(item[0])}</span><strong>${esc(item[1])}</strong><small>${esc(item[2])}</small></article>`).join("")}</div><div class="report-section-label"><span>Señales para actuar</span><i></i></div><div class="report-signal-grid">${data.signals.map(signal=>`<article class="report-signal ${signal.type}"><span>${esc(signal.eyebrow)}</span><h3>${esc(signal.title)}</h3><p>${esc(signal.copy)}</p></article>`).join("")}</div><aside class="report-note"><strong>Cómo leer esta página</strong><span>Los promedios sintetizan geografías y plataformas. La cobertura y el estado de cada fuente acompañan siempre a la decisión.</span></aside>`;
      return pageShell(context,2,"Resumen ejecutivo","Ratings intelligence",body);
    }

    function geographyPage(context,data){
      const rows=data.geography.map(item=>`<tr><th><span class="report-flag">${esc(D.config.flags[item.countryCode]||"🌐")}</span><div><strong>${esc(item.country)}</strong><small>${Math.round(item.coverage*3)} de 3 stores con rating</small></div></th><td class="report-rating"><strong>${fmt(item.rating,2)}</strong><span class="${tone(item.delta)}">${signed(item.delta)}</span></td>${D.config.platforms.map(platform=>platformCell(item.platforms[platform])).join("")}<td><span class="report-coverage"><i style="width:${Math.round(item.coverage*100)}%"></i></span><small>${pct(item.coverage)}</small></td></tr>`).join("");
      const body=`<div class="report-title"><span>02 · Panorama geográfico</span><h2>BBVA Empresas, mercado a mercado</h2><p>Rating actual y variación a 30 días. El promedio territorial pondera por igual las stores disponibles.</p></div><div class="report-table-wrap"><table class="report-table report-geo-table"><thead><tr><th>Mercado</th><th>Media</th>${D.config.platforms.map(platform=>`<th>${esc(platform)}</th>`).join("")}<th>Cobertura</th></tr></thead><tbody>${rows}</tbody></table></div><div class="report-legend"><span><i class="positive"></i> Mejora</span><span><i class="negative"></i> Retroceso</span><span><i class="neutral"></i> Estable o sin comparable</span><small>La variación indicada corresponde a 30 días.</small></div>`;
      return pageShell(context,3,"Panorama geográfico","BBVA Empresas",body);
    }

    function platformCell(row){
      if(!row||!finite(row.rating))return`<td class="report-platform-cell missing"><strong>—</strong><small>Fuente pendiente</small></td>`;
      return`<td class="report-platform-cell"><strong>${fmt(row.rating,2)}</strong><small class="${tone(row.delta30d)}">${signed(row.delta30d)}</small></td>`;
    }

    function benchmarkPage(context,data,pageNumber,rangeLabel,sectionNumber){
      const rows=data.benchmark.map(item=>{const isLeader=item.bbva?.computedRank===1&&item.complete;const leaderName=item.leader?.isBbva?"BBVA Empresas":item.leader?.appName||"—";return`<tr><th><strong>${esc(item.country)}</strong><small>${esc(item.platform)}</small></th><td><strong>${fmt(item.bbva?.rating,2)}</strong></td><td><span class="report-rank ${isLeader?"leader":""}">${item.complete&&item.bbva?`${item.bbva.computedRank} / ${item.apps}`:"WIP"}</span></td><td><strong>${esc(leaderName)}</strong><small>${fmt(item.leader?.rating,2)}</small></td><td class="${tone(item.gap)}"><strong>${signed(item.gap)}</strong></td><td><span class="report-quality ${item.complete?"complete":"pending"}">${item.complete?"Comparable":"Cobertura parcial"}</span></td></tr>`}).join("");
      const body=`<div class="report-title compact"><span>${esc(sectionNumber)} · Posición competitiva</span><h2>Dónde lideramos y dónde cerrar distancia</h2><p>${esc(D.config.segmentLabels[data.segment]||data.segment)} · ${esc(rangeLabel)} · clasificación por mercado y plataforma.</p></div><div class="report-table-wrap"><table class="report-table report-benchmark-table"><thead><tr><th>Mercado / store</th><th>BBVA</th><th>Posición</th><th>Líder</th><th>Brecha</th><th>Fiabilidad</th></tr></thead><tbody>${rows}</tbody></table></div><aside class="report-note compact"><strong>Brecha</strong><span>Diferencia entre el rating de BBVA Empresas y el líder. Una posición solo se presenta como comparable cuando la carga incluye el conjunto esperado de aplicaciones.</span></aside>`;
      return pageShell(context,pageNumber,"Benchmark competitivo",rangeLabel,body);
    }

    function evolutionPage(context,data){
      const body=`<div class="report-title compact"><span>04 · Evolución</span><h2>La trayectoria detrás del dato actual</h2><p>BBVA Empresas por geografía · hasta ${esc(monthLabel(data.period))}.</p></div><div class="report-evolution-kpis"><article><span>Cierre</span><strong>${fmt(data.evolution.current,2)}</strong><small>${esc(monthLabel(data.evolution.currentPeriod))}</small></article><article class="${tone(data.evolution.monthly)}"><span>vs. mes anterior</span><strong>${signed(data.evolution.monthly)}</strong><small>${esc(monthLabel(data.evolution.monthPeriod))}</small></article><article class="${tone(data.evolution.annual)}"><span>vs. año anterior</span><strong>${signed(data.evolution.annual)}</strong><small>${esc(monthLabel(data.evolution.yearPeriod))}</small></article><article><span>Cobertura del cierre</span><strong>${pct(data.evolution.coverage)}</strong><small>${integer(data.evolution.observed)} de ${integer(data.evolution.expected)} apps</small></article></div><div class="report-evolution-layout"><section class="report-chart"><div>${data.chart.svg}</div><div class="report-chart-legend">${data.chart.legend}</div></section><aside class="report-movements"><h3>Último movimiento</h3><p>Variación frente al cierre anterior disponible.</p>${data.movements.slice(0,8).map(item=>`<div><span>${esc(item.label.replace("BBVA Empresas ",""))}</span><strong>${fmt(item.current,2)}</strong><b class="${tone(item.delta)}">${signed(item.delta)}</b></div>`).join("")}</aside></div>`;
      return pageShell(context,6,"Evolución de ratings","BBVA Empresas",body);
    }

    function detailPage(context,data,pageNumber,rangeLabel,sectionNumber){
      const rows=data.detail.map(row=>`<tr><th><strong>${esc(row.country)}</strong><small>${esc(row.platform)}</small></th><td><strong>${fmt(row.rating,2)}</strong><small class="${tone(row.delta30d)}">${signed(row.delta30d)}</small></td><td>${row.rankComplete&&row.computedRank?`<strong>${row.computedRank} / ${row.rankApps}</strong>`:"<span class=\"report-quality pending\">WIP</span>"}</td><td><strong>${row.leader?esc(row.leader.isBbva?"BBVA Empresas":row.leader.appName):"—"}</strong><small>${fmt(row.leader?.rating,2)}</small></td><td><strong>${row.volumeScope==="SHARED_LISTING"?"Compartido":integer(row.ratingCount)}</strong><small>${row.volumeScope==="SHARED_LISTING"?"Listing multipaís":`${integer(row.ratingCountDelta30d)} nuevas`}</small></td><td><span class="report-quality ${row.fresh&&finite(row.rating)?"complete":"pending"}">${row.fresh&&finite(row.rating)?"Actualizado":"Fuente pendiente"}</span></td></tr>`).join("");
      const body=`<div class="report-title compact"><span>${esc(sectionNumber)} · Anexo de gestión</span><h2>Detalle operativo por store</h2><p>${esc(rangeLabel)} · una fila por mercado y plataforma para facilitar el seguimiento local.</p></div><div class="report-table-wrap"><table class="report-table report-detail-table"><thead><tr><th>Mercado / store</th><th>Rating / Δ30d</th><th>Posición</th><th>Líder</th><th>Reseñas</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      return pageShell(context,pageNumber,"Detalle por store",rangeLabel,body);
    }

    function qualityPage(context,data){
      const run=data.meta.latestRun||{};
      const incidents=data.incidents.length?data.incidents.slice(0,8).map(item=>`<article><span>${esc(`${D.config.flags[item.countryCode]||"🌐"} ${countryName(item.countryCode,data.meta)} · ${item.platform||"—"}`)}</span><strong>${esc(item.status||"Incidencia")}</strong><p>${esc(item.detail||item.message||item.appKey||"Fuente pendiente de revisión")}</p></article>`).join(""):`<div class="report-quality-ok"><i>✓</i><div><strong>Sin incidencias declaradas</strong><span>La última actualización no ha registrado errores de fuente.</span></div></div>`;
      const body=`<div class="report-title"><span>06 · Confianza y metodología</span><h2>Qué sabemos y con qué nivel de certeza</h2><p>La calidad del dato forma parte del informe, no de una nota al pie.</p></div><div class="report-quality-grid"><article><span>Estado de ejecución</span><strong>${esc(data.runStatus)}</strong><small>${esc(dateTimeLabel(run.startedAt))}</small></article><article><span>Apps actualizadas</span><strong>${integer(run.appsOk??data.fresh)} / ${integer(run.appsTotal??data.expected)}</strong><small>Última carga</small></article><article><span>Cobertura BBVA</span><strong>${pct(data.coverage)}</strong><small>${data.fresh} fuentes con rating fresco</small></article><article><span>Versión del dato</span><strong>${esc(data.meta.codeVersion||"—")}</strong><small>Web ${esc(data.meta.webVersion||"—")}</small></article></div><div class="report-method-layout"><section><div class="report-section-label"><span>Incidencias y fuentes pendientes</span><i></i></div><div class="report-incident-list">${incidents}</div></section><aside class="report-method"><h3>Metodología</h3><dl><div><dt>Rating medio</dt><dd>Media simple de los ratings disponibles de BBVA Empresas.</dd></div><div><dt>Volumen</dt><dd>Reseñas deduplicadas por listing. Los paquetes Android compartidos no se suman por país.</dd></div><div><dt>Benchmark</dt><dd>La posición se valida únicamente con el conjunto competitivo completo.</dd></div><div><dt>Evolución</dt><dd>Cierres mensuales de BBVA Empresas por mercado; las ausencias no se imputan.</dd></div></dl></aside></div><div class="report-closing"><span>Del dato a la decisión</span><strong>Priorizar · contrastar · actuar · medir de nuevo</strong></div>`;
      return pageShell(context,9,"Calidad del dato","Gobierno y trazabilidad",body);
    }

    window.MarketsReport=Object.freeze({render});
  })();
</script>
